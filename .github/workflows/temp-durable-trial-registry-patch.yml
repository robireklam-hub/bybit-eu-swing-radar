name: Temporary durable trial registry patch

on:
  push:
    branches:
      - research/durable-trial-registry-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/durable-trial-registry-v1
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Apply deterministic integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bybit_eu_swing_radar/backend/app/research_swing_liquidity_api.py')
          text = path.read_text()

          old = 'from research.research_governance import snapshot_governance_metadata\nfrom research.swing_liquidity_event_builder import build_trigger_events\n'
          new = 'from research.research_governance import snapshot_governance_metadata\nfrom research.research_trial_registry import ensure_trial_registered, trial_registry_status\nfrom research.swing_liquidity_event_builder import build_trigger_events\n'
          assert text.count(old) == 1, 'trial registry import anchor mismatch'
          text = text.replace(old, new, 1)

          old = '''        async with conn.transaction():\n            await conn.execute(SCHEMA_SQL)\n            result = await conn.execute(\n'''
          new = '''        async with conn.transaction():\n            await conn.execute(SCHEMA_SQL)\n            await ensure_trial_registered(\n                conn,\n                STUDY,\n                source_commit_sha=os.getenv("RAILWAY_GIT_COMMIT_SHA") or None,\n            )\n            result = await conn.execute(\n'''
          assert text.count(old) == 1, 'trial registration persist anchor mismatch'
          text = text.replace(old, new, 1)

          old = '''async def forward_status() -> dict[str, Any]:\n    conn = await asyncpg.connect(settings.database_url)\n    try:\n        await conn.execute(SCHEMA_SQL)\n        capture = await conn.fetchrow(\n'''
          new = '''async def forward_status() -> dict[str, Any]:\n    conn = await asyncpg.connect(settings.database_url)\n    try:\n        await conn.execute(SCHEMA_SQL)\n        registry = await trial_registry_status(conn, STUDY)\n        capture = await conn.fetchrow(\n'''
          assert text.count(old) == 1, 'trial registry status anchor mismatch'
          text = text.replace(old, new, 1)

          old = '''        "study": STUDY,\n        "capture_count": int(capture["capture_count"] or 0),\n'''
          new = '''        "study": STUDY,\n        "trial_registry": registry,\n        "capture_count": int(capture["capture_count"] or 0),\n'''
          assert text.count(old) == 1, 'trial registry response anchor mismatch'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run focused and full backend tests
        working-directory: bybit_eu_swing_radar/backend
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python -m pytest -q test_research_governance.py test_research_trial_registry.py test_research_swing_liquidity_api.py
          python -m pytest -q
          python -m compileall -q app research flow_context.py flow_worker.py

      - name: Commit clean source patch and self-delete
        run: |
          rm -f .github/workflows/temp-durable-trial-registry-patch.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bybit_eu_swing_radar/backend/app/research_swing_liquidity_api.py \
                  bybit_eu_swing_radar/backend/research/research_trial_registry.py \
                  bybit_eu_swing_radar/backend/test_research_trial_registry.py \
                  .github/workflows/temp-durable-trial-registry-patch.yml
          git diff --cached --check
          git commit -m 'Register frozen research trials durably'
          git push origin HEAD:research/durable-trial-registry-v1
