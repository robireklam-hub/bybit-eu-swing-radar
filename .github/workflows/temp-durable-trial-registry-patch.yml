name: Temporary durable trial registry patch

on:
  push:
    branches:
      - research/durable-trial-registry-v1

permissions:
  contents: write
  statuses: write

concurrency:
  group: durable-trial-registry-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark patch pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"research/trial-registry-patch\",\"description\":\"Applying immutable trial registry integration\"}"

      - uses: actions/checkout@v7
        with:
          ref: research/durable-trial-registry-v1
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Apply deterministic integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bybit_eu_swing_radar/backend/app/research_swing_liquidity_api.py')
          text = path.read_text()
          pairs = [
              (
                  'from research.research_governance import snapshot_governance_metadata\nfrom research.swing_liquidity_event_builder import build_trigger_events\n',
                  'from research.research_governance import snapshot_governance_metadata\nfrom research.research_trial_registry import ensure_trial_registered, trial_registry_status\nfrom research.swing_liquidity_event_builder import build_trigger_events\n',
                  'import',
              ),
              (
                  '        async with conn.transaction():\n            await conn.execute(SCHEMA_SQL)\n            result = await conn.execute(\n',
                  '        async with conn.transaction():\n            await conn.execute(SCHEMA_SQL)\n            await ensure_trial_registered(\n                conn,\n                STUDY,\n                source_commit_sha=os.getenv("RAILWAY_GIT_COMMIT_SHA") or None,\n            )\n            result = await conn.execute(\n',
                  'persistence',
              ),
              (
                  'async def forward_status() -> dict[str, Any]:\n    conn = await asyncpg.connect(settings.database_url)\n    try:\n        await conn.execute(SCHEMA_SQL)\n        capture = await conn.fetchrow(\n',
                  'async def forward_status() -> dict[str, Any]:\n    conn = await asyncpg.connect(settings.database_url)\n    try:\n        await conn.execute(SCHEMA_SQL)\n        registry = await trial_registry_status(conn, STUDY)\n        capture = await conn.fetchrow(\n',
                  'status query',
              ),
              (
                  '        "study": STUDY,\n        "capture_count": int(capture["capture_count"] or 0),\n',
                  '        "study": STUDY,\n        "trial_registry": registry,\n        "capture_count": int(capture["capture_count"] or 0),\n',
                  'status response',
              ),
          ]
          for old, new, label in pairs:
              assert text.count(old) == 1, f'{label} anchor mismatch'
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install and verify
        working-directory: bybit_eu_swing_radar/backend
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pytest -q test_research_governance.py test_research_trial_registry.py test_research_swing_liquidity_api.py
          python -m pytest -q
          python -m compileall -q app research flow_context.py flow_worker.py

      - name: Commit clean patch and remove temporary files
        run: |
          rm -f .github/workflows/temp-durable-trial-registry-patch.yml .trial-registry-ci-trigger
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Register frozen research trials durably'
          git push origin HEAD:research/durable-trial-registry-v1

      - name: Mark patch success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"research/trial-registry-patch\",\"description\":\"Immutable trial registry patch and tests passed\"}"

      - name: Mark patch failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"research/trial-registry-patch\",\"description\":\"Immutable trial registry patch failed\"}"
