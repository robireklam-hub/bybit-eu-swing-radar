name: TEMP apply day v0.7.6 patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-once:
    if: github.head_ref == 'feature/day-v076-setup-entry-state'
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/temp_apply_day_v076.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/temp_apply_day_v076.py
          rm .github/workflows/temp-apply-day-v076.yml

      - name: Commit generated backend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/backend/day_worker.py \
            bybit_eu_swing_radar/backend/app/models.py \
            bybit_eu_swing_radar/backend/app/repository.py \
            bybit_eu_swing_radar/backend/app/main.py \
            bybit_eu_swing_radar/backend/backtest.py \
            bybit_eu_swing_radar/backend/journal_core.py \
            bybit_eu_swing_radar/backend/flow_context.py \
            scripts/temp_apply_day_v076.py \
            .github/workflows/temp-apply-day-v076.yml
          git diff --cached --check
          git commit -m "Day v0.7.6: separate setup validity from entry readiness"
          git push origin HEAD:${{ github.head_ref }}
