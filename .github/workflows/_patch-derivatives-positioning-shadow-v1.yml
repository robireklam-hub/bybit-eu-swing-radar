name: Patch derivatives positioning shadow v1 routes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  RADAR_API_KEY: test-radar-key
  COINALYZE_API_KEY: test-coinalyze-key

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/derivatives-positioning-shadow-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Wire derivatives positioning research routes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bybit_eu_swing_radar/backend/app/main.py')
          text = path.read_text()
          block = '''\n\n# Research-only derivatives positioning shadow. It consumes cached context only\n# and has no strategy/scoring/eligibility/execution mutation path.\nfrom app.research_derivatives_positioning_api import attach_derivatives_positioning_research\n\nattach_derivatives_positioning_research(app, require_api_key)\n'''
          marker = 'attach_derivatives_positioning_research(app, require_api_key)'
          if marker not in text:
              text = text.rstrip() + block
              path.write_text(text)
          PY
      - name: Run targeted tests and route contract
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pytest -q test_derivatives_positioning_shadow.py test_flow_context.py
          python - <<'PY'
          from app.main import app
          routes = {route.path for route in app.routes}
          required = {
              '/v1/research/derivatives-positioning/spec',
              '/v1/research/derivatives-positioning/capture',
              '/v1/research/derivatives-positioning/status',
          }
          missing = required - routes
          assert not missing, f'missing derivatives positioning routes: {sorted(missing)}'
          PY
          python -m compileall -q app research scripts/production_derivatives_positioning_shadow_smoke.py
      - name: Commit validated route wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bybit_eu_swing_radar/backend/app/main.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Research: wire derivatives positioning shadow routes"
          git pull --rebase origin research/derivatives-positioning-shadow-v1
          git push origin HEAD:research/derivatives-positioning-shadow-v1
