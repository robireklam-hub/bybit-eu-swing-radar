name: Diagnose Coin Metrics community BTC metrics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diag/coinmetrics-community-btc-cda3bb9'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe BTC metrics individually and in safe groups
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          base='https://community-api.coinmetrics.io/v4/timeseries/asset-metrics'
          metrics=['AdrActCnt','TxCnt','FeeTotNtv','HashRate','DiffMean','SplyCur']
          def probe(metric_string):
              query=urllib.parse.urlencode({
                  'assets':'btc','metrics':metric_string,'frequency':'1d',
                  'start_time':'2026-08-15','end_time':'2026-08-17',
                  'page_size':'10','paging_from':'start'})
              url=base+'?'+query
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'bybit-eu-provider-audit/1'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=json.loads(r.read().decode())
                      rows=body.get('data') or []
                      keys=sorted({k for row in rows if isinstance(row,dict) for k in row.keys() if k not in {'asset','time'}})
                      print('PROBE='+json.dumps({'metrics':metric_string,'http':r.status,'rows':len(rows),'keys':keys},sort_keys=True))
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode(errors='replace')[:300]
                  print('PROBE='+json.dumps({'metrics':metric_string,'http':exc.code,'error_body':body},sort_keys=True))
          for metric in metrics:
              probe(metric)
          probe(','.join(metrics))
          PY
