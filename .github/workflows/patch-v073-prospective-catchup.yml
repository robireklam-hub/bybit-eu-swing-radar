name: Patch v073 prospective funnel catchup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-v073-prospective-catchup.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'research/v073-prospective-funnel-catchup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply outage catchup patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('bybit_eu_swing_radar/backend/research/prospective_funnel_v073.py')
          text = module.read_text()

          replacements = [
              (
                  'MAX_EVENT_AGE_MINUTES = 90\n\nPROSPECTIVE_SCHEMA_SQL',
                  'MAX_EVENT_AGE_MINUTES = 90\nCAPTURE_OVERLAP_MINUTES = 15\n\nPROSPECTIVE_SCHEMA_SQL',
              ),
              (
                  '    except (TypeError, ValueError):\n        return None\n\n\ndef _event_key',
                  '''    except (TypeError, ValueError):\n        return None\n\n\ndef _capture_lower_bound(\n    captured_at: datetime,\n    prospective_start_at: datetime,\n    previous_capture_at: datetime | None = None,\n) -> datetime:\n    \"\"\"Return a forward-only scan bound that also catches up after worker gaps.\n\n    Normal cadence keeps re-snapshotting the recent 90-minute maturation window.\n    After a longer worker gap, the lower bound expands back to the previous\n    successful capture minus a small overlap, while never crossing the immutable\n    prospective boundary.\n    \"\"\"\n    captured_at = _as_utc(captured_at)\n    prospective_start_at = _as_utc(prospective_start_at)\n    recent_bound = captured_at - timedelta(minutes=MAX_EVENT_AGE_MINUTES)\n    if previous_capture_at is None:\n        return max(prospective_start_at, recent_bound)\n    catchup_bound = _as_utc(previous_capture_at) - timedelta(\n        minutes=CAPTURE_OVERLAP_MINUTES\n    )\n    return max(prospective_start_at, min(recent_bound, catchup_bound))\n\n\ndef _event_key''',
              ),
              (
                  '    prospective_start_at: datetime,\n    source_commit_sha: str | None,',
                  '    prospective_start_at: datetime,\n    previous_capture_at: datetime | None = None,\n    source_commit_sha: str | None,',
              ),
              (
                  '    lower_age_bound = captured_at - timedelta(minutes=MAX_EVENT_AGE_MINUTES)\n    lower_bound = max(prospective_start_at, lower_age_bound)',
                  '''    lower_bound = _capture_lower_bound(\n        captured_at,\n        prospective_start_at,\n        previous_capture_at,\n    )''',
              ),
              (
                  '    prospective_start_at = await _ensure_prospective_boundary(connection, captured_at)\n    rows = _analysis_snapshot_rows(',
                  '''    prospective_start_at = await _ensure_prospective_boundary(connection, captured_at)\n    previous_capture_at = await connection.fetchval(\n        \"\"\"\n        SELECT MAX(captured_at)\n        FROM day_trade_v073_prospective_funnel\n        WHERE spec_version = $1 AND strategy_version = $2\n        \"\"\",\n        SPEC_VERSION,\n        STRATEGY_VERSION,\n    )\n    rows = _analysis_snapshot_rows(''',
              ),
              (
                  '        prospective_start_at=prospective_start_at,\n        source_commit_sha=source_commit_sha,',
                  '        prospective_start_at=prospective_start_at,\n        previous_capture_at=previous_capture_at,\n        source_commit_sha=source_commit_sha,',
              ),
              (
                  '    "MAX_EVENT_AGE_MINUTES",\n    "PROSPECTIVE_SCHEMA_SQL",',
                  '    "CAPTURE_OVERLAP_MINUTES",\n    "MAX_EVENT_AGE_MINUTES",\n    "PROSPECTIVE_SCHEMA_SQL",',
              ),
              (
                  '    "_apply_current_execution_semantics",\n    "_event_key",',
                  '    "_apply_current_execution_semantics",\n    "_capture_lower_bound",\n    "_event_key",',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'module patch match count {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          module.write_text(text)

          tests = Path('bybit_eu_swing_radar/backend/test_v073_prospective_funnel.py')
          t = tests.read_text()
          append = '''\n\ndef test_capture_lower_bound_keeps_recent_maturation_window_on_normal_cadence():\n    prospective = datetime(2026, 8, 18, 12, 0, tzinfo=timezone.utc)\n    captured = datetime(2026, 8, 18, 15, 0, tzinfo=timezone.utc)\n    previous = captured - timedelta(minutes=15)\n    assert funnel._capture_lower_bound(captured, prospective, previous) == (\n        captured - timedelta(minutes=funnel.MAX_EVENT_AGE_MINUTES)\n    )\n\n\ndef test_capture_lower_bound_catches_up_after_long_worker_gap():\n    prospective = datetime(2026, 8, 18, 12, 0, tzinfo=timezone.utc)\n    previous = datetime(2026, 8, 18, 12, 30, tzinfo=timezone.utc)\n    captured = datetime(2026, 8, 18, 16, 0, tzinfo=timezone.utc)\n    assert funnel._capture_lower_bound(captured, prospective, previous) == (\n        previous - timedelta(minutes=funnel.CAPTURE_OVERLAP_MINUTES)\n    )\n\n\ndef test_capture_lower_bound_never_crosses_prospective_boundary():\n    prospective = datetime(2026, 8, 18, 13, 0, tzinfo=timezone.utc)\n    previous = datetime(2026, 8, 18, 12, 30, tzinfo=timezone.utc)\n    captured = datetime(2026, 8, 18, 16, 0, tzinfo=timezone.utc)\n    assert funnel._capture_lower_bound(captured, prospective, previous) == prospective\n'''
          if 'test_capture_lower_bound_catches_up_after_long_worker_gap' in t:
              raise SystemExit('catchup tests already present')
          tests.write_text(t.rstrip() + append + '\n')

          doc = Path('bybit_eu_swing_radar/backend/V073_PROSPECTIVE_FUNNEL_V1.md')
          d = doc.read_text()
          old = 'Recent events are sampled as run snapshots for up to 90 minutes after the sweep. A sweep can therefore have multiple point-in-time snapshots as reclaim/structure/volume/15m confirmation evolves.'
          new = ('Under normal cadence, recent events are sampled as run snapshots for up to 90 minutes after the sweep, so a sweep can have multiple point-in-time snapshots as reclaim/structure/volume/15m confirmation evolves.\n\n'
                 'If the day worker is interrupted for longer than that maturation window, the next successful recorder run catches up from the previous persisted capture with a 15-minute overlap. This catch-up remains bounded by `prospective_start_at`, so it recovers only genuinely forward events and never creates historical backfill.')
          if d.count(old) != 1:
              raise SystemExit('doc patch target mismatch')
          doc.write_text(d.replace(old, new, 1))
          PY

      - name: Remove temporary patch workflow and push
        shell: bash
        run: |
          rm .github/workflows/patch-v073-prospective-catchup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/research/prospective_funnel_v073.py \
                  bybit_eu_swing_radar/backend/test_v073_prospective_funnel.py \
                  bybit_eu_swing_radar/backend/V073_PROSPECTIVE_FUNNEL_V1.md \
                  .github/workflows/patch-v073-prospective-catchup.yml
          git commit -m "Make prospective funnel capture outage-safe"
          git push origin HEAD:${{ github.head_ref }}
