name: Patch prospective funnel standalone
on:
  pull_request:
    paths:
      - '.github/workflows/patch-prospective-funnel-standalone.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact standalone isolation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected block in {path}')
              p.write_text(s.replace(old,new,1))

          day='bybit_eu_swing_radar/backend/day_worker.py'
          replace_once(day,
              'from journal import persist_day_journal\nfrom research.prospective_funnel_v073 import persist_v073_prospective_funnel\nfrom sweep_research import SweepResearchConfig, latest_bar_sweep_setup\n',
              'from journal import persist_day_journal\nfrom sweep_research import SweepResearchConfig, latest_bar_sweep_setup\n')
          replace_once(day,
              '''DAY_TRIGGER_VOLUME_RATIO = env_float("DAY_TRIGGER_VOLUME_RATIO", 1.3)\nDAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS = min(\n    max(env_float("DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS", 8.0), 1.0),\n    30.0,\n)\nDAY_PROSPECTIVE_FUNNEL_INLINE_ENABLED = os.getenv(\n    "DAY_PROSPECTIVE_FUNNEL_INLINE_ENABLED", "false"\n).strip().lower() in {"1", "true", "yes", "on"}\n''',
              '''DAY_TRIGGER_VOLUME_RATIO = env_float("DAY_TRIGGER_VOLUME_RATIO", 1.3)\nPROSPECTIVE_FUNNEL_SPEC_VERSION = "v073-prospective-funnel-v1"\n''')
          replace_once(day,
              '''    bars_by_symbol: dict[str, list[Bar]],\n    analyses: list[DayAnalysis],\n) -> dict[str, Any]:\n''',
              '''    bars_by_symbol: dict[str, list[Bar]],\n) -> dict[str, Any]:\n''')
          start='''            if DAY_PROSPECTIVE_FUNNEL_INLINE_ENABLED:\n                try:\n                    # Research-only sidecar: opt-in only. The default live worker\n                    # path skips this recorder so research cannot block production.\n                    async with connection.transaction():\n                        funnel_status = await asyncio.wait_for(\n                            persist_v073_prospective_funnel(\n                                connection,\n                                analyses,\n                                captured_at=datetime.fromisoformat(scan["data_as_of"]),\n                                source_commit_sha=SOURCE_COMMIT_SHA,\n                                volume_confirmation_ratio=DAY_TRIGGER_VOLUME_RATIO,\n                                live_setups=setups,\n                            ),\n                            timeout=DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS,\n                        )\n                except TimeoutError:\n                    funnel_status = {\n                        "status": "DEGRADED",\n                        "research_only": True,\n                        "label_free": True,\n                        "outcome_labels_stored": False,\n                        "spec_version": "v073-prospective-funnel-v1",\n                        "strategy_version": DAY_STRATEGY_VERSION,\n                        "captured_at": scan["data_as_of"],\n                        "source_commit_sha": SOURCE_COMMIT_SHA,\n                        "reason": (\n                            "PROSPECTIVE_FUNNEL_TIMEOUT_AFTER_"\n                            f"{DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS:g}S"\n                        ),\n                    }\n                except Exception as exc:\n                    funnel_status = {\n                        "status": "DEGRADED",\n                        "research_only": True,\n                        "label_free": True,\n                        "outcome_labels_stored": False,\n                        "spec_version": "v073-prospective-funnel-v1",\n                        "strategy_version": DAY_STRATEGY_VERSION,\n                        "captured_at": scan["data_as_of"],\n                        "source_commit_sha": SOURCE_COMMIT_SHA,\n                        "reason": str(exc),\n                    }\n            else:\n                funnel_status = {\n                    "status": "DISABLED",\n                    "enabled": False,\n                    "research_only": True,\n                    "label_free": True,\n                    "outcome_labels_stored": False,\n                    "spec_version": "v073-prospective-funnel-v1",\n                    "strategy_version": DAY_STRATEGY_VERSION,\n                    "captured_at": scan["data_as_of"],\n                    "source_commit_sha": SOURCE_COMMIT_SHA,\n                    "reason": "INLINE_RECORDER_DISABLED_FOR_LIVE_WORKER_ISOLATION",\n                }\n'''
          repl='''            funnel_status = {\n                "status": "EXTERNALIZED",\n                "enabled": False,\n                "research_only": True,\n                "label_free": True,\n                "outcome_labels_stored": False,\n                "spec_version": PROSPECTIVE_FUNNEL_SPEC_VERSION,\n                "strategy_version": DAY_STRATEGY_VERSION,\n                "captured_at": scan["data_as_of"],\n                "source_commit_sha": SOURCE_COMMIT_SHA,\n                "reason": "STANDALONE_RECORDER_OWNS_CAPTURE",\n                "execution_mode": "STANDALONE_RAILWAY_CRON",\n                "mutation_scope": "NONE",\n            }\n'''
          replace_once(day,start,repl)
          replace_once(day,
              '''            status,\n            bars_by_symbol,\n            analyses,\n        )\n''',
              '''            status,\n            bars_by_symbol,\n        )\n''')

          mod='bybit_eu_swing_radar/backend/research/prospective_funnel_v073.py'
          old='''async def _ensure_prospective_boundary(connection: Any, captured_at: datetime) -> datetime:\n    captured_at = _as_utc(captured_at)\n    await connection.execute(PROSPECTIVE_SCHEMA_SQL)\n'''
          new='''async def _ensure_prospective_schema(connection: Any) -> None:\n    schema_complete = bool(\n        await connection.fetchval(\n            """\n            SELECT\n                to_regclass('public.day_trade_v073_prospective_funnel_meta') IS NOT NULL\n                AND to_regclass('public.day_trade_v073_prospective_funnel') IS NOT NULL\n                AND to_regclass('public.idx_day_trade_v073_prospective_funnel_captured') IS NOT NULL\n                AND to_regclass('public.idx_day_trade_v073_prospective_funnel_event') IS NOT NULL\n                AND to_regclass('public.idx_day_trade_v073_prospective_funnel_symbol_side') IS NOT NULL\n            """\n        )\n    )\n    if schema_complete:\n        return\n    transaction_factory = getattr(connection, "transaction", None)\n    if transaction_factory is None:\n        await connection.execute(PROSPECTIVE_SCHEMA_SQL)\n        return\n    async with transaction_factory():\n        await connection.execute("SET LOCAL lock_timeout = '5s'")\n        await connection.execute("SET LOCAL statement_timeout = '10s'")\n        await connection.execute(PROSPECTIVE_SCHEMA_SQL)\n\n\nasync def _ensure_prospective_boundary(connection: Any, captured_at: datetime) -> datetime:\n    captured_at = _as_utc(captured_at)\n    await _ensure_prospective_schema(connection)\n'''
          replace_once(mod,old,new)

          main='bybit_eu_swing_radar/backend/app/main.py'
          p=Path(main); s=p.read_text()
          marker='attach_geopolitical_event_v2_research(app, require_api_key)\n'
          addition='''attach_geopolitical_event_v2_research(app, require_api_key)\n\n# Research-only standalone v0.7.3 prospective gate-funnel status. Capture runs\n# in its own Railway service and cannot mutate the live day-worker path.\nfrom app.research_prospective_funnel_api import attach_prospective_funnel_research\n\nattach_prospective_funnel_research(app, require_api_key)\n'''
          if 'attach_prospective_funnel_research(app, require_api_key)' not in s:
              if marker not in s: raise SystemExit('main attach marker missing')
              p.write_text(s.replace(marker,addition,1))

          worker='bybit_eu_swing_radar/backend/prospective_funnel_worker.py'
          replace_once(worker,
              'connection = await asyncpg.connect(live.DATABASE_URL, timeout=30)\n',
              'connection = await asyncpg.connect(live.DATABASE_URL, timeout=30, command_timeout=20)\n')

          docs='bybit_eu_swing_radar/backend/V073_PROSPECTIVE_FUNNEL_V1.md'
          p=Path(docs); s=p.read_text()
          note='''\n## Standalone production isolation\n\nProduction capture is owned exclusively by the `prospective-funnel-worker` Railway cron service. The live `day_worker.py` contains no prospective-recorder import, call, timeout, or enable flag; it only emits an `EXTERNALIZED` marker. The standalone recorder writes only the prospective research tables and `day_trade_prospective_funnel_status`. Exact live STRICT provenance is read from the authoritative `day_trade_scan` cache rather than inferred from the research recomputation.\n'''
          if '## Standalone production isolation' not in s:
              p.write_text(s.rstrip()+note+'\n')

          test='bybit_eu_swing_radar/backend/test_prospective_funnel_timeout.py'
          Path(test).write_text('''"""Regression coverage for hard separation of prospective research from live persistence."""\n\nimport pytest\n\nimport day_worker\n\n\nclass _Tx:\n    async def __aenter__(self): return self\n    async def __aexit__(self, exc_type, exc, tb): return False\n\nclass _Connection:\n    def transaction(self): return _Tx()\n    async def close(self): return None\n\n@pytest.mark.asyncio\nasync def test_live_persistence_has_no_inline_prospective_recorder(monkeypatch):\n    connection=_Connection(); cache_writes=[]\n    async def fake_connect(*args, **kwargs): return connection\n    async def fake_journal(*args, **kwargs): return {"new_signals":0,"active_signals":0}\n    async def fake_upsert(_connection,key,payload): cache_writes.append((key,payload))\n    monkeypatch.setattr(day_worker.asyncpg,"connect",fake_connect)\n    monkeypatch.setattr(day_worker,"persist_day_journal",fake_journal)\n    monkeypatch.setattr(day_worker,"upsert_cache",fake_upsert)\n    scan={"data_as_of":"2026-08-18T15:30:00+00:00","data_as_of_budapest":"2026-08-18T17:30:00+02:00"}\n    status={}\n    journal=await day_worker.persist_day_results(scan,[],status,{})\n    assert journal=={"new_signals":0,"active_signals":0}\n    funnel=status["prospective_funnel"]\n    assert funnel["status"]=="EXTERNALIZED"\n    assert funnel["enabled"] is False\n    assert funnel["reason"]=="STANDALONE_RECORDER_OWNS_CAPTURE"\n    assert funnel["execution_mode"]=="STANDALONE_RAILWAY_CRON"\n    assert scan["prospective_funnel"]==funnel\n    assert {key for key,_ in cache_writes} >= {"day_trade_scan","day_trade_status"}\n\ndef test_live_worker_exports_no_inline_recorder_controls():\n    assert not hasattr(day_worker,"persist_v073_prospective_funnel")\n    assert not hasattr(day_worker,"DAY_PROSPECTIVE_FUNNEL_INLINE_ENABLED")\n    assert not hasattr(day_worker,"DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS")\n''')
          PY
          rm .github/workflows/patch-prospective-funnel-standalone.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Isolate prospective funnel in standalone worker'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
