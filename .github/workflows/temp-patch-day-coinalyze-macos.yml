name: Temporary patch day Coinalyze routing macOS

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-macos:
    if: github.head_ref == 'fix/day-coinalyze-market-routing'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/day-coinalyze-market-routing
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: pip install -r requirements.txt
      - name: Apply patch
        run: python scripts/temp_patch_day_coinalyze.py
      - name: Run focused tests and compile
        working-directory: bybit_eu_swing_radar/backend
        run: |
          pytest -q test_day_coinalyze_context.py test_swing_coinalyze_context.py
          python -m compileall -q .
          git diff --check
      - name: Commit Python patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bybit_eu_swing_radar/backend/worker.py bybit_eu_swing_radar/backend/day_worker.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: resolve day Coinalyze exchange routing and health'
            git push origin HEAD:fix/day-coinalyze-market-routing
          fi
