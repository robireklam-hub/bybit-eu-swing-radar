name: Verify day worker exact main 6a80c53

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-exact-main:
    if: github.head_ref == 'ops/redeploy-day-worker-6a80c53'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: 6a80c53f17eebd4972a527055f258b953ca6b44a
      DEPLOY_REQUESTED_AT: '2026-08-18T11:45:44+00:00'
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6a80c53f17eebd4972a527055f258b953ca6b44a

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact-main day-worker run and journal isolation
        shell: bash
        run: |
          python -u - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          expected = os.environ['EXPECTED_SHA']
          deploy_requested_at = datetime.fromisoformat(os.environ['DEPLOY_REQUESTED_AT']).astimezone(timezone.utc)
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          radar_key = os.environ['PRODUCTION_RADAR_API_KEY']

          def get(path, params=None, auth=True, timeout=20):
              url = base + path
              if params:
                  url += '?' + urlencode(params)
              headers = {'Accept': 'application/json', 'User-Agent': 'day-worker-exact-main-verify/1'}
              if auth:
                  headers['X-Radar-Key'] = radar_key
              with urlopen(Request(url, headers=headers), timeout=timeout) as response:
                  payload = json.loads(response.read().decode())
              if not isinstance(payload, dict):
                  raise RuntimeError('non-object API payload for ' + path)
              return payload

          def parse_dt(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(str(value).replace('Z', '+00:00')).astimezone(timezone.utc)
              except ValueError:
                  return None

          version = get('/version', auth=False, timeout=15)
          if version.get('commit_sha') != expected:
              raise SystemExit('FAIL API exact-main SHA mismatch: ' + str(version.get('commit_sha')))

          evidence = None
          for attempt in range(100):
              day = get('/v1/day-trade/status')
              worker = day.get('worker') or {}
              journal = get('/v1/day-trade/journal/summary', {'days': 365, 'signal_class': 'all'})
              latest = journal.get('latest_run') or {}
              run_at = parse_dt(latest.get('run_at'))
              worker_sha = worker.get('source_commit_sha')

              if attempt % 6 == 0:
                  print('DAY_WORKER_VERIFY_PROGRESS=' + json.dumps({
                      'seen_worker_sha': worker_sha,
                      'latest_run_at': latest.get('run_at'),
                      'expected_sha': expected,
                  }, sort_keys=True), flush=True)

              if worker_sha == expected and run_at and run_at >= deploy_requested_at:
                  overall = journal.get('overall') or {}
                  active = int(latest.get('active_signal_count') or 0)
                  open_count = int(overall.get('open_count') or 0)
                  evidence = {
                      'worker_source_commit_sha': worker_sha,
                      'journal_run_at': latest.get('run_at'),
                      'journal_strategy_version': latest.get('strategy_version'),
                      'active_signal_count': active,
                      'summary_open_count': open_count,
                      'triggered_trade_count': latest.get('triggered_trade_count'),
                      'shadow_trigger_count': latest.get('shadow_trigger_count'),
                      'new_signal_count': latest.get('new_signal_count'),
                  }
                  print('EXACT_MAIN_DAY_WORKER_EVIDENCE=' + json.dumps(evidence, sort_keys=True), flush=True)
                  if str(latest.get('strategy_version') or '') != '0.7.3':
                      raise SystemExit('FAIL latest journal run is not v0.7.3')
                  if active != open_count:
                      raise SystemExit(f'FAIL exact-main journal isolation mismatch active={active} open={open_count}')
                  break
              time.sleep(5)

          if evidence is None:
              raise SystemExit('FAIL no fresh exact-main day-worker run observed after the deploy request')

          print('DAY-WORKER EXACT-MAIN DEPLOY AND JOURNAL ISOLATION VERIFIED.', flush=True)
          PY
