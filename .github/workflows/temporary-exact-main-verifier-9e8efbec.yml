name: NEVER MERGE current-production microstructure verifier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: never-merge-current-production-microstructure
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 5fc452c116d373457ab30042b989f77f7c421c0a
    steps:
      - name: Check out current main research scripts
        uses: actions/checkout@v7
        with:
          ref: 9e8efbec7ac2e28331fd4f56472237e57f9e071f

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify deployed production SHA before read-only checks
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          base=os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key=os.environ['PRODUCTION_RADAR_API_KEY']
          expected=os.environ['EXPECTED_SHA']
          req=Request(base+'/version',headers={'Accept':'application/json','X-Radar-Key':key})
          with urlopen(req,timeout=15) as response:
              payload=json.load(response)
          actual=payload.get('commit_sha')
          print(f'PRODUCTION_API_SHA={actual}', flush=True)
          if actual != expected:
              raise SystemExit(f'expected deployed SHA {expected}, got {actual}')
          PY

      - name: Verify microstructure recorder and readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_smoke.py

      - name: Verify preregistered v0.7.3 alignment status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status.py

      - name: Verify preregistered v0.7.4 alignment status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status_v2.py

      - name: Verify preregistered v0.7.5 alignment status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status_v3.py

      - name: Verify successor microstructure effect gates remain closed
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_successor_effect_gate_guard.py

      - name: Verify preregistered v0.7.3 effect status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_effect_status.py
