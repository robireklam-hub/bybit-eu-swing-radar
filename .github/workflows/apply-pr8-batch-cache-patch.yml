name: Apply PR8 batch cache patch

on:
  push:
    branches:
      - fix/flow-status-batch-cache-read

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/flow-status-batch-cache-read
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Apply bounded repository patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bybit_eu_swing_radar/backend/app/repository.py')
          text = path.read_text()

          cache_needle = '''        payload = row["payload"]
                  return json.loads(payload) if isinstance(payload, str) else payload
          '''
          cache_needle = cache_needle.replace('                  return', '        return')
          cache_replacement = cache_needle + '''
              async def get_caches(self, cache_keys: list[str]) -> dict[str, dict]:
                  if not cache_keys:
                      return {}
                  conn = await self._connect()
                  try:
                      rows = await conn.fetch(
                          """
                          SELECT cache_key, payload
                          FROM radar_cache
                          WHERE cache_key = ANY($1::text[])
                          """,
                          cache_keys,
                      )
                  finally:
                      await conn.close()
                  result = {}
                  for row in rows:
                      payload = row["payload"]
                      result[row["cache_key"]] = (
                          json.loads(payload) if isinstance(payload, str) else payload
                      )
                  return result
          '''
          cache_replacement = cache_replacement.replace('\n              async def', '\n    async def')
          cache_replacement = cache_replacement.replace('\n                  ', '\n        ')
          cache_replacement = cache_replacement.replace('\n                      ', '\n            ')
          cache_replacement = cache_replacement.replace('\n                          ', '\n                ')
          cache_replacement = cache_replacement.replace('\n                              ', '\n                    ')
          if text.count(cache_needle) != 1:
              raise SystemExit('get_cache insertion point changed')
          text = text.replace(cache_needle, cache_replacement, 1)

          status_needle = '''    payloads = []
              for symbol in symbols:
                  payloads.append(await repository.get_cache(f"day_trade_flow:{str(symbol).upper()}"))
          '''
          status_needle = status_needle.replace('              for', '    for').replace('                  payloads', '        payloads')
          status_replacement = '''    cache_keys = [f"day_trade_flow:{str(symbol).upper()}" for symbol in symbols]
              payload_by_key = await repository.get_caches(cache_keys)
              payloads = [payload_by_key.get(cache_key) for cache_key in cache_keys]
          '''
          status_replacement = status_replacement.replace('\n              ', '\n    ')
          if text.count(status_needle) != 1:
              raise SystemExit('FlowStatus payload loop changed')
          text = text.replace(status_needle, status_replacement, 1)

          path.write_text(text)
          PY

      - name: Install test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Verify targeted behavior
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pytest -q test_flow_repository_read.py
          python -m py_compile app/repository.py test_flow_repository_read.py
          git diff --check

      - name: Remove temporary patch workflow
        run: git rm .github/workflows/apply-pr8-batch-cache-patch.yml

      - name: Commit tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bybit_eu_swing_radar/backend/app/repository.py
          git status --short
          git commit -m 'Batch FlowStatus cache reads'
          git push origin HEAD:fix/flow-status-batch-cache-read
