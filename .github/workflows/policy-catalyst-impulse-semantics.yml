name: Policy catalyst impulse semantics

on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-catalyst-impulse-semantics-production
  cancel-in-progress: true

jobs:
  semantic-guard:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out expected main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install semantic-test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify deterministic policy-to-impulse semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python -m pytest -q test_policy_catalyst_market_impulse_semantics.py

      - name: Verify exact production response wiring
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ.get('PRODUCTION_RADAR_API_KEY', '')
          expected = os.environ['EXPECTED_SHA']

          def get(path):
              req = urllib.request.Request(base + path, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'policy-catalyst-impulse-semantics/1',
                  'X-Radar-Key': key,
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              if not isinstance(payload, dict):
                  raise RuntimeError('production response is not an object')
              return payload

          for attempt in range(120):
              version = get('/version')
              actual = version.get('source_commit_sha') or version.get('commit_sha') or version.get('git_sha')
              print(f'attempt={attempt + 1} actual={actual} expected={expected}')
              if actual == expected:
                  break
              time.sleep(5)
          else:
              raise SystemExit('exact production API SHA did not converge')

          payload = get('/v1/top-candidates?direction=both&limit=3&min_score=0')
          alerts = payload.get('market_context_alerts')
          if not isinstance(alerts, dict):
              raise SystemExit('market_context_alerts missing from live top-candidates response')
          expected_non_mutation = {
              'context_only': True,
              'hard_gate': False,
              'score_mutation': False,
              'eligibility_mutation': False,
              'execution_mutation': False,
          }
          for field, wanted in expected_non_mutation.items():
              if alerts.get(field) is not wanted:
                  raise SystemExit(f'{field} contract mismatch: {alerts.get(field)!r}')
          if not isinstance(alerts.get('market_impulse'), dict):
              raise SystemExit('market_impulse missing from live response')
          if not isinstance(alerts.get('policy_catalyst'), dict):
              raise SystemExit('policy_catalyst missing from live response')
          policy = alerts.get('reporting_policy') or {}
          if policy.get('must_surface_policy_gap_during_elevated_impulse') is not True:
              raise SystemExit('policy gap during impulse is not mandatory in live reporting contract')
          if policy.get('must_not_be_suppressed_by_trade_score') is not True:
              raise SystemExit('market-context warning can be suppressed by trade score')
          print('POLICY CATALYST IMPULSE SEMANTICS LIVE WIRING VERIFIED.')
          PY
