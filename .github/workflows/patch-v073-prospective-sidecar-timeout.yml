name: Patch v073 prospective sidecar timeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/v073-prospective-sidecar-timeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v073-prospective-sidecar-timeout
          fetch-depth: 0
      - name: Bound research sidecar and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bybit_eu_swing_radar/backend/day_worker.py')
          text = path.read_text()

          old = 'DAY_TRIGGER_VOLUME_RATIO = env_float("DAY_TRIGGER_VOLUME_RATIO", 1.3)\n'
          new = old + '''DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS = min(\n    max(env_float("DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS", 8.0), 1.0),\n    30.0,\n)\n'''
          if old not in text:
              raise SystemExit('constant insertion anchor not found')
          if 'DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS' not in text:
              text = text.replace(old, new, 1)

          old_call = '''                    funnel_status = await persist_v073_prospective_funnel(\n                        connection,\n                        analyses,\n                        captured_at=datetime.fromisoformat(scan["data_as_of"]),\n                        source_commit_sha=SOURCE_COMMIT_SHA,\n                        volume_confirmation_ratio=DAY_TRIGGER_VOLUME_RATIO,\n                        live_setups=setups,\n                    )\n'''
          new_call = '''                    funnel_status = await asyncio.wait_for(\n                        persist_v073_prospective_funnel(\n                            connection,\n                            analyses,\n                            captured_at=datetime.fromisoformat(scan["data_as_of"]),\n                            source_commit_sha=SOURCE_COMMIT_SHA,\n                            volume_confirmation_ratio=DAY_TRIGGER_VOLUME_RATIO,\n                            live_setups=setups,\n                        ),\n                        timeout=DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS,\n                    )\n'''
          if old_call not in text and new_call not in text:
              raise SystemExit('sidecar call anchor not found')
          if old_call in text:
              text = text.replace(old_call, new_call, 1)

          old_except = '''            except Exception as exc:\n                funnel_status = {\n                    "status": "DEGRADED",\n                    "research_only": True,\n                    "label_free": True,\n                    "outcome_labels_stored": False,\n                    "spec_version": "v073-prospective-funnel-v1",\n                    "strategy_version": DAY_STRATEGY_VERSION,\n                    "captured_at": scan["data_as_of"],\n                    "source_commit_sha": SOURCE_COMMIT_SHA,\n                    "reason": str(exc),\n                }\n'''
          new_except = '''            except TimeoutError:\n                funnel_status = {\n                    "status": "DEGRADED",\n                    "research_only": True,\n                    "label_free": True,\n                    "outcome_labels_stored": False,\n                    "spec_version": "v073-prospective-funnel-v1",\n                    "strategy_version": DAY_STRATEGY_VERSION,\n                    "captured_at": scan["data_as_of"],\n                    "source_commit_sha": SOURCE_COMMIT_SHA,\n                    "reason": (\n                        "PROSPECTIVE_FUNNEL_TIMEOUT_AFTER_"\n                        f"{DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS:g}S"\n                    ),\n                }\n            except Exception as exc:\n                funnel_status = {\n                    "status": "DEGRADED",\n                    "research_only": True,\n                    "label_free": True,\n                    "outcome_labels_stored": False,\n                    "spec_version": "v073-prospective-funnel-v1",\n                    "strategy_version": DAY_STRATEGY_VERSION,\n                    "captured_at": scan["data_as_of"],\n                    "source_commit_sha": SOURCE_COMMIT_SHA,\n                    "reason": str(exc),\n                }\n'''
          if old_except not in text and 'PROSPECTIVE_FUNNEL_TIMEOUT_AFTER_' not in text:
              raise SystemExit('sidecar exception anchor not found')
          if old_except in text:
              text = text.replace(old_except, new_except, 1)

          path.write_text(text)

          test = Path('bybit_eu_swing_radar/backend/test_prospective_funnel_timeout.py')
          test.write_text('''import asyncio\n\nimport pytest\n\nimport day_worker\n\n\nclass _Tx:\n    async def __aenter__(self):\n        return self\n\n    async def __aexit__(self, exc_type, exc, tb):\n        return False\n\n\nclass _Connection:\n    def transaction(self):\n        return _Tx()\n\n    async def close(self):\n        return None\n\n\n@pytest.mark.asyncio\nasync def test_prospective_funnel_timeout_degrades_without_blocking_live_persistence(monkeypatch):\n    connection = _Connection()\n    cache_writes = []\n\n    async def fake_connect(*args, **kwargs):\n        return connection\n\n    async def fake_journal(*args, **kwargs):\n        return {"new_signals": 0, "active_signals": 0}\n\n    async def hanging_funnel(*args, **kwargs):\n        await asyncio.sleep(1)\n        return {"status": "COMPLETE"}\n\n    async def fake_upsert(_connection, key, payload):\n        cache_writes.append((key, payload))\n\n    monkeypatch.setattr(day_worker.asyncpg, "connect", fake_connect)\n    monkeypatch.setattr(day_worker, "persist_day_journal", fake_journal)\n    monkeypatch.setattr(day_worker, "persist_v073_prospective_funnel", hanging_funnel)\n    monkeypatch.setattr(day_worker, "upsert_cache", fake_upsert)\n    monkeypatch.setattr(day_worker, "DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS", 0.01)\n\n    scan = {\n        "data_as_of": "2026-08-18T14:45:00+00:00",\n        "data_as_of_budapest": "2026-08-18T16:45:00+02:00",\n    }\n    status = {}\n\n    journal = await day_worker.persist_day_results(scan, [], status, {}, [])\n\n    assert journal == {"new_signals": 0, "active_signals": 0}\n    funnel = status["prospective_funnel"]\n    assert funnel["status"] == "DEGRADED"\n    assert funnel["research_only"] is True\n    assert funnel["label_free"] is True\n    assert funnel["outcome_labels_stored"] is False\n    assert funnel["reason"] == "PROSPECTIVE_FUNNEL_TIMEOUT_AFTER_0.01S"\n    assert scan["prospective_funnel"] == funnel\n    assert {key for key, _ in cache_writes} >= {"day_trade_scan", "day_trade_status"}\n\n\ndef test_prospective_funnel_timeout_is_bounded_by_configuration():\n    assert 1.0 <= day_worker.DAY_PROSPECTIVE_FUNNEL_TIMEOUT_SECONDS <= 30.0\n''')
          PY

          rm .github/workflows/patch-v073-prospective-sidecar-timeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bybit_eu_swing_radar/backend/day_worker.py bybit_eu_swing_radar/backend/test_prospective_funnel_timeout.py .github/workflows/patch-v073-prospective-sidecar-timeout.yml
          git diff --cached --check
          git commit -m 'Fix: bound prospective funnel research sidecar'
          git push origin HEAD:fix/v073-prospective-sidecar-timeout
