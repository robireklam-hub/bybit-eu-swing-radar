name: Microstructure forward recorder smoke

on:
  workflow_run:
    workflows: ["Production Flow freshness smoke"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: microstructure-forward-recorder-smoke
  cancel-in-progress: true

jobs:
  recorder-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out production-verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify research-only forward recorder
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_smoke.py
