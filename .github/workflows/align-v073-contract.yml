name: Align v0.7.3 contracts

on:
  push:
    branches: [feat/day-sweep-v073]

permissions:
  contents: write

jobs:
  align-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/day-sweep-v073
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Apply contract alignment
        run: python scripts/apply_v073_contract_alignment.py

      - name: Run focused v0.7.3 contracts and strategy regressions
        run: |
          python -m pytest -q \
            test_v073_contract_alignment.py \
            test_day_sweep_v073.py \
            test_sweep_research.py \
            test_flow_context.py

      - name: Run full backend test suite
        run: python -m pytest -q

      - name: Compile production modules
        run: python -m compileall -q app day_worker.py journal.py backtest.py sweep_research.py flow_context.py flow_worker.py

      - name: Commit clean contract alignment
        working-directory: .
        run: |
          rm bybit_eu_swing_radar/backend/scripts/apply_v073_contract_alignment.py
          rm .github/workflows/align-v073-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/backend/flow_context.py \
            bybit_eu_swing_radar/backend/app/main.py \
            bybit_eu_swing_radar/action/openapi.yaml \
            bybit_eu_swing_radar/agent/AGENT_INSTRUCTIONS_HU.md \
            bybit_eu_swing_radar/BACKEND_SPEC_HU.md \
            bybit_eu_swing_radar/backend/scripts/apply_v073_contract_alignment.py \
            .github/workflows/align-v073-contract.yml
          git diff --cached --check
          git status --short
          git commit -m "Align v0.7.3 API and Flow contracts"
          git push origin HEAD:feat/day-sweep-v073
