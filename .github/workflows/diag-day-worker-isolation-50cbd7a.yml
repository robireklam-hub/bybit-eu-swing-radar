name: Diagnose day worker isolation 50cbd7a

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diag/day-worker-isolation-50cbd7a'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DEPLOYMENT_ID: 465a0048-f1f6-483e-bc6d-80aa81f6bd41
      EXPECTED_SHA: 50cbd7a480774e2c9dc1e0f0cf8011bdcbc3a3fd
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - name: Read exact-main runtime and production state
        shell: bash
        run: |
          python -u - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          railway='https://backboard.railway.com/graphql/v2'
          token=os.environ['RAILWAY_API_TOKEN']
          deployment=os.environ['DEPLOYMENT_ID']
          base=os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key=os.environ['PRODUCTION_RADAR_API_KEY']
          expected=os.environ['EXPECTED_SHA']

          def gql(query, variables):
              req=Request(railway,data=json.dumps({'query':query,'variables':variables}).encode(),headers={
                  'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','User-Agent':'day-worker-isolation-diag/1'})
              with urlopen(req,timeout=25) as r: payload=json.loads(r.read().decode())
              if payload.get('errors'):
                  raise RuntimeError(json.dumps([{'message':e.get('message'),'path':e.get('path')} for e in payload['errors']]))
              return payload.get('data') or {}

          def get(path, params=None, auth=True):
              url=base+path
              if params: url+='?'+urlencode(params)
              headers={'Accept':'application/json','User-Agent':'day-worker-isolation-diag/1'}
              if auth: headers['X-Radar-Key']=key
              with urlopen(Request(url,headers=headers),timeout=25) as r: payload=json.loads(r.read().decode())
              if not isinstance(payload,dict): raise RuntimeError('non-object '+path)
              return payload

          try:
              q='query deploymentLogs($deploymentId:String!,$limit:Int){deploymentLogs(deploymentId:$deploymentId,limit:$limit){timestamp message severity}}'
              logs=(gql(q,{'deploymentId':deployment,'limit':250}).get('deploymentLogs') or [])
              safe_logs=[{'timestamp':x.get('timestamp'),'severity':x.get('severity'),'message':x.get('message')} for x in logs]
              print('RUNTIME_LOGS='+json.dumps(safe_logs,sort_keys=True),flush=True)
          except Exception as exc:
              print('RUNTIME_LOGS_UNAVAILABLE='+type(exc).__name__,flush=True)

          version=get('/version',auth=False)
          day=get('/v1/day-trade/status')
          journal=get('/v1/day-trade/journal/summary',{'days':365,'signal_class':'all'})
          worker=day.get('worker') or {}
          funnel=day.get('prospective_funnel') or {}
          latest=journal.get('latest_run') or {}
          overall=journal.get('overall') or {}
          safe={
              'api_sha':version.get('commit_sha'),
              'checked_at':day.get('checked_at'),
              'worker_sha':worker.get('source_commit_sha'),
              'worker_status':worker.get('status'),
              'duration_seconds':worker.get('duration_seconds'),
              'funnel_status':funnel.get('status'),
              'funnel_enabled':funnel.get('enabled'),
              'funnel_reason':funnel.get('reason'),
              'funnel_source_sha':funnel.get('source_commit_sha'),
              'journal_run_at':latest.get('run_at'),
              'journal_strategy_version':latest.get('strategy_version'),
              'journal_active':latest.get('active_signal_count'),
              'journal_open':overall.get('open_count'),
          }
          print('ISOLATION_STATE='+json.dumps(safe,sort_keys=True,default=str),flush=True)
          print('EXPECTED_SHA='+expected,flush=True)
          PY
