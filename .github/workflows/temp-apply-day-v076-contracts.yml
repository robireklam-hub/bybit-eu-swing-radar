name: TEMP apply day v0.7.6 contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-once:
    if: github.head_ref == 'feature/day-v076-setup-entry-state'
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic contracts patch
        run: python scripts/temp_apply_day_v076_contracts.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/temp_apply_day_v076_contracts.py
          rm .github/workflows/temp-apply-day-v076-contracts.yml

      - name: Commit generated contract changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/backend/flow_context.py \
            bybit_eu_swing_radar/backend/test_day_impulse_breakout_trigger.py \
            bybit_eu_swing_radar/backend/test_day_breakout_journal_dedupe_v075.py \
            bybit_eu_swing_radar/backend/test_day_sweep_v073.py \
            bybit_eu_swing_radar/backend/test_journal_schema_hotpath.py \
            bybit_eu_swing_radar/backend/test_v073_contract_alignment.py \
            bybit_eu_swing_radar/backend/test_v073_version_isolation.py \
            bybit_eu_swing_radar/action/openapi.yaml \
            bybit_eu_swing_radar/agent/AGENT_INSTRUCTIONS_HU.md \
            scripts/temp_apply_day_v076_contracts.py \
            .github/workflows/temp-apply-day-v076-contracts.yml
          git diff --cached --check
          git commit -m "Day v0.7.6: align contracts and frozen historical tests"
          git push origin HEAD:${{ github.head_ref }}
