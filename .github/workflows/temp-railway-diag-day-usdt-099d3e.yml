name: Temporary Railway diag day USDT 099d3e

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'diag/post-merge-day-usdt-context-099d3e0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      RAILWAY_ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
      API_SERVICE_ID: 6b92a19d-a178-4eab-9b8a-9fed1855319b
      API_DEPLOYMENT_ID: 49ac5430-9d58-4069-bfe6-974e1083de73
      DAY_SERVICE_ID: b740fd25-f72b-4392-b156-7aa3b0c5ffd4
      DAY_DEPLOYMENT_ID: ffcd8c5f-8529-4a08-8cdc-b3be7ef1ddd7
    steps:
      - name: Inspect exact deployment logs
        shell: sh
        run: |
          set -eu
          redact() {
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]"\\]+#postgresql://***#Ig' \
              -e 's#((api[_-]?key|token|secret)[=:][[:space:]]*)[^[:space:],"}]+#\1***#Ig'
          }
          for spec in "api:$API_SERVICE_ID:$API_DEPLOYMENT_ID" "day:$DAY_SERVICE_ID:$DAY_DEPLOYMENT_ID"; do
            name=$(echo "$spec" | cut -d: -f1)
            service=$(echo "$spec" | cut -d: -f2)
            deployment=$(echo "$spec" | cut -d: -f3)
            railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$service" >/tmp/link-$name.txt
            railway deployment list --service "$service" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 6 --json >"/tmp/deployments-$name.json" || true
            railway logs "$deployment" --build --lines 220 --json >"/tmp/build-$name.json" 2>"/tmp/build-$name.err" || true
            railway logs "$deployment" --deployment --lines 320 --json >"/tmp/runtime-$name.json" 2>"/tmp/runtime-$name.err" || true
            echo "===== $name DEPLOYMENT LIST ====="
            cat "/tmp/deployments-$name.json" | tail -c 22000 | redact || true
            for path in "/tmp/build-$name.json" "/tmp/build-$name.err" "/tmp/runtime-$name.json" "/tmp/runtime-$name.err"; do
              echo "===== $path ====="
              if [ -s "$path" ]; then tail -c 30000 "$path" | redact; else echo EMPTY; fi
            done
          done
