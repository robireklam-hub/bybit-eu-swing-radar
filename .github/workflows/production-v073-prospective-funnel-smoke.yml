name: Production v0.7.3 prospective funnel smoke

# Trusted main-only production verification. Pull requests are covered by Backend tests;
# this workflow obtains production credentials only after a successful push-to-main CI run.
on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-v073-prospective-funnel-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_API_SHA: ${{ github.event.workflow_run.head_sha }}
      PROSPECTIVE_FUNNEL_FEATURE_SHA: 327d353edee364209b36e4f486ccd68ef7faed05

    steps:
      - name: Mark production funnel verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'production/v073-prospective-funnel',
              description: 'Prospective funnel production verification running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Check out tested main commit with history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run read-only prospective funnel production smoke
        id: funnel-smoke
        continue-on-error: true
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_v073_prospective_funnel_smoke.py

      - name: Publish production funnel verification status
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.funnel-smoke.outcome }}
        with:
          script: |
            const ok = process.env.SMOKE_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: ok ? 'success' : 'failure',
              context: 'production/v073-prospective-funnel',
              description: ok
                ? 'Prospective funnel production verified'
                : 'Prospective funnel production verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Fail workflow when production smoke failed
        if: steps.funnel-smoke.outcome != 'success'
        run: exit 1
