name: Production v0.7.3 prospective funnel smoke

# Trusted main-only provisioning + production verification. Pull requests never
# receive Railway or production API credentials.
on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-v073-prospective-funnel-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_API_SHA: ${{ github.event.workflow_run.head_sha }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      RAILWAY_ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
      DAY_RADAR_SERVICE_ID: b740fd25-f72b-4392-b156-7aa3b0c5ffd4

    steps:
      - name: Mark production funnel verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'production/v073-prospective-funnel',
              description: 'Prospective capture and DEVELOPMENT gate evaluation running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Check out tested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Preflight existing exact-main prospective capture
        id: preflight
        continue-on-error: true
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/preflight_v073_prospective_funnel.py

      - name: Provision exact-main standalone prospective worker
        id: provision
        if: steps.preflight.outcome != 'success'
        continue-on-error: true
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/provision_prospective_funnel_worker.py

      - name: Verify standalone prospective funnel production capture
        id: funnel-smoke
        if: steps.preflight.outcome != 'success' && steps.provision.outcome == 'success'
        continue-on-error: true
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_v073_prospective_funnel_smoke.py

      - name: Verify first-60 barrier-clear DEVELOPMENT gate
        id: development-gate
        if: >-
          steps.preflight.outcome == 'success' ||
          (steps.provision.outcome == 'success' && steps.funnel-smoke.outcome == 'success')
        continue-on-error: true
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_day_barrier_clear_development_gate_status.py

      - name: Publish production funnel verification status
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          SMOKE_OUTCOME: ${{ steps.funnel-smoke.outcome }}
          DEVELOPMENT_GATE_OUTCOME: ${{ steps.development-gate.outcome }}
        with:
          script: |
            const preflightOk = process.env.PREFLIGHT_OUTCOME === 'success';
            const fallbackOk = process.env.PROVISION_OUTCOME === 'success' && process.env.SMOKE_OUTCOME === 'success';
            const captureOk = preflightOk || fallbackOk;
            const gateOk = process.env.DEVELOPMENT_GATE_OUTCOME === 'success';
            const ok = captureOk && gateOk;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: ok ? 'success' : 'failure',
              context: 'production/v073-prospective-funnel',
              description: ok
                ? 'Exact-main prospective capture and DEVELOPMENT gate evaluation verified'
                : (captureOk
                  ? 'Barrier-clear DEVELOPMENT gate verifier failed'
                  : 'Standalone prospective funnel verification failed'),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Fail workflow when production verification failed
        if: >-
          (steps.preflight.outcome != 'success' &&
           (steps.provision.outcome != 'success' || steps.funnel-smoke.outcome != 'success')) ||
          steps.development-gate.outcome != 'success'
        run: exit 1
