name: Verify geopolitical risk production 3b488ca

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/geopolitical-risk-3b488ca'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 3b488caf5b39f8ead6883cfe05fe66e97fed1398
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3b488caf5b39f8ead6883cfe05fe66e97fed1398
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run exact-main geopolitical risk production smoke
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_geopolitical_risk_smoke.py
