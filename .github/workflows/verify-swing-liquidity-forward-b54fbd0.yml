name: Verify swing liquidity forward b54fbd0

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b54fbd01e086d1f7d1b57d6324d32241e11e2d89
      - name: Inspect durable swing liquidity forward status
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          url=os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')+'/v1/research/swing-liquidity/forward-status'
          req=Request(url,headers={'Accept':'application/json','User-Agent':'swing-liquidity-forward-readonly/1','X-Radar-Key':os.environ['PRODUCTION_RADAR_API_KEY']})
          with urlopen(req, timeout=15) as r:
              p=json.load(r)
          safe={k:p.get(k) for k in ('research_only','live_strategy_mutated','promotion_allowed','study','capture_count','first_capture_at','last_capture_at','candidate_observations','orderbook_errors','turnover_tiers','spread_tiers','development_target_matured_events','validation_target_matured_events')}
          print('SWING_LIQUIDITY_FORWARD_STATUS='+json.dumps(safe,sort_keys=True))
          errors=[]
          if p.get('research_only') is not True: errors.append('research_only_not_true')
          if p.get('live_strategy_mutated') is not False: errors.append('live_strategy_mutated_not_false')
          if p.get('promotion_allowed') is not False: errors.append('promotion_allowed_not_false')
          if p.get('study')!='swing-liquidity-validation-v1': errors.append('unexpected_study')
          if int(p.get('capture_count') or 0)<=0: errors.append('no_durable_captures')
          if int(p.get('candidate_observations') or 0)<=0: errors.append('no_durable_observations')
          last=p.get('last_capture_at')
          if not last: errors.append('last_capture_at_missing')
          else:
              dt=datetime.fromisoformat(last.replace('Z','+00:00')).astimezone(timezone.utc)
              age=(datetime.now(timezone.utc)-dt).total_seconds()
              print(f'LAST_CAPTURE_AGE_SECONDS={age:.1f}')
              if age>7200: errors.append(f'capture_progression_stalled:{age:.1f}s')
          tiers=p.get('turnover_tiers') or {}
          below={'LT_25K','25K_50K','50K_100K','<25k','25k-50k','50k-100k'}
          above={'100K_250K','250K_1M','GE_1M','100-250k','250k-1m','>=1m'}
          def pos(names):
              return any(k in names and int(v or 0)>0 for k,v in tiers.items())
          if not pos(below): errors.append('missing_below_100k_research_exposure')
          if not pos(above): errors.append('missing_current_gate_comparator_exposure')
          if not (p.get('spread_tiers') or {}): errors.append('missing_spread_tier_coverage')
          if errors:
              print('FAIL '+' | '.join(errors)); raise SystemExit(1)
          print('SWING LIQUIDITY DURABLE FORWARD STATE VERIFIED.')
          PY
