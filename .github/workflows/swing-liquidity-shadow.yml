name: Swing liquidity shadow capture

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swing-liquidity-shadow-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      BYBIT_EU_PUBLIC_BASE_URL: https://api.bybit.eu
      SWING_LIQUIDITY_SHADOW_OUTPUT: swing-liquidity-shadow.json
    steps:
      - name: Check out research contract
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check whether durable capture is due
        id: due
        working-directory: bybit_eu_swing_radar/backend
        env:
          SWING_LIQUIDITY_MIN_AGE_SECONDS: ${{ github.event.schedule == '53 * * * *' && '4500' || '2700' }}
        run: python scripts/swing_liquidity_capture_due.py

      - name: Skip healthy duplicate capture
        if: steps.due.outputs.capture_due != 'true'
        run: echo "Durable swing-liquidity capture is recent enough; skipping this trigger."

      - name: Capture and durably persist label-blind swing liquidity snapshot
        if: steps.due.outputs.capture_due == 'true'
        working-directory: bybit_eu_swing_radar/backend
        run: python research/swing_liquidity_shadow.py

      - name: Bind verifier to this exact capture
        if: steps.due.outputs.capture_due == 'true'
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          payload = json.loads(Path("swing-liquidity-shadow.json").read_text())
          captured_at = payload.get("captured_at")
          if not captured_at:
              raise SystemExit("captured_at missing from forward snapshot")
          print(f"EXPECTED_SWING_LIQUIDITY_CAPTURE_AT={captured_at}")
          PY

      - name: Verify exact durable forward capture state
        if: steps.due.outputs.capture_due == 'true'
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_forward_status.py

      - name: Upload immutable forward snapshot
        if: ${{ always() && steps.due.outputs.capture_due == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: swing-liquidity-shadow-${{ github.run_id }}
          path: bybit_eu_swing_radar/backend/swing-liquidity-shadow.json
          retention-days: 90
          if-no-files-found: error
