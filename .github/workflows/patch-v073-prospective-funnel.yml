name: Patch v073 prospective funnel

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'research/v073-prospective-funnel-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply deterministic day-worker integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bybit_eu_swing_radar/backend/day_worker.py')
          text = path.read_text()

          old = '''from journal import persist_day_journal\nfrom sweep_research import SweepResearchConfig, latest_bar_sweep_setup\n'''
          new = '''from journal import persist_day_journal\nfrom research.prospective_funnel_v073 import persist_v073_prospective_funnel\nfrom sweep_research import SweepResearchConfig, latest_bar_sweep_setup\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('import anchor not found')

          old = '''async def persist_day_results(\n    scan: dict[str, Any],\n    setups: list[dict[str, Any]],\n    status: dict[str, Any],\n    bars_by_symbol: dict[str, list[Bar]],\n) -> dict[str, Any]:\n'''
          new = '''async def persist_day_results(\n    scan: dict[str, Any],\n    setups: list[dict[str, Any]],\n    status: dict[str, Any],\n    bars_by_symbol: dict[str, list[Bar]],\n    analyses: list[DayAnalysis],\n) -> dict[str, Any]:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('persist signature anchor not found')

          old = '''            scan["journal"] = journal_status\n            status["journal"] = journal_status\n\n            await upsert_cache(connection, "day_trade_scan", scan)\n'''
          new = '''            scan["journal"] = journal_status\n            status["journal"] = journal_status\n\n            try:\n                # Research-only sidecar: isolate recorder SQL in a savepoint so\n                # any research failure cannot abort live journal/cache persistence.\n                async with connection.transaction():\n                    funnel_status = await persist_v073_prospective_funnel(\n                        connection,\n                        analyses,\n                        captured_at=datetime.fromisoformat(scan["data_as_of"]),\n                        source_commit_sha=SOURCE_COMMIT_SHA,\n                    )\n            except Exception as exc:\n                funnel_status = {\n                    "status": "DEGRADED",\n                    "research_only": True,\n                    "label_free": True,\n                    "outcome_labels_stored": False,\n                    "spec_version": "v073-prospective-funnel-v1",\n                    "strategy_version": DAY_STRATEGY_VERSION,\n                    "captured_at": scan["data_as_of"],\n                    "source_commit_sha": SOURCE_COMMIT_SHA,\n                    "reason": str(exc),\n                }\n            scan["prospective_funnel"] = funnel_status\n            status["prospective_funnel"] = funnel_status\n\n            await upsert_cache(connection, "day_trade_scan", scan)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('journal/cache anchor not found')

          old = '''        journal_status = await persist_day_results(\n            scan,\n            all_candidates,\n            status,\n            bars_by_symbol,\n        )\n'''
          new = '''        journal_status = await persist_day_results(\n            scan,\n            all_candidates,\n            status,\n            bars_by_symbol,\n            analyses,\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('persist call anchor not found')

          path.write_text(text)
          PY

      - name: Remove temporary patch workflow and commit
        run: |
          rm -f .github/workflows/patch-v073-prospective-funnel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/day_worker.py .github/workflows/patch-v073-prospective-funnel.yml
          if git diff --cached --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git commit -m "Wire v0.7.3 prospective funnel sidecar"
          git push origin HEAD:${{ github.head_ref }}
