name: Diag current production research f0ea2d0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'diag/current-coinalyze-f0ea2d0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: f0ea2d0d4ee660f90ff31797060b0e548384f704
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: f0ea2d0d4ee660f90ff31797060b0e548384f704
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify current production swing Coinalyze semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py
      - name: Read current durable swing liquidity forward status
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ['PRODUCTION_RADAR_API_KEY']
          req = Request(base + '/v1/research/swing-liquidity/forward-status', headers={
              'Accept': 'application/json',
              'User-Agent': 'bybit-eu-swing-liquidity-diag/1',
              'X-Radar-Key': key,
          })
          with urlopen(req, timeout=15) as r:
              p = json.load(r)
          safe_keys = [
              'research_only','live_strategy_mutated','promotion_allowed','study',
              'capture_count','first_capture_at','last_capture_at','candidate_observations',
              'orderbook_errors','turnover_tiers','spread_tiers',
              'development_target_matured_events','validation_target_matured_events'
          ]
          print('SWING_LIQUIDITY_FORWARD_DIAG=' + json.dumps({k:p.get(k) for k in safe_keys}, sort_keys=True))
          PY
