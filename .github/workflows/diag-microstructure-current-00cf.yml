name: Diag microstructure current 00cf

on:
  push:
    branches: [diag/microstructure-current-00cf]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 00cf37d8e0814ca5c837f29614afc3bb34942b73
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v7
        with:
          ref: diag/microstructure-current-00cf
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run read-only production diagnostics
        working-directory: bybit_eu_swing_radar/backend
        shell: bash
        run: |
          set +e
          : > ../../diag-microstructure-result.txt
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> ../../diag-microstructure-result.txt
          python scripts/production_microstructure_smoke.py >> ../../diag-microstructure-result.txt 2>&1
          echo "SMOKE_RC=$?" >> ../../diag-microstructure-result.txt
          python scripts/production_microstructure_alignment_status.py >> ../../diag-microstructure-result.txt 2>&1
          echo "ALIGNMENT_RC=$?" >> ../../diag-microstructure-result.txt
          python scripts/production_microstructure_effect_status.py >> ../../diag-microstructure-result.txt 2>&1
          echo "EFFECT_RC=$?" >> ../../diag-microstructure-result.txt
          exit 0
      - name: Persist sanitized diagnostic result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag-microstructure-result.txt
          git commit -m "diag result: current microstructure state [skip ci]" || exit 0
          git push origin HEAD:diag/microstructure-current-00cf
