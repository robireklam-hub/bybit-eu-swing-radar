name: Verify production signal freeze 6d5c4a8

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-signal-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 6d5c4a8da27792934e1aab562421c20a5b3d6c6b
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v7
        with:
          ref: 6d5c4a8da27792934e1aab562421c20a5b3d6c6b
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify signal-time context freeze
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_signal_context_freeze_smoke.py
