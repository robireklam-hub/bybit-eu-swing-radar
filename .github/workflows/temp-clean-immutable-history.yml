name: Temporary clean immutable history PR

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'research/immutable-snapshot-history-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/immutable-snapshot-history-v1
          fetch-depth: 0
      - name: Remove generated bytecode and temporary workflow
        run: |
          find bybit_eu_swing_radar/backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find bybit_eu_swing_radar/backend -type f -name '*.pyc' -delete
          rm -f .github/workflows/temp-clean-immutable-history.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove generated Python bytecode from research PR'
          git push origin HEAD:research/immutable-snapshot-history-v1
