name: Verify production BTC macro coverage and units 72c03c4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-btc-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 72c03c4fc6676758bcbe7a94f0219196164414ee
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v7
        with:
          ref: 72c03c4fc6676758bcbe7a94f0219196164414ee
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify BTC macro cycle ETF production layer with 4 of 4 macro coverage
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_btc_macro_cycle_etf_shadow_smoke.py
      - name: Verify RRP FRED-compatible units
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ['PRODUCTION_RADAR_API_KEY']
          expected = os.environ['EXPECTED_SHA']
          req = urllib.request.Request(
              base + '/v1/research/btc-macro-cycle-etf/capture',
              method='POST',
              data=b'{}',
              headers={'Accept':'application/json','Content-Type':'application/json','X-Radar-Key':key},
          )
          with urllib.request.urlopen(req, timeout=40) as response:
              payload = json.load(response)
          assert payload.get('source_commit_sha') == expected, payload.get('source_commit_sha')
          macro = payload.get('macro') or {}
          rrp = macro.get('overnight_reverse_repo') or {}
          status = ((payload.get('coverage') or {}).get('source_status') or {}).get('fred_overnight_reverse_repo') or {}
          value = float(rrp['latest'])
          assert rrp.get('units') == 'billions_usd', rrp
          assert status.get('units') == 'billions_usd', status
          assert status.get('raw_amount_units') == 'usd', status
          assert 0.0 <= value < 1000.0, value
          print('RRP_UNIT_CHECK=' + json.dumps({'latest': value, 'latest_date': rrp.get('latest_date'), 'units': rrp.get('units'), 'raw_amount_units': status.get('raw_amount_units')}, sort_keys=True))
          PY
