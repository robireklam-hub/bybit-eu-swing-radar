name: Temporary diagnose day Coinalyze missing target a30c4c

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diag/day-coinalyze-missing-target-a30c4c'
    runs-on: macos-26
    timeout-minutes: 8
    env:
      EXACT_MAIN_SHA: a30c4c806b520b11d619c2610ffc206456ee0f1a
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a30c4c806b520b11d619c2610ffc206456ee0f1a
      - name: Reconstruct exact target set from persisted cache only
        shell: bash
        run: |
          cd bybit_eu_swing_radar/backend
          python - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          exact = os.environ['EXACT_MAIN_SHA']
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ['PRODUCTION_RADAR_API_KEY']

          def get(path, auth=True, timeout=35):
              headers = {'Accept':'application/json','User-Agent':'day-coinalyze-cache-diag/2'}
              if auth:
                  headers['X-Radar-Key'] = key
              with urlopen(Request(base + path, headers=headers), timeout=timeout) as response:
                  return json.load(response)

          version = get('/version', False)
          assert version.get('commit_sha') == exact, version
          status = get('/v1/day-trade/status')
          worker = status.get('worker') or {}
          assert worker.get('source_commit_sha') == exact, worker
          checked_at = status.get('checked_at')

          scan = get('/v1/day-trade/scan?' + urlencode({
              'direction':'both', 'limit':20, 'min_score':0, 'include_watchlist':'true'
          }))
          assert scan.get('data_as_of') == checked_at, (scan.get('data_as_of'), checked_at)

          candidates = []
          for name, value in scan.items():
              if isinstance(value, list) and any(token in name.lower() for token in ('long','short','candidate','watch','setup')):
                  candidates.extend(item for item in value if isinstance(item, dict) and item.get('symbol'))
          assert candidates, scan.keys()

          from worker import DISCOVERY_SYMBOLS, COINALYZE_ENRICH_LIMIT

          # For each symbol, the direction-aligned candidate's setup_score equals
          # setup_score(expansion, abs(direction), quality). Add the selector's
          # fixed discovery bonus exactly as select_coinalyze_targets does.
          by_symbol = {}
          for item in candidates:
              symbol = str(item.get('symbol')).upper()
              if item.get('data_as_of') != checked_at:
                  continue
              row = by_symbol.setdefault(symbol, {
                  'symbol': symbol,
                  'base_score': -1.0,
                  'selector_score': -1.0,
                  'candidate': None,
              })
              base_score = float(item.get('setup_score') or 0.0)
              selector_score = base_score + (5.0 if symbol in DISCOVERY_SYMBOLS else 0.0)
              if selector_score > row['selector_score']:
                  row.update({
                      'base_score': base_score,
                      'selector_score': selector_score,
                      'candidate': item,
                  })

          ranked = sorted(by_symbol.values(), key=lambda row: row['selector_score'], reverse=True)
          target_count = int(worker.get('coinalyze_target_symbols') or 0)
          enriched_count = int(worker.get('coinalyze_enriched_symbols') or 0)
          complete_count = int(worker.get('coinalyze_complete_symbols') or 0)
          analysis_count = int(worker.get('coinalyze_analysis_symbols') or worker.get('deep_analyzed_pairs') or 0)
          assert target_count == min(COINALYZE_ENRICH_LIMIT, analysis_count), (target_count, analysis_count, COINALYZE_ENRICH_LIMIT)
          assert len(ranked) >= target_count, (len(ranked), target_count)
          targets = ranked[:target_count]

          target_details = []
          for target in targets:
              symbol = target['symbol']
              setup = get('/v1/day-trade/setup/' + symbol)
              assert setup.get('data_as_of') == checked_at, (symbol, setup.get('data_as_of'), checked_at)
              derivatives = setup.get('derivatives') or {}
              missing = setup.get('missing_data') or []
              availability = derivatives.get('availability') or {}
              explicit_no_match = any('No matching Coinalyze perpetual market' in str(x) for x in missing)
              complete = bool(
                  derivatives
                  and not derivatives.get('endpoint_errors')
                  and all(availability.get(field) is True for field in ('current_oi','funding','oi_history','liquidations'))
              )
              target_details.append({
                  'symbol': symbol,
                  'selector_score': round(target['selector_score'], 4),
                  'base_score': round(target['base_score'], 4),
                  'discovery_bonus': 5.0 if symbol in DISCOVERY_SYMBOLS else 0.0,
                  'has_derivatives': bool(derivatives),
                  'complete': complete,
                  'explicit_no_match': explicit_no_match,
                  'missing_data': missing,
                  'market_symbol': derivatives.get('market_symbol') or derivatives.get('symbol'),
                  'exchange_name': derivatives.get('exchange_name') or derivatives.get('exchange'),
                  'quote_asset': derivatives.get('quote_asset'),
                  'endpoint_errors': derivatives.get('endpoint_errors') or [],
                  'availability': availability,
              })

          actual_enriched = sum(1 for row in target_details if row['has_derivatives'])
          actual_complete = sum(1 for row in target_details if row['complete'])
          no_match = [row['symbol'] for row in target_details if row['explicit_no_match']]
          assert actual_enriched == enriched_count, (actual_enriched, enriched_count, target_details)
          assert actual_complete == complete_count, (actual_complete, complete_count, target_details)
          assert len(no_match) == target_count - enriched_count, (no_match, target_count, enriched_count)

          source = next((x for x in status.get('sources',[]) if str(x.get('source','')).lower() == 'coinalyze'), {})
          result = {
              'exact_sha': exact,
              'checked_at': checked_at,
              'analysis_count': analysis_count,
              'target_count': target_count,
              'enriched_count': enriched_count,
              'complete_count': complete_count,
              'source': source,
              'reconstructed_target_symbols': [row['symbol'] for row in target_details],
              'explicit_no_match_symbols': no_match,
              'target_details': target_details,
              'ranked_cache_symbol_count': len(ranked),
          }
          print('DAY_COINALYZE_CACHE_ONLY_DIAG=' + json.dumps(result, sort_keys=True, default=str))
          print('DAY COINALYZE MISSING TARGET IDENTIFIED FROM EXACT CACHE.')
          PY
