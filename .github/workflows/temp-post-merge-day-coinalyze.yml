name: Temporary post-merge day Coinalyze verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'diag/post-merge-day-coinalyze-27737fb'
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      EXACT_MAIN_SHA: 27737fbe3caacdd2efbe72ca0acdfc0ebc6cc88f
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_MAIN_SHA }}
      - name: Verify exact production day Coinalyze semantics
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN_SHA"
          python - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          base=os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key=os.environ['PRODUCTION_RADAR_API_KEY']
          exact=os.environ['EXACT_MAIN_SHA']
          def get(path, auth=True):
              h={'Accept':'application/json','User-Agent':'day-coinalyze-post-merge/2'}
              if auth: h['X-Radar-Key']=key
              with urlopen(Request(base+path,headers=h),timeout=40) as r:
                  return json.load(r)

          version=get('/version',False)
          assert version.get('commit_sha') == exact, version
          status=get('/v1/day-trade/status')
          worker=status.get('worker') or {}
          assert worker.get('source_commit_sha') == exact, worker
          analyzed=int(worker.get('deep_analyzed_pairs') or 0)
          any_count=int(worker.get('coinalyze_enriched_symbols') or 0)
          complete_count=int(worker.get('coinalyze_complete_symbols') or 0)
          assert 0 <= complete_count <= any_count <= 9
          assert any_count <= analyzed

          sources=status.get('sources') or []
          coinalyze=next((x for x in sources if str(x.get('source','')).lower()=='coinalyze'),None)
          assert coinalyze is not None, sources
          assert coinalyze.get('any_field_coverage') == f'{any_count}/{analyzed}'
          assert coinalyze.get('complete_coverage') == f'{complete_count}/{analyzed}'
          assert coinalyze.get('coverage') == f'{complete_count}/{analyzed}'
          source_status=str(coinalyze.get('status') or '').lower()
          if source_status == 'ok':
              assert complete_count == analyzed and analyzed > 0
              assert not (coinalyze.get('missing_fields') or [])
          else:
              assert source_status in {'partial','degraded'}
              assert coinalyze.get('missing_fields')

          scan=get('/v1/day-trade/scan?'+urlencode({'direction':'both','limit':20,'min_score':0,'include_watchlist':'true'}))
          top=get('/v1/day-trade/top-candidates?'+urlencode({'limit':5,'include_watchlist':'true'}))
          def flatten(payload):
              out=[]
              if isinstance(payload,list): return [x for x in payload if isinstance(x,dict)]
              if not isinstance(payload,dict): return out
              for k,v in payload.items():
                  if isinstance(v,list) and any(token in k.lower() for token in ('candidate','long','short','watch','result','setup')):
                      out.extend(x for x in v if isinstance(x,dict))
              return out
          candidates=flatten(scan)+flatten(top)
          for item in candidates:
              sym=str(item.get('symbol') or '').upper()
              if sym: assert sym.endswith('USDC'), sym

          symbols=[]
          for item in candidates:
              sym=str(item.get('symbol') or '').upper()
              if sym and sym not in symbols: symbols.append(sym)
              if len(symbols)>=10: break
          # Ensure known enriched symbols from missing_fields are sampled too.
          for sym in ('BTCUSDC','ETHUSDC','SOLUSDC','XRPUSDC','LINKUSDC','LTCUSDC','INJUSDC','UNIUSDC'):
              if sym not in symbols: symbols.append(sym)

          evidence=[]
          for sym in symbols[:14]:
              try:
                  setup=get(f'/v1/day-trade/setup/{sym}')
              except HTTPError as exc:
                  evidence.append({'symbol':sym,'setup_http':exc.code}); continue
              derivatives=setup.get('derivatives') if isinstance(setup,dict) else None
              if isinstance(derivatives,dict) and derivatives:
                  evidence.append({
                      'symbol':sym,
                      'market_symbol':derivatives.get('market_symbol') or derivatives.get('symbol'),
                      'exchange_code':derivatives.get('exchange_code'),
                      'exchange_name':derivatives.get('exchange_name') or derivatives.get('exchange'),
                      'quote_asset':derivatives.get('quote_asset'),
                      'availability':derivatives.get('availability'),
                      'endpoint_errors':derivatives.get('endpoint_errors'),
                      'is_bybit_specific':derivatives.get('is_bybit_specific'),
                  })

          # Every populated day derivatives payload must resolve to Bybit after PR #223.
          populated=[x for x in evidence if x.get('market_symbol')]
          for row in populated:
              name=str(row.get('exchange_name') or '').lower()
              assert 'bybit' in name, row

          summary={
              'exact_sha':exact,
              'checked_at':status.get('checked_at'),
              'worker_duration_seconds':worker.get('duration_seconds'),
              'deep_requested':worker.get('deep_requested_pairs'),
              'deep_analyzed':analyzed,
              'coinalyze_any_field':any_count,
              'coinalyze_complete':complete_count,
              'coinalyze_source':coinalyze,
              'candidate_count_observed':len(candidates),
              'routing_evidence':evidence,
          }
          print('DAY_COINALYZE_PRODUCTION_SUMMARY='+json.dumps(summary,sort_keys=True,default=str))
          print('DAY COINALYZE EXACT-SHA PRODUCTION VERIFIED.')
          PY
