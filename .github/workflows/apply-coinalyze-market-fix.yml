name: Apply Coinalyze market resolution fix

on:
  push:
    branches: [fix/swing-coinalyze-market-resolution]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Fix swing Coinalyze exchange-code market selection'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/swing-coinalyze-market-resolution
      - name: Apply minimal worker patch and tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('bybit_eu_swing_radar/backend/worker.py')
          text = path.read_text()

          old = '''    async def future_markets(self) -> list[dict[str, Any]]:
              return await self.get("/future-markets")

          async def batch_current(self, endpoint: str, symbols: list[str], convert_to_usd: bool = False) -> Any:
          '''
          new = '''    async def future_markets(self) -> list[dict[str, Any]]:
              return await self.get("/future-markets")

          async def exchanges(self) -> list[dict[str, Any]]:
              return await self.get("/exchanges")

          async def batch_current(self, endpoint: str, symbols: list[str], convert_to_usd: bool = False) -> Any:
          '''
          if old not in text:
              raise SystemExit('future_markets anchor not found')
          text = text.replace(old, new, 1)

          old = '''def select_coinalyze_markets(
              markets: list[dict[str, Any]], bases: list[str]
          ) -> dict[str, dict[str, Any]]:
              selected: dict[str, dict[str, Any]] = {}
              priorities = {"bybit": 0, "binance": 1, "okx": 2, "deribit": 3}
              for base in bases:
                  candidates: list[tuple[int, int, dict[str, Any]]] = []
                  for market in markets:
                      if str(market.get("base_asset", "")).upper() != base:
                          continue
                      if not bool(market.get("is_perpetual", False)):
                          continue
                      quote = str(market.get("quote_asset", "")).upper()
                      if quote not in {"USDT", "USDC", "USD"}:
                          continue
                      exchange = str(market.get("exchange", "")).lower()
                      priority = next((value for key, value in priorities.items() if key in exchange), 9)
                      quote_priority = 0 if quote == "USDC" else 1 if quote == "USDT" else 2
                      candidates.append((priority, quote_priority, market))
                  if candidates:
                      candidates.sort(key=lambda item: (item[0], item[1]))
                      selected[base] = candidates[0][2]
              return selected
          '''
          new = '''def select_coinalyze_markets(
              markets: list[dict[str, Any]],
              bases: list[str],
              *,
              exchange_names: dict[str, str] | None = None,
              prefer_usdt_context: bool = False,
          ) -> dict[str, dict[str, Any]]:
              """Select one perpetual derivatives context market per base asset.

              ``future-markets.exchange`` is an exchange code, not necessarily a
              human-readable name. The legacy day-trade path deliberately keeps the
              historical behavior when ``exchange_names`` is omitted. Swing
              ``partial_safe`` enrichment resolves codes via ``/exchanges`` and
              prefers liquid USDT derivatives context over USDC because derivatives
              are context-only and never execution proof.
              """
              selected: dict[str, dict[str, Any]] = {}
              priorities = {"bybit": 0, "binance": 1, "okx": 2, "deribit": 3}
              names = exchange_names or {}
              for base in bases:
                  candidates: list[tuple[int, int, str, dict[str, Any]]] = []
                  for market in markets:
                      if str(market.get("base_asset", "")).upper() != base:
                          continue
                      if not bool(market.get("is_perpetual", False)):
                          continue
                      quote = str(market.get("quote_asset", "")).upper()
                      if quote not in {"USDT", "USDC", "USD"}:
                          continue
                      exchange_code = str(market.get("exchange", ""))
                      resolved_name = str(names.get(exchange_code, exchange_code))
                      exchange_key = resolved_name.lower()
                      priority = next(
                          (value for key, value in priorities.items() if key in exchange_key),
                          9,
                      )
                      if prefer_usdt_context:
                          quote_priority = 0 if quote == "USDT" else 1 if quote == "USDC" else 2
                      else:
                          quote_priority = 0 if quote == "USDC" else 1 if quote == "USDT" else 2
                      candidate = dict(market)
                      candidate["_resolved_exchange_name"] = resolved_name
                      candidates.append((priority, quote_priority, str(candidate.get("symbol", "")), candidate))
                  if candidates:
                      candidates.sort(key=lambda item: (item[0], item[1], item[2]))
                      selected[base] = candidates[0][3]
              return selected
          '''
          if old not in text:
              raise SystemExit('select_coinalyze_markets anchor not found')
          text = text.replace(old, new, 1)

          old = '''    try:
              markets = await api.future_markets()
          except Exception as exc:
              for analysis in analyses:
                  analysis.missing_data.append("Coinalyze future-markets failed")
              return False, f"future-markets: {type(exc).__name__}: {exc}"

          market_map = select_coinalyze_markets(
              markets,
              [item.instrument.base for item in selected_analyses],
          )
          '''
          new = '''    exchange_names: dict[str, str] | None = None
              try:
                  markets = await api.future_markets()
                  if partial_safe:
                      exchanges = await api.exchanges()
                      exchange_names = {
                          str(item.get("code", "")): str(item.get("name", ""))
                          for item in exchanges
                          if isinstance(item, dict)
                          and item.get("code")
                          and item.get("name")
                      }
                      if not exchange_names:
                          raise RuntimeError("Coinalyze exchanges returned no code mappings")
              except Exception as exc:
                  for analysis in analyses:
                      analysis.missing_data.append("Coinalyze market metadata failed")
                  return False, f"market-metadata: {type(exc).__name__}: {exc}"

              market_map = select_coinalyze_markets(
                  markets,
                  [item.instrument.base for item in selected_analyses],
                  exchange_names=exchange_names,
                  prefer_usdt_context=partial_safe,
              )
          '''
          if old not in text:
              raise SystemExit('enrichment metadata anchor not found')
          text = text.replace(old, new, 1)

          old = '''            "market_symbol": symbol,
                      "exchange": market.get("exchange"),
                      "quote_asset": market.get("quote_asset"),
          '''
          new = '''            "market_symbol": symbol,
                      "exchange": market.get("_resolved_exchange_name") or market.get("exchange"),
                      "exchange_code": market.get("exchange"),
                      "quote_asset": market.get("quote_asset"),
          '''
          if old not in text:
              raise SystemExit('derivatives exchange anchor not found')
          text = text.replace(old, new, 1)

          old = '''            "is_bybit_specific": "bybit"
                      in str(market.get("exchange", "")).lower(),
          '''
          new = '''            "is_bybit_specific": "bybit"
                      in str(
                          market.get("_resolved_exchange_name")
                          or market.get("exchange", "")
                      ).lower(),
          '''
          if old not in text:
              raise SystemExit('is_bybit_specific anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          test = Path('bybit_eu_swing_radar/backend/test_coinalyze_market_resolution.py')
          test.write_text('''from worker import select_coinalyze_markets\n\n\ndef _market(symbol: str, exchange: str, quote: str) -> dict:\n    return {\n        "symbol": symbol,\n        "exchange": exchange,\n        "base_asset": "BTC",\n        "quote_asset": quote,\n        "is_perpetual": True,\n    }\n\n\ndef test_legacy_day_selection_remains_usdc_first_without_exchange_map() -> None:\n    markets = [\n        _market("BTCUSDT_PERP.A", "A", "USDT"),\n        _market("BTCUSDC_PERP.C", "C", "USDC"),\n    ]\n    selected = select_coinalyze_markets(markets, ["BTC"])\n    assert selected["BTC"]["symbol"] == "BTCUSDC_PERP.C"\n\n\ndef test_swing_context_resolves_exchange_codes_and_prefers_bybit_usdt() -> None:\n    markets = [\n        _market("BTCUSDC_PERP.C", "C", "USDC"),\n        _market("BTCUSDC_PERP.B", "B", "USDC"),\n        _market("BTCUSDT_PERP.A", "A", "USDT"),\n    ]\n    selected = select_coinalyze_markets(\n        markets,\n        ["BTC"],\n        exchange_names={"A": "Bybit", "B": "Binance", "C": "Hyperliquid"},\n        prefer_usdt_context=True,\n    )\n    row = selected["BTC"]\n    assert row["symbol"] == "BTCUSDT_PERP.A"\n    assert row["_resolved_exchange_name"] == "Bybit"\n\n\ndef test_exchange_priority_beats_quote_priority_for_context() -> None:\n    markets = [\n        _market("BTCUSDC_PERP.B", "B", "USDC"),\n        _market("BTCUSDT_PERP.A", "A", "USDT"),\n    ]\n    selected = select_coinalyze_markets(\n        markets,\n        ["BTC"],\n        exchange_names={"A": "Bybit", "B": "Binance"},\n        prefer_usdt_context=True,\n    )\n    assert selected["BTC"]["symbol"] == "BTCUSDT_PERP.A"\n\n\ndef test_context_quote_prefers_usdt_within_same_exchange() -> None:\n    markets = [\n        _market("BTCUSDC_PERP.A", "A", "USDC"),\n        _market("BTCUSDT_PERP.A", "A", "USDT"),\n    ]\n    selected = select_coinalyze_markets(\n        markets,\n        ["BTC"],\n        exchange_names={"A": "Bybit"},\n        prefer_usdt_context=True,\n    )\n    assert selected["BTC"]["symbol"] == "BTCUSDT_PERP.A"\n''')

      - name: Remove temporary patch workflow and push patch
        run: |
          rm .github/workflows/apply-coinalyze-market-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/worker.py bybit_eu_swing_radar/backend/test_coinalyze_market_resolution.py .github/workflows/apply-coinalyze-market-fix.yml
          git commit -m "Fix swing Coinalyze exchange-code market selection"
          git push origin HEAD:fix/swing-coinalyze-market-resolution
