name: v0.7.3 breakout continuation research v5

on:
  workflow_run:
    workflows: ["Production Flow freshness smoke"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: v073-research-breakout-v5
  cancel-in-progress: false

jobs:
  breakout-continuation-research:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out production-verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate research configuration
        shell: bash
        run: |
          if [ -z "${PRODUCTION_RADAR_API_BASE_URL}" ]; then
            echo "::error::PRODUCTION_RADAR_API_BASE_URL repository variable is not configured."
            exit 2
          fi
          if [ -z "${PRODUCTION_RADAR_API_KEY}" ]; then
            echo "::error::PRODUCTION_RADAR_API_KEY GitHub Actions secret is not configured."
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Replay breakout continuation strategy family
        run: python scripts/run_production_research_breakout_v5.py
