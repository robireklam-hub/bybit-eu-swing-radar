name: Patch v073 prospective volume threshold

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'research/v073-prospective-funnel-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Align recorder with live volume threshold
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('bybit_eu_swing_radar/backend/research/prospective_funnel_v073.py')
          text = module.read_text()
          old = '''    source_commit_sha: str | None,\n) -> list[dict[str, Any]]:\n'''
          new = '''    source_commit_sha: str | None,\n    volume_confirmation_ratio: float = 1.3,\n) -> list[dict[str, Any]]:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('analysis signature anchor missing')

          old = '    sweep_config = SweepResearchConfig()\n'
          new = '''    sweep_config = SweepResearchConfig(\n        volume_confirmation_ratio=volume_confirmation_ratio\n    )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('sweep config anchor missing')

          old = '''    source_commit_sha: str | None,\n) -> dict[str, Any]:\n    """Persist one label-free forward funnel snapshot batch."""\n'''
          new = '''    source_commit_sha: str | None,\n    volume_confirmation_ratio: float,\n) -> dict[str, Any]:\n    """Persist one label-free forward funnel snapshot batch."""\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('persist signature anchor missing')

          old = '''        source_commit_sha=source_commit_sha,\n    )\n    inserted = 0\n'''
          new = '''        source_commit_sha=source_commit_sha,\n        volume_confirmation_ratio=volume_confirmation_ratio,\n    )\n    inserted = 0\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('snapshot call anchor missing')
          module.write_text(text)

          worker = Path('bybit_eu_swing_radar/backend/day_worker.py')
          text = worker.read_text()
          old = '''                        source_commit_sha=SOURCE_COMMIT_SHA,\n                    )\n'''
          new = '''                        source_commit_sha=SOURCE_COMMIT_SHA,\n                        volume_confirmation_ratio=DAY_TRIGGER_VOLUME_RATIO,\n                    )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('day worker funnel call anchor missing')
          worker.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/patch-v073-prospective-volume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/research/prospective_funnel_v073.py bybit_eu_swing_radar/backend/day_worker.py .github/workflows/patch-v073-prospective-volume.yml
          git commit -m "Align prospective funnel with live volume threshold"
          git push origin HEAD:${{ github.head_ref }}
