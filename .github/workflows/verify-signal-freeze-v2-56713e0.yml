name: Verify Signal Freeze v2 production 56713e0

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-signal-freeze-v2-56713e0.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 56713e035dda39fed9f46335ba1a35c7caa38e9e
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 56713e035dda39fed9f46335ba1a35c7caa38e9e
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exact-main Signal-Time Context Freeze v2 production smoke
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_signal_context_freeze_v2_smoke.py
