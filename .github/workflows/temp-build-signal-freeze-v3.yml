name: Temporary build signal freeze v3

on:
  push:
    branches: [research/signal-context-freeze-v3-immutable]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'research/signal-context-freeze-v3-immutable')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/signal-context-freeze-v3-immutable
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt
      - name: Build v3 files
        run: python scripts/temp_build_signal_freeze_v3.py
      - name: Install and test
        working-directory: bybit_eu_swing_radar/backend
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
          python -m pytest -q
          python -m compileall -q app research flow_context.py flow_worker.py
      - name: Commit v3 source and tests only
        run: |
          rm -f scripts/temp_build_signal_freeze_v3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bybit_eu_swing_radar/backend/app/main.py \
            bybit_eu_swing_radar/backend/app/research_signal_context_freeze_v3_api.py \
            bybit_eu_swing_radar/backend/research/signal_context_freeze_v3.py \
            bybit_eu_swing_radar/backend/scripts/production_signal_context_freeze_v3_smoke.py \
            bybit_eu_swing_radar/backend/test_signal_context_freeze_v3.py \
            bybit_eu_swing_radar/backend/test_signal_context_freeze_v3_routes.py \
            scripts/temp_build_signal_freeze_v3.py
          git diff --cached --check
          git commit -m 'Add immutable-history Signal Context Freeze v3'
          git push origin HEAD:research/signal-context-freeze-v3-immutable
