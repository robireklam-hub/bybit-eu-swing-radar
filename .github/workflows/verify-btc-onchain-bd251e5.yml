name: Verify BTC on-chain production bd251e5

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/btc-onchain-cda3bb9'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: bd251e5bc29b5b0f615e6b377c291ac62344131c
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_RECORDER_SHA: b54fbd01e086d1f7d1b57d6324d32241e11e2d89
      EXPECTED_RECORDER_STARTED_AT: 2026-08-18T10:00:35.175672+00:00
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bd251e5bc29b5b0f615e6b377c291ac62344131c

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Exact-SHA BTC on-chain production smoke
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_btc_onchain_smoke.py

      - name: Verify standalone recorder survived provider fix deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base=os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          req=urllib.request.Request(base+'/v1/research/microstructure/status',headers={
              'X-Radar-Key':os.environ['PRODUCTION_RADAR_API_KEY'],
              'Accept':'application/json','User-Agent':'btc-onchain-provider-fix-recorder-check/1'})
          with urllib.request.urlopen(req,timeout=15) as r: p=json.load(r)
          safe={k:p.get(k) for k in ['process_role','external_service_healthy','source_commit_sha','started_at','heartbeat_age_seconds','connected','singleton_acquired','messages','rows_written','last_error']}
          print('MICROSTRUCTURE_STATUS='+json.dumps(safe,sort_keys=True))
          if p.get('process_role')!='standalone': raise SystemExit('FAIL recorder not standalone')
          if p.get('external_service_healthy') is not True: raise SystemExit('FAIL recorder unhealthy')
          if p.get('source_commit_sha')!=os.environ['EXPECTED_RECORDER_SHA']: raise SystemExit('FAIL recorder SHA changed')
          if p.get('started_at')!=os.environ['EXPECTED_RECORDER_STARTED_AT']: raise SystemExit('FAIL recorder restarted')
          if p.get('connected') is not True or p.get('singleton_acquired') is not True: raise SystemExit('FAIL recorder disconnected or lost lock')
          print('MICROSTRUCTURE PROVIDER-FIX DEPLOYMENT INDEPENDENCE VERIFIED.')
          PY
