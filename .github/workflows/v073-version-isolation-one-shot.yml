name: v073 version isolation one-shot

on:
  push:
    branches:
      - fix/v073-version-isolation

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/v073-version-isolation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Apply minimal version-isolation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('bybit_eu_swing_radar/backend')
          repo_path = backend / 'app' / 'repository.py'
          backtest_path = backend / 'backtest.py'
          worker_path = backend / 'backtest_worker.py'
          sweep_path = backend / 'sweep_research.py'
          test_path = backend / 'test_v073_version_isolation.py'

          text = repo_path.read_text(encoding='utf-8')
          old = 'CURRENT_DAY_STRATEGY_VERSION = "0.7.2"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, 'CURRENT_DAY_STRATEGY_VERSION = "0.7.3"')

          old_job = '        job_raw = await conn.fetchrow("SELECT * FROM day_trade_backtest_jobs ORDER BY id DESC LIMIT 1")'
          assert text.count(old_job) == 2, text.count(old_job)
          new_job = '''        job_raw = await conn.fetchrow(\n            "SELECT * FROM day_trade_backtest_jobs WHERE strategy_version=$1 ORDER BY id DESC LIMIT 1",\n            CURRENT_DAY_STRATEGY_VERSION,\n        )'''
          text = text.replace(old_job, new_job)

          old_id = '        job_id = await conn.fetchval("SELECT id FROM day_trade_backtest_jobs ORDER BY id DESC LIMIT 1")'
          assert text.count(old_id) == 1, text.count(old_id)
          new_id = '''        job_id = await conn.fetchval(\n            "SELECT id FROM day_trade_backtest_jobs WHERE strategy_version=$1 ORDER BY id DESC LIMIT 1",\n            CURRENT_DAY_STRATEGY_VERSION,\n        )'''
          text = text.replace(old_id, new_id)

          old_fallback = '        strategy_version=str(job.get("strategy_version", "0.7.2")),'
          assert text.count(old_fallback) == 1, text.count(old_fallback)
          text = text.replace(
              old_fallback,
              '        strategy_version=str(job.get("strategy_version", CURRENT_DAY_STRATEGY_VERSION)),',
          )
          repo_path.write_text(text, encoding='utf-8')

          text = backtest_path.read_text(encoding='utf-8')
          replacements = {
              'Incremental historical replay engine for Trading Radar v0.7.2.':
                  'Incremental historical replay engine for Trading Radar v0.7.3.',
              'Coinalyze derivatives context is not part of v0.7.2 replay scoring;':
                  'Coinalyze derivatives context is not part of v0.7.3 replay scoring;',
              'BACKTEST_JOB_NAME = os.getenv("BACKTEST_JOB_NAME", "v072-90d-netrr-structural-barrier").strip()':
                  'BACKTEST_JOB_NAME = os.getenv("BACKTEST_JOB_NAME", "v073-90d-netrr-structural-barrier").strip()',
              'Coinalyze OI/funding is excluded from replay v0.7.2.':
                  'Coinalyze OI/funding is excluded from replay v0.7.3.',
          }
          for source, target in replacements.items():
              assert text.count(source) == 1, (source, text.count(source))
              text = text.replace(source, target)
          backtest_path.write_text(text, encoding='utf-8')

          text = worker_path.read_text(encoding='utf-8')
          assert text.count('historical replay v0.7.2') == 1
          text = text.replace('historical replay v0.7.2', 'historical replay v0.7.3')
          worker_path.write_text(text, encoding='utf-8')

          text = sweep_path.read_text(encoding='utf-8')
          old_sweep = 'This module does not modify the live v0.7.2 day-trade strategy.'
          assert text.count(old_sweep) == 1
          text = text.replace(
              old_sweep,
              'This detector is reused by the live v0.7.3 day-trade trigger; execution, scoring and derivatives context remain outside this module.',
          )
          sweep_path.write_text(text, encoding='utf-8')

          test_path.write_text('''from pathlib import Path\n\n\nBACKEND = Path(__file__).resolve().parent\n\n\ndef test_repository_reads_current_v073_journal_only():\n    text = (BACKEND / "app" / "repository.py").read_text(encoding="utf-8")\n    assert 'CURRENT_DAY_STRATEGY_VERSION = "0.7.3"' in text\n    assert 'CURRENT_DAY_STRATEGY_VERSION = "0.7.2"' not in text\n    assert 'strategy_version = $3' in text\n    assert 'strategy_version = $4' in text\n\n\ndef test_backtest_endpoints_filter_latest_job_by_v073_strategy_version():\n    text = (BACKEND / "app" / "repository.py").read_text(encoding="utf-8")\n    filtered_all = 'SELECT * FROM day_trade_backtest_jobs WHERE strategy_version=$1 ORDER BY id DESC LIMIT 1'\n    filtered_id = 'SELECT id FROM day_trade_backtest_jobs WHERE strategy_version=$1 ORDER BY id DESC LIMIT 1'\n    assert text.count(filtered_all) == 2\n    assert text.count(filtered_id) == 1\n    assert 'SELECT * FROM day_trade_backtest_jobs ORDER BY id DESC LIMIT 1' not in text\n    assert 'SELECT id FROM day_trade_backtest_jobs ORDER BY id DESC LIMIT 1' not in text\n    assert 'strategy_version=str(job.get("strategy_version", CURRENT_DAY_STRATEGY_VERSION))' in text\n\n\ndef test_backtest_writer_and_default_job_are_v073():\n    text = (BACKEND / "backtest.py").read_text(encoding="utf-8")\n    assert 'STRATEGY_VERSION = "0.7.3"' in text\n    assert 'v073-90d-netrr-structural-barrier' in text\n    assert 'v072-90d-netrr-structural-barrier' not in text\n    assert 'replay v0.7.2' not in text\n\n\ndef test_version_isolation_does_not_relabel_flow_feature_or_swing_strategy():\n    flow = (BACKEND / "flow_context.py").read_text(encoding="utf-8")\n    assert 'FEATURE_VERSION = "0.7.2.2"' in flow\n    worker = (BACKEND / "worker.py").read_text(encoding="utf-8")\n    assert 'SWING_STRATEGY_VERSION = "0.7.2"' in worker or 'strategy_version="0.7.2"' in worker or '"0.7.2"' in worker\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run focused version-isolation tests
        working-directory: bybit_eu_swing_radar/backend
        run: python -m pytest -q test_v073_version_isolation.py test_v073_contract_alignment.py

      - name: Run full backend suite
        working-directory: bybit_eu_swing_radar/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: python -m pytest -q

      - name: Compile production modules
        working-directory: bybit_eu_swing_radar/backend
        run: python -m compileall -q app day_worker.py journal.py backtest.py backtest_worker.py sweep_research.py flow_context.py flow_worker.py worker.py

      - name: Verify clean diff
        run: git diff --check

      - name: Commit clean feature diff and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/backend/app/repository.py \
            bybit_eu_swing_radar/backend/backtest.py \
            bybit_eu_swing_radar/backend/backtest_worker.py \
            bybit_eu_swing_radar/backend/sweep_research.py \
            bybit_eu_swing_radar/backend/test_v073_version_isolation.py
          git rm -- .github/workflows/v073-version-isolation-one-shot.yml
          git diff --cached --check
          git commit -m "Isolate v0.7.3 journal and backtest reads"
          git push origin HEAD:fix/v073-version-isolation
