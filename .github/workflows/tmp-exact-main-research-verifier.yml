name: Temporary exact-main research verifier

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: fa444a020fb81503e8fbeaf23ba181a3c0c725f3
    steps:
      - name: Check out exact production main
        uses: actions/checkout@v7
        with:
          ref: fa444a020fb81503e8fbeaf23ba181a3c0c725f3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify swing Coinalyze candidate semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Verify swing liquidity label-blind event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Verify swing liquidity maturity status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py

      - name: Verify preregistered v0.7.4 microstructure cohort status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status_v2.py
