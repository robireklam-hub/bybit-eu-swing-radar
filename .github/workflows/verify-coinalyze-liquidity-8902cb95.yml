name: NEVER MERGE verify Coinalyze liquidity 8902cb95

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-coinalyze-liquidity-8902cb95.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SHA: 8902cb95f5ecc7c00a95c4660846542cc3a78192
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: 8902cb95f5ecc7c00a95c4660846542cc3a78192

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify actual compact swing candidate Coinalyze semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_swing_coinalyze_smoke.py

      - name: Verify label-blind swing liquidity event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_swing_liquidity_event_smoke.py

      - name: Report label-blind swing liquidity maturity readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_swing_liquidity_maturity_status.py
