name: Temporary patch ETH on-chain routes

on:
  push:
    branches:
      - "research/eth-onchain-context-v1"
    paths:
      - ".github/workflows/patch-eth-onchain-routes.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Attach hidden ETH on-chain routes and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("bybit_eu_swing_radar/backend/app/main.py")
          text = main.read_text()
          attach = "attach_eth_onchain_research(app, require_api_key)"
          if attach not in text:
              text = text.rstrip() + "\n\n# Research-only ETH on-chain shadow. It records closed-day network context\n# and has no strategy/scoring/eligibility/execution mutation path.\nfrom app.research_eth_onchain_api import attach_eth_onchain_research\n\nattach_eth_onchain_research(app, require_api_key)\n"
              main.write_text(text)
          Path(".github/workflows/patch-eth-onchain-routes.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/app/main.py .github/workflows/patch-eth-onchain-routes.yml
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "Research: attach ETH on-chain hidden routes"
          git push origin HEAD:${GITHUB_REF_NAME}
