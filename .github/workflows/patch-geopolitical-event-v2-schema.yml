name: Patch geopolitical Event v2 schema guard

on:
  push:
    branches:
      - fix/geopolitical-event-v2-schema

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/geopolitical-event-v2-schema
          fetch-depth: 0
      - name: Apply exact 61-column schema guards
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('bybit_eu_swing_radar/backend')

          core = root / 'research/geopolitical_event_shadow_v2.py'
          text = core.read_text()
          text = text.replace(
              'MIN_EVENT_COLUMNS = 61\n',
              'EXPECTED_EVENT_COLUMNS = 61\nMIN_EVENT_COLUMNS = EXPECTED_EVENT_COLUMNS\n',
          )
          text = text.replace(
              '"schema_min_columns": MIN_EVENT_COLUMNS,',
              '"schema_expected_columns": EXPECTED_EVENT_COLUMNS,',
          )
          text = text.replace(
              'if len(columns) < MIN_EVENT_COLUMNS:',
              'if len(columns) != EXPECTED_EVENT_COLUMNS:',
          )
          core.write_text(text)

          api = root / 'app/research_geopolitical_event_v2_api.py'
          text = api.read_text()
          text = text.replace(
              'from research.geopolitical_event_shadow_v2 import (\n    PROVIDER,',
              'from research.geopolitical_event_shadow_v2 import (\n    EXPECTED_EVENT_COLUMNS,\n    PROVIDER,',
          )
          needle = '''                if total_rows > MAX_EVENT_ROWS:\n                    raise ValueError("GDELT Event export exceeds bounded row limit")\n                normalized = normalize_event_columns(columns)\n'''
          repl = '''                if total_rows > MAX_EVENT_ROWS:\n                    raise ValueError("GDELT Event export exceeds bounded row limit")\n                if len(columns) != EXPECTED_EVENT_COLUMNS:\n                    raise ValueError(\n                        f"GDELT Event export schema drift: expected {EXPECTED_EVENT_COLUMNS} columns, got {len(columns)}"\n                    )\n                normalized = normalize_event_columns(columns)\n'''
          if needle not in text:
              raise SystemExit('API row-loop contract not found')
          text = text.replace(needle, repl)
          text = text.replace(
              '        "zip_uncompressed_bytes": member.file_size,\n',
              '        "zip_uncompressed_bytes": member.file_size,\n        "schema_expected_columns": EXPECTED_EVENT_COLUMNS,\n        "schema_validated": True,\n',
          )
          api.write_text(text)

          test_core = root / 'test_geopolitical_event_shadow_v2.py'
          text = test_core.read_text()
          text = text.replace(
              'assert payload["schema_min_columns"] == 61',
              'assert payload["schema_expected_columns"] == 61',
          )
          text = text.replace(
              '    assert normalize_event_columns([""] * 58) is None\n',
              '    assert normalize_event_columns([""] * 58) is None\n    assert normalize_event_columns([""] * 62) is None\n',
          )
          test_core.write_text(text)

          test_api = root / 'test_geopolitical_event_v2_api.py'
          text = test_api.read_text()
          text = text.replace('    row[51] = "UP"\n    row[56] = "20260818123000"\n    row[57] = "https://example.com/story"\n',
                              '    row[51] = "4"\n    row[53] = "UP"\n    row[59] = "20260818123000"\n    row[60] = "https://example.com/story"\n')
          old = '''def test_event_zip_parses_valid_and_invalid_rows():\n    content = make_zip([make_row("1"), "too\\tshort", make_row("2", quad_class=1)])\n    events, meta = parse_event_zip(content)\n    assert meta["total_rows"] == 3\n    assert meta["valid_rows"] == 2\n    assert meta["invalid_rows"] == 1\n    assert [item["global_event_id"] for item in events] == ["1", "2"]\n'''
          new = '''def test_event_zip_parses_valid_and_semantically_invalid_rows():\n    invalid = make_row("bad").split("\\t")\n    invalid[53] = "4"\n    content = make_zip([make_row("1"), "\\t".join(invalid), make_row("2", quad_class=1)])\n    events, meta = parse_event_zip(content)\n    assert meta["total_rows"] == 3\n    assert meta["valid_rows"] == 2\n    assert meta["invalid_rows"] == 1\n    assert meta["schema_expected_columns"] == 61\n    assert meta["schema_validated"] is True\n    assert [item["global_event_id"] for item in events] == ["1", "2"]\n\n\ndef test_event_zip_fails_closed_on_column_count_drift():\n    content = make_zip([make_row("1"), "too\\tshort"])\n    with pytest.raises(ValueError, match="schema drift"):\n        parse_event_zip(content)\n'''
          if old not in text:
              raise SystemExit('API test contract not found')
          text = text.replace(old, new)
          test_api.write_text(text)

          smoke = root / 'scripts/production_geopolitical_event_v2_smoke.py'
          text = smoke.read_text()
          text = text.replace('import os\nimport sys\n', 'import os\nimport re\nimport sys\n')
          needle = '''    if not source.get("actual_md5"):\n        return False, "source_md5_missing"\n\n    coverage = payload.get("coverage") or {}\n'''
          repl = '''    if not source.get("actual_md5"):\n        return False, "source_md5_missing"\n    if int(source.get("schema_expected_columns") or 0) != 61:\n        return False, "unexpected_event_schema_column_count"\n    if source.get("schema_validated") is not True:\n        return False, "event_schema_not_validated"\n\n    coverage = payload.get("coverage") or {}\n'''
          if needle not in text:
              raise SystemExit('Smoke source contract not found')
          text = text.replace(needle, repl)
          needle = '''    if int(material.get("event_count") or 0) > valid_rows:\n        return False, "material_conflict_count_invalid"\n    quad_counts = context.get("quad_class_counts") or {}\n'''
          repl = '''    if int(material.get("event_count") or 0) > valid_rows:\n        return False, "material_conflict_count_invalid"\n    for bucket_name, bucket in (("all", all_events), ("material", material)):\n        for item in bucket.get("top_action_countries") or []:\n            key = str(item.get("key") or "")\n            if re.fullmatch(r"[A-Z]{2}", key) is None:\n                return False, f"invalid_action_country_code:{bucket_name}:{key}"\n    quad_counts = context.get("quad_class_counts") or {}\n'''
          if needle not in text:
              raise SystemExit('Smoke geography contract not found')
          text = text.replace(needle, repl)
          smoke.write_text(text)

          docs = root / 'GEOPOLITICAL_EVENT_SHADOW_V2.md'
          text = docs.read_text()
          text = text.replace(
              'The parser requires at least the stable 58-column core record and ignores additional columns rather than depending on them.',
              'The current v2 export contract is **exactly 61 columns**. The parser fails closed on any different column count. `ActionGeo_CountryCode` is read from the 54th field, `DATEADDED` from the 60th, and `SOURCEURL` from the 61st. Non-empty action-country values must match the two-letter FIPS geo-code shape and `DATEADDED` must be a 14-digit provider timestamp.',
          )
          docs.write_text(text)

          route_test = root / 'test_geopolitical_event_v2_route_contract.py'
          text = route_test.read_text()
          insert = '''\n\ndef test_v2_schema_guard_is_exact_and_fail_closed():\n    root = Path(__file__).resolve().parent\n    core = (root / "research" / "geopolitical_event_shadow_v2.py").read_text()\n    api = (root / "app" / "research_geopolitical_event_v2_api.py").read_text()\n    assert "EXPECTED_EVENT_COLUMNS = 61" in core\n    assert "len(columns) != EXPECTED_EVENT_COLUMNS" in core\n    assert "GDELT Event export schema drift" in api\n    assert '"schema_validated": True' in api\n'''
          if 'test_v2_schema_guard_is_exact_and_fail_closed' not in text:
              text += insert
          route_test.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-geopolitical-event-v2-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend .github/workflows/patch-geopolitical-event-v2-schema.yml
          git diff --cached --check
          git commit -m "Fix GDELT Event v2 schema guards"
          git push origin HEAD:fix/geopolitical-event-v2-schema
