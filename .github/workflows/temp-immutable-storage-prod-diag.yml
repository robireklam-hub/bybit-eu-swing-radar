name: Temp immutable storage production diag

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  production-diag:
    if: github.event.pull_request.head.ref == 'diag/immutable-storage-prod-8353bb1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 8353bb110fc14b713aa9ced25f45126fe55d86df
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      RAILWAY_ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
      DAY_RADAR_SERVICE_ID: b740fd25-f72b-4392-b156-7aa3b0c5ffd4

    steps:
      - name: Verify exact production API SHA
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          expected = os.environ['EXPECTED_MAIN_SHA']
          with urlopen(Request(base + '/version', headers={'Accept':'application/json','User-Agent':'immutable-storage-diag/1'}), timeout=20) as response:
              payload = json.loads(response.read().decode())
          actual = str(payload.get('commit_sha') or '')
          print('EXACT_API_SHA=' + actual)
          if actual != expected:
              raise SystemExit('production API SHA mismatch')
          PY

      - name: Run exact-main production DB catalog proof
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          ENDPOINT = 'https://backboard.railway.com/graphql/v2'
          SERVICE_NAME = 'immutable-storage-guard-diag'
          REPO = 'robireklam-hub/bybit-eu-swing-radar'
          ROOT = '/bybit_eu_swing_radar/backend'
          REGION = 'europe-west4-drams3a'
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          project_id = os.environ['RAILWAY_PROJECT_ID']
          environment_id = os.environ['RAILWAY_ENVIRONMENT_ID']
          source_service_id = os.environ['DAY_RADAR_SERVICE_ID']

          def gql(query, variables):
              request = Request(
                  ENDPOINT,
                  data=json.dumps({'query': query, 'variables': variables}).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['RAILWAY_API_TOKEN'],
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                      'User-Agent': 'immutable-storage-prod-diag/1',
                  },
              )
              last = None
              for attempt in range(4):
                  try:
                      with urlopen(request, timeout=30) as response:
                          payload = json.loads(response.read().decode())
                      if payload.get('errors'):
                          safe = [{'message': e.get('message'), 'path': e.get('path')} for e in payload['errors']]
                          raise RuntimeError('Railway GraphQL error: ' + json.dumps(safe))
                      return payload.get('data') or {}
                  except (HTTPError, URLError, TimeoutError) as exc:
                      last = exc
                      if attempt == 3:
                          raise
                      time.sleep(min(2 ** attempt, 8))
              raise last

          diag_source = r'''
          import asyncio
          import json
          import os
          import sys
          import time
          import asyncpg
          from research.research_trial_registry import TRIAL_REGISTRY_SCHEMA_SQL, trial_registry_status
          from research.research_snapshot_history import SCHEMA_SQL as HISTORY_SCHEMA_SQL, append_snapshot_history
          from app.research_signal_context_freeze_api import SCHEMA_SQL as FREEZE_SCHEMA_SQL

          TABLES = [
              'research_trial_registry',
              'research_snapshot_history',
              'research_signal_context_freezes',
          ]
          EXPECTED_TRIGGERS = {
              ('research_trial_registry', 'trg_research_trial_registry_no_row_mutation'),
              ('research_trial_registry', 'trg_research_trial_registry_no_truncate'),
              ('research_snapshot_history', 'trg_research_snapshot_history_no_row_mutation'),
              ('research_snapshot_history', 'trg_research_snapshot_history_no_truncate'),
              ('research_signal_context_freezes', 'trg_research_signal_context_freezes_no_row_mutation'),
              ('research_signal_context_freezes', 'trg_research_signal_context_freezes_no_truncate'),
          }

          async def main():
              expected_sha = os.environ['DIAG_EXPECTED_SHA']
              runtime_sha = os.environ.get('RAILWAY_GIT_COMMIT_SHA') or ''
              if runtime_sha != expected_sha:
                  raise RuntimeError('diagnostic runtime SHA mismatch')
              conn = await asyncpg.connect(os.environ['DATABASE_URL'])
              try:
                  await conn.execute(TRIAL_REGISTRY_SCHEMA_SQL)
                  registry = await trial_registry_status(conn, 'swing-liquidity-validation-v1')
                  if registry.get('registered') is not True:
                      raise RuntimeError('expected durable trial registry row is missing')

                  await conn.execute(HISTORY_SCHEMA_SQL)
                  row = await conn.fetchrow(
                      'SELECT research_family,spec_version,captured_at,capture_bucket,source_commit_sha,payload '
                      'FROM research_snapshot_history ORDER BY inserted_at DESC LIMIT 1'
                  )
                  if row is None:
                      raise RuntimeError('immutable raw history has no production row')
                  payload = row['payload']
                  if isinstance(payload, str):
                      payload = json.loads(payload)
                  retry = await append_snapshot_history(
                      conn,
                      research_family=row['research_family'],
                      spec_version=row['spec_version'],
                      captured_at=row['captured_at'],
                      capture_bucket=row['capture_bucket'],
                      source_commit_sha=row['source_commit_sha'],
                      snapshot=payload,
                  )
                  if retry.get('inserted') is not False:
                      raise RuntimeError('immutable history exact retry unexpectedly inserted a row')

                  await conn.execute(FREEZE_SCHEMA_SQL)
                  trigger_rows = await conn.fetch(
                      "SELECT c.relname AS table_name,t.tgname AS trigger_name "
                      "FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid "
                      "WHERE c.relname = ANY($1::text[]) AND NOT t.tgisinternal",
                      TABLES,
                  )
                  got = {(str(r['table_name']), str(r['trigger_name'])) for r in trigger_rows}
                  missing = sorted(EXPECTED_TRIGGERS - got)
                  if missing:
                      raise RuntimeError('missing immutable storage triggers: ' + json.dumps(missing))

                  counts = {}
                  for table in TABLES:
                      counts[table] = int(await conn.fetchval('SELECT COUNT(*)::int FROM ' + table) or 0)

                  evidence = {
                      'status': 'PASS',
                      'runtime_sha': runtime_sha,
                      'trial_registry_registered': True,
                      'history_exact_retry_inserted': False,
                      'history_retry_family': retry.get('research_family'),
                      'history_retry_spec_version': retry.get('spec_version'),
                      'trigger_count': len(EXPECTED_TRIGGERS),
                      'triggers': sorted([list(item) for item in EXPECTED_TRIGGERS]),
                      'table_counts': counts,
                      'destructive_probe_executed': False,
                  }
                  print('STORAGE_GUARD_DIAG=' + json.dumps(evidence, sort_keys=True), flush=True)
                  time.sleep(600)
              finally:
                  await conn.close()

          asyncio.run(main())
          '''
          command = "python -c \"import base64;exec(base64.b64decode('" + base64.b64encode(diag_source.encode()).decode() + "'))\""

          services_query = '''query project($id:String!){project(id:$id){services{edges{node{id name}}}}}'''
          services = (((gql(services_query, {'id': project_id}).get('project') or {}).get('services') or {}).get('edges') or [])
          service_id = ''
          for edge in services:
              node = edge.get('node') or {}
              if node.get('name') == SERVICE_NAME:
                  service_id = str(node.get('id') or '')
                  break
          if not service_id:
              created = gql(
                  '''mutation create($input:ServiceCreateInput!){serviceCreate(input:$input){id name}}''',
                  {'input': {'projectId': project_id, 'name': SERVICE_NAME, 'source': {'repo': REPO}}},
              ).get('serviceCreate') or {}
              service_id = str(created.get('id') or '')
          if not service_id:
              raise SystemExit('failed to resolve diagnostic Railway service')

          try:
              source_vars = gql(
                  '''query variables($projectId:String!,$environmentId:String!,$serviceId:String,$unrendered:Boolean){variables(projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId,unrendered:$unrendered)}''',
                  {'projectId': project_id, 'environmentId': environment_id, 'serviceId': source_service_id, 'unrendered': True},
              ).get('variables') or {}
              database_url = source_vars.get('DATABASE_URL')
              if not database_url:
                  raise RuntimeError('source DATABASE_URL missing')

              gql(
                  '''mutation vars($input:VariableCollectionUpsertInput!){variableCollectionUpsert(input:$input)}''',
                  {'input': {
                      'projectId': project_id,
                      'environmentId': environment_id,
                      'serviceId': service_id,
                      'variables': {'DATABASE_URL': str(database_url), 'DIAG_EXPECTED_SHA': expected_sha},
                  }},
              )
              gql(
                  '''mutation update($serviceId:String!,$environmentId:String!,$input:ServiceInstanceUpdateInput!){serviceInstanceUpdate(serviceId:$serviceId,environmentId:$environmentId,input:$input)}''',
                  {
                      'serviceId': service_id,
                      'environmentId': environment_id,
                      'input': {
                          'builder': 'RAILPACK',
                          'rootDirectory': ROOT,
                          'startCommand': command,
                          'restartPolicyType': 'NEVER',
                          'restartPolicyMaxRetries': 0,
                          'multiRegionConfig': {REGION: {'numReplicas': 1}},
                      },
                  },
              )
              deployment_id = str(gql(
                  '''mutation deploy($serviceId:String!,$environmentId:String!,$commitSha:String!){serviceInstanceDeployV2(serviceId:$serviceId,environmentId:$environmentId,commitSha:$commitSha)}''',
                  {'serviceId': service_id, 'environmentId': environment_id, 'commitSha': expected_sha},
              ).get('serviceInstanceDeployV2') or '')
              if not deployment_id:
                  raise RuntimeError('diagnostic deployment id missing')
              print('DIAG_DEPLOYMENT_ID=' + deployment_id)

              evidence_line = None
              terminal = None
              for attempt in range(180):
                  deployment = gql('query deployment($id:String!){deployment(id:$id){id status}}', {'id': deployment_id}).get('deployment') or {}
                  terminal = str(deployment.get('status') or 'UNKNOWN')
                  logs = gql(
                      '''query deploymentLogs($deploymentId:String!,$limit:Int){deploymentLogs(deploymentId:$deploymentId,limit:$limit){timestamp message severity}}''',
                      {'deploymentId': deployment_id, 'limit': 200},
                  ).get('deploymentLogs') or []
                  for item in logs:
                      message = str((item or {}).get('message') or '')
                      if message.startswith('STORAGE_GUARD_DIAG='):
                          evidence_line = message
                          break
                  if evidence_line:
                      break
                  if terminal in {'FAILED','CRASHED','REMOVED','CANCELLED'}:
                      break
                  time.sleep(5)
              if not evidence_line:
                  raise RuntimeError('production DB diagnostic did not emit PASS evidence; deployment_status=' + str(terminal))
              evidence = json.loads(evidence_line.split('=', 1)[1])
              if evidence.get('status') != 'PASS' or evidence.get('runtime_sha') != expected_sha:
                  raise RuntimeError('invalid production DB diagnostic evidence')
              print('PRODUCTION_STORAGE_GUARD_EVIDENCE=' + json.dumps(evidence, sort_keys=True))
              print('IMMUTABLE STORAGE EXACT-MAIN PRODUCTION VERIFIED.')
          finally:
              try:
                  gql('mutation delete($id:String!){serviceDelete(id:$id)}', {'id': service_id})
                  print('DIAG_SERVICE_CLEANED=true')
              except Exception as exc:
                  print('DIAG_SERVICE_CLEANUP_WARNING=' + type(exc).__name__)
          PY
