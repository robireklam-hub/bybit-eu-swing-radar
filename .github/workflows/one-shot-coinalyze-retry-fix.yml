name: One-shot Coinalyze Retry-After fix

on:
  push:
    branches: ["fix/coinalyze-retry-after-decimal"]
    paths:
      - ".github/workflows/one-shot-coinalyze-retry-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/coinalyze-retry-after-decimal

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Patch decimal Retry-After handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bybit_eu_swing_radar/backend/worker.py")
          text = path.read_text()
          old = '            wait_seconds = int(response.headers.get("Retry-After", "60"))\n'
          new = '''            try:\n                wait_seconds = math.ceil(float(response.headers.get("Retry-After", "60")))\n            except (TypeError, ValueError):\n                wait_seconds = 60\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Retry-After parser line, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Run targeted regression and compile check
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
          python -m pytest -q test_coinalyze_retry_after.py
          python -m py_compile worker.py

      - name: Remove one-shot workflow and push patch
        run: |
          rm .github/workflows/one-shot-coinalyze-retry-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bybit_eu_swing_radar/backend/worker.py .github/workflows/one-shot-coinalyze-retry-fix.yml
          git commit -m "Handle decimal Coinalyze Retry-After values"
          git push origin HEAD:fix/coinalyze-retry-after-decimal
