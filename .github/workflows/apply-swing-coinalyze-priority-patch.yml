name: Apply swing Coinalyze priority patch

on:
  push:
    branches:
      - fix/swing-coinalyze-priority-coverage

permissions:
  contents: write

concurrency:
  group: apply-swing-coinalyze-priority-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/swing-coinalyze-priority-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact semantic patch
        run: python scripts/apply_swing_coinalyze_priority_patch.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_swing_coinalyze_priority_patch.py
          rm .github/workflows/apply-swing-coinalyze-priority-patch.yml
      - name: Commit patched worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: prioritize compact swing candidates for Coinalyze"
          git push origin HEAD:fix/swing-coinalyze-priority-coverage
