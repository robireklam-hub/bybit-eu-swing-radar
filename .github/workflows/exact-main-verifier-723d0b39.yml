name: NEVER MERGE exact-main verifier 723d0b39

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exact-main-verifier-723d0b39.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 723d0b396031a39f14192017f2621a692fef30ba
    steps:
      - name: Check out exact production main
        uses: actions/checkout@v7
        with:
          ref: 723d0b396031a39f14192017f2621a692fef30ba

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify swing candidate Coinalyze semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Verify swing liquidity label-blind event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Verify swing liquidity maturity status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py

      - name: Verify controlled-pullback calibration readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_controlled_pullback_calibration_readiness.py
