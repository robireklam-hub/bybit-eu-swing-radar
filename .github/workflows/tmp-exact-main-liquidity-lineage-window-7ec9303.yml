name: NEVER MERGE exact-main liquidity lineage window verifier

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-exact-main-liquidity-lineage-window-7ec9303.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      BYBIT_EU_PUBLIC_BASE_URL: https://api.bybit.eu
      EXPECTED_SHA: 7ec9303518b3f6d4b72dd07052aaa5f0bac2fffa
    steps:
      - name: Check out exact main
        uses: actions/checkout@v7
        with:
          ref: 7ec9303518b3f6d4b72dd07052aaa5f0bac2fffa

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Wait for exact production API build
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          expected = os.environ['EXPECTED_SHA']
          for attempt in range(80):
              try:
                  with urllib.request.urlopen(base + '/version', timeout=10) as response:
                      payload = json.load(response)
                  served = payload.get('commit_sha')
                  print(f'API_SHA_ATTEMPT_{attempt + 1}={served}')
                  if served == expected:
                      raise SystemExit(0)
              except Exception as exc:
                  print(f'API_SHA_ATTEMPT_{attempt + 1}_ERROR={type(exc).__name__}:{exc}')
              time.sleep(15)
          raise SystemExit('exact production API SHA did not become ready')
          PY

      - name: Verify swing candidate Coinalyze semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Verify swing liquidity event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Verify swing liquidity maturity status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py

      - name: Verify bounded non-persisting swing worker lineage on fresh snapshot
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os
          from scripts.run_swing_liquidity_shadow_worker_lineage_guarded import collect_snapshot_with_worker_lineage
          snapshot = collect_snapshot_with_worker_lineage(
              os.environ['PRODUCTION_RADAR_API_BASE_URL'],
              os.environ['PRODUCTION_RADAR_API_KEY'],
              os.environ['BYBIT_EU_PUBLIC_BASE_URL'],
          )
          safe = {
              'scan_data_as_of': snapshot.get('scan_data_as_of'),
              'source_commit_sha': snapshot.get('source_commit_sha'),
              'swing_worker_source_commit_sha': snapshot.get('swing_worker_source_commit_sha'),
              'swing_worker_checked_at': snapshot.get('swing_worker_checked_at'),
              'swing_worker_lineage_observation': snapshot.get('swing_worker_lineage_observation'),
              'source_commit_semantics': snapshot.get('source_commit_semantics'),
              'candidate_count': snapshot.get('candidate_count'),
              'orderbook_count': len(snapshot.get('orderbooks') or {}),
              'orderbook_error_count': len(snapshot.get('orderbook_errors') or {}),
          }
          print('SWING_LIQUIDITY_WORKER_LINEAGE_VERIFIED=' + json.dumps(safe, sort_keys=True))
          if safe['source_commit_sha'] != os.environ['EXPECTED_SHA']:
              raise SystemExit('lineage guard did not bind to exact expected main SHA')
          if safe['swing_worker_source_commit_sha'] != os.environ['EXPECTED_SHA']:
              raise SystemExit('lineage guard did not bind to exact expected worker SHA')
          if safe['swing_worker_lineage_observation'] not in {'pre_collection', 'post_collection', 'both', 'bounded_rotation'}:
              raise SystemExit('lineage guard did not publish a valid bounded bracket observation')
          PY
