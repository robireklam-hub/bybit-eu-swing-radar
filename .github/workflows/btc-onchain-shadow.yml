name: BTC on-chain context shadow

on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bybit_eu_swing_radar/backend/research/btc_onchain_shadow.py"
      - "bybit_eu_swing_radar/backend/app/research_btc_onchain_api.py"
      - "bybit_eu_swing_radar/backend/scripts/production_btc_onchain_smoke.py"
      - ".github/workflows/btc-onchain-shadow.yml"

permissions:
  contents: read

concurrency:
  group: btc-onchain-context-shadow
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Capture and verify BTC on-chain context
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_btc_onchain_smoke.py
