name: Verify current microstructure research state 716f012

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-microstructure-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact production target
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify recorder and readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_smoke.py
      - name: Verify alignment sample status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status.py
      - name: Verify effect status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_effect_status.py
