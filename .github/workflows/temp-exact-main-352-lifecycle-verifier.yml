name: TEMP exact-main #352 lifecycle verifier NEVER MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-exact-main-352-lifecycle-verifier.yml"

permissions:
  contents: read

concurrency:
  group: temp-exact-main-352-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
      BYBIT_EU_PUBLIC_BASE_URL: https://api.bybit.eu
    steps:
      - name: Check out exact PR base main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wait for exact production API main SHA
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen

          base = os.environ["PRODUCTION_RADAR_API_BASE_URL"].rstrip("/")
          key = os.environ["PRODUCTION_RADAR_API_KEY"]
          expected = os.environ["EXPECTED_SHA"]
          last = None
          for attempt in range(120):
              try:
                  req = Request(base + "/version", headers={"X-Radar-Key": key, "Accept": "application/json"})
                  with urlopen(req, timeout=15) as response:
                      payload = json.load(response)
                  last = payload
                  actual = str(payload.get("source_commit_sha") or payload.get("git_sha") or payload.get("commit_sha") or "")
                  print(f"PRODUCTION_VERSION attempt={attempt + 1} actual={actual} expected={expected}")
                  if actual == expected:
                      print("EXACT_PRODUCTION_API_SHA_VERIFIED")
                      break
              except Exception as exc:
                  print(f"PRODUCTION_VERSION attempt={attempt + 1} error={type(exc).__name__}:{exc}")
              time.sleep(5)
          else:
              raise SystemExit(f"exact production API SHA did not arrive; last={last!r}")
          PY

      - name: Verify actual compact swing Coinalyze candidate semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Force one fresh label-blind capture and verify prospective lifecycle adoption
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.swing_liquidity_shadow import collect_snapshot, persist_snapshot

          base = os.environ["PRODUCTION_RADAR_API_BASE_URL"]
          key = os.environ["PRODUCTION_RADAR_API_KEY"]
          bybit = os.environ["BYBIT_EU_PUBLIC_BASE_URL"]
          snapshot = collect_snapshot(base, key, bybit)
          Path("temp-lifecycle-forward-snapshot.json").write_text(
              json.dumps(snapshot, ensure_ascii=False, indent=2, sort_keys=True)
          )
          persisted = persist_snapshot(base, key, snapshot)
          print("LIFECYCLE_PERSISTENCE_RESULT=" + json.dumps(persisted, sort_keys=True, default=str))

          if persisted.get("inserted") is not True:
              raise SystemExit("fresh verifier capture was not durably inserted")
          adoption = persisted.get("lifecycle_adoption")
          if not isinstance(adoption, dict):
              raise SystemExit("lifecycle_adoption response is missing")
          required = {
              "attempted": True,
              "event_type": "TRIAL_REGISTERED",
              "prospective_adoption": True,
              "historical_backfill": False,
              "research_only": True,
              "live_strategy_mutated": False,
              "production_eligibility_mutated": False,
              "execution_authorized": False,
          }
          mismatches = {key: (adoption.get(key), value) for key, value in required.items() if adoption.get(key) != value}
          if mismatches:
              raise SystemExit(f"lifecycle adoption invariant mismatch: {mismatches}")
          if adoption.get("reason") not in {"prospective_trial_registration", "lifecycle_already_adopted"}:
              raise SystemExit(f"unexpected lifecycle adoption reason: {adoption.get('reason')}")
          if adoption.get("reason") == "prospective_trial_registration" and adoption.get("inserted") is not True:
              raise SystemExit("prospective lifecycle registration did not insert")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"EXPECTED_SWING_LIQUIDITY_CAPTURE_AT={snapshot['captured_at']}\n")
          print("SWING_LIQUIDITY_PROSPECTIVE_LIFECYCLE_ADOPTION_VERIFIED")
          PY

      - name: Verify exact durable forward capture state
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_forward_status.py

      - name: Verify label-blind swing liquidity event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Verify label-blind swing liquidity maturity status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py

      - name: Upload verifier snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-lifecycle-forward-snapshot-${{ github.run_id }}
          path: bybit_eu_swing_radar/backend/temp-lifecycle-forward-snapshot.json
          retention-days: 7
          if-no-files-found: ignore
