name: Temporary patch day Coinalyze target health

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/day-coinalyze-target-health' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/day-coinalyze-target-health
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q -r bybit_eu_swing_radar/backend/requirements.txt pytest pytest-asyncio
      - name: Apply and test target-health patch
        shell: bash
        run: |
          python .github/temp_patch_day_coinalyze_target_health.py
          cd bybit_eu_swing_radar/backend
          python -m pytest -q test_day_coinalyze_context.py test_day_coinalyze_target_health.py
          python -m pytest -q
          python -m compileall -q .
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bybit_eu_swing_radar/backend/day_worker.py bybit_eu_swing_radar/backend/test_day_coinalyze_target_health.py
          git diff --cached --check
          git commit -m 'Fix day Coinalyze target health semantics'
          git push origin HEAD:fix/day-coinalyze-target-health
