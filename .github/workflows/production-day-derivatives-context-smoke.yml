name: Production day derivatives context smoke

on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-day-derivatives-context-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out expected main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify day OI/funding priority and Flow fallback
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_day_derivatives_context_smoke.py
