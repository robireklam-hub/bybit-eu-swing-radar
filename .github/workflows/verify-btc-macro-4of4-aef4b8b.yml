name: Verify production BTC macro 4 of 4 aef4b8b

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-btc-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: aef4b8bba192b29930512eac73ffc10c3ab647fd
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v7
        with:
          ref: aef4b8bba192b29930512eac73ffc10c3ab647fd
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify BTC macro cycle ETF production layer with 4 of 4 macro coverage
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_btc_macro_cycle_etf_shadow_smoke.py
