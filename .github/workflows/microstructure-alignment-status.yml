name: Microstructure alignment sample watch

on:
  workflow_run:
    workflows: ["Microstructure forward recorder smoke"]
    types: [completed]
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microstructure-alignment-sample-watch
  cancel-in-progress: true

jobs:
  alignment-sample-watch:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out expected main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check preregistered alignment sample readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status.py
