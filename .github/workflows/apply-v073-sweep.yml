name: Apply v0.7.3 sweep integration

on:
  push:
    branches: [feat/day-sweep-v073]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/day-sweep-v073
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Apply targeted v0.7.3 patch
        run: python scripts/apply_v073_sweep_patch.py

      - name: Run targeted sweep regressions
        run: python -m pytest -q test_sweep_research.py test_day_sweep_v073.py

      - name: Run full backend test suite
        run: python -m pytest -q

      - name: Compile changed production modules
        run: python -m py_compile day_worker.py journal.py backtest.py sweep_research.py

      - name: Commit clean feature diff
        working-directory: .
        run: |
          rm bybit_eu_swing_radar/backend/scripts/apply_v073_sweep_patch.py
          rm .github/workflows/apply-v073-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/backend/day_worker.py \
            bybit_eu_swing_radar/backend/journal.py \
            bybit_eu_swing_radar/backend/backtest.py \
            bybit_eu_swing_radar/backend/sweep_research.py \
            bybit_eu_swing_radar/backend/scripts/apply_v073_sweep_patch.py \
            .github/workflows/apply-v073-sweep.yml
          git diff --cached --check
          git status --short
          git commit -m "Integrate v0.7.3 liquidity-sweep entry confirmation"
          git push origin HEAD:feat/day-sweep-v073
