name: NEVER MERGE inspect recorder build settings

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-recorder-deploy-8dc89339.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      RAILWAY_ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
      API_SERVICE_ID: 6b92a19d-a178-4eab-9b8a-9fed1855319b
      MICROSTRUCTURE_RECORDER_SERVICE_ID: 61664eb1-4a59-4947-bae9-18410a2221b8
    steps:
      - name: Install Railway CLI
        run: |
          bash <(curl -fsSL https://railway.com/install.sh) -y
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Inspect Railway API schema for root directory
        run: |
          railway api search rootDirectory || true
          railway api search startCommand || true
          railway api search serviceInstance || true

      - name: Inspect API and recorder service status
        run: |
          echo '=== API ==='
          railway service status --service "$API_SERVICE_ID" --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json || true
          echo '=== RECORDER ==='
          railway service status --service "$MICROSTRUCTURE_RECORDER_SERVICE_ID" --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json || true
