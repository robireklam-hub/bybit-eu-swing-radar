name: Patch WALCL RRP official fallback integration

on:
  push:
    branches: [fix/btc-macro-walcl-rrp-official-fallback]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  RADAR_API_KEY: test-radar-key
  COINALYZE_API_KEY: test-coinalyze-key

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/btc-macro-walcl-rrp-official-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Wire official WALCL and RRP fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('bybit_eu_swing_radar/backend/app/research_btc_macro_cycle_etf_api.py')
          text = api.read_text()
          import_anchor = '''from research.btc_macro_cycle_etf_shadow import (\n    SPEC_VERSION,\n    build_snapshot,\n    spec,\n    summarize_btc_price,\n    summarize_cycle,\n    summarize_etf_rows,\n    summarize_series,\n)\n'''
          import_new = import_anchor + '''from research.macro_liquidity_fallback import (\n    SUPPORTED_SERIES as LIQUIDITY_FALLBACK_SERIES,\n    fetch_official_liquidity_fallback,\n)\n'''
          if 'fetch_official_liquidity_fallback' not in text:
              if import_anchor not in text:
                  raise SystemExit('research import anchor not found')
              text = text.replace(import_anchor, import_new, 1)

          old = '''    except Exception:\n        if series_id not in FED_BOARD_FALLBACKS:\n            raise\n        return await _fetch_fed_board_fallback(client, series_id)\n'''
          new = '''    except Exception:\n        if series_id in FED_BOARD_FALLBACKS:\n            return await _fetch_fed_board_fallback(client, series_id)\n        if series_id in LIQUIDITY_FALLBACK_SERIES:\n            return await fetch_official_liquidity_fallback(client, series_id)\n        raise\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'LIQUIDITY_FALLBACK_SERIES' not in text:
              raise SystemExit('FRED fallback block not found')
          api.write_text(text)

          smoke = Path('bybit_eu_swing_radar/backend/scripts/production_btc_macro_cycle_etf_shadow_smoke.py')
          text = smoke.read_text()
          text = text.replace('if live_macro < 2:\n        return False, "insufficient_live_macro_series"',
                              'if live_macro < 4:\n        return False, "incomplete_macro_coverage"')
          if 'live_macro < 4' not in text:
              raise SystemExit('4/4 macro smoke contract not applied')
          smoke.write_text(text)
          PY
      - name: Run focused tests and contract checks
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pytest -q test_macro_liquidity_fallback.py test_btc_macro_cycle_etf_shadow.py test_research_btc_macro_cycle_etf_api.py test_production_btc_macro_cycle_etf_shadow_smoke.py
          python - <<'PY'
          import inspect
          from app import research_btc_macro_cycle_etf_api as api
          from scripts import production_btc_macro_cycle_etf_shadow_smoke as smoke
          source = inspect.getsource(api._fetch_fred_series)
          assert 'LIQUIDITY_FALLBACK_SERIES' in source
          assert 'fetch_official_liquidity_fallback' in source
          smoke_source = inspect.getsource(smoke.validate_capture)
          assert 'live_macro < 4' in smoke_source
          PY
          python -m compileall -q app/research_btc_macro_cycle_etf_api.py research/macro_liquidity_fallback.py scripts/production_btc_macro_cycle_etf_shadow_smoke.py
      - name: Commit validated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bybit_eu_swing_radar/backend/app/research_btc_macro_cycle_etf_api.py bybit_eu_swing_radar/backend/scripts/production_btc_macro_cycle_etf_shadow_smoke.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix: wire official WALCL and RRP fallbacks"
          git pull --rebase origin fix/btc-macro-walcl-rrp-official-fallback
          git push origin HEAD:fix/btc-macro-walcl-rrp-official-fallback
