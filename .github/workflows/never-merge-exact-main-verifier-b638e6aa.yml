name: NEVER MERGE exact-main production verifier b638e6aa

on:
  push:
    branches: [research/exact-main-verifier-b638e6aa]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: b638e6aab89f0d9b092ae250acc3a6f6100636ee

    steps:
      - name: Check out exact production main
        uses: actions/checkout@v7
        with:
          ref: b638e6aab89f0d9b092ae250acc3a6f6100636ee

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact production API SHA
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          expected = os.environ['EXPECTED_SHA']
          for attempt in range(120):
              try:
                  req = urllib.request.Request(base + '/version')
                  key = os.environ.get('PRODUCTION_RADAR_API_KEY', '')
                  if key:
                      req.add_header('X-API-Key', key)
                  with urllib.request.urlopen(req, timeout=15) as r:
                      payload = json.load(r)
                  actual = payload.get('source_commit_sha') or payload.get('commit_sha') or payload.get('git_sha')
                  print(f'attempt={attempt+1} actual={actual} expected={expected}')
                  if actual == expected:
                      raise SystemExit(0)
              except Exception as exc:
                  print(f'attempt={attempt+1} error={type(exc).__name__}: {exc}')
              time.sleep(5)
          raise SystemExit('exact production API SHA did not converge')
          PY

      - name: Verify swing candidate Coinalyze semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Verify label-blind swing liquidity event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Verify swing liquidity maturity
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py

      - name: Verify v0.7.6 successor preregistration contract
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          from research.microstructure import alignment as v1
          from research.microstructure import alignment_v3 as v3
          from research.microstructure import alignment_v4 as v4
          spec = v4.alignment_spec()
          assert v4.PREREGISTERED_STRATEGY_VERSION == '0.7.6'
          assert spec['parent_spec_version'] == v3.SPEC_VERSION
          assert spec['feature_definition_source'] == v1.SPEC_VERSION
          assert spec['strategy_version_isolated'] is True
          assert spec['forward_only'] is True
          assert spec['label_blind'] is True
          assert spec['outcome_visible'] is False
          assert spec['promotion_allowed'] is False
          assert spec['threshold_search_allowed'] is False
          assert spec['minimum_signal_sample'] == {'total': 60, 'per_symbol': 10}
          assert spec['hypotheses'] == list(v1.HYPOTHESES)
          assert v4.COHORT_START_AT > v4.PRODUCTION_VERIFIED_BY
          assert spec['production_activation_evidence']['strategy_merge_sha'] == '2201a7d5b4e5e54ee65a17ebc51a11ac3d90e281'
          assert spec['production_activation_evidence']['exact_production_verifier_pr'] == 399
          print('MICROSTRUCTURE V0.7.6 SUCCESSOR PREREGISTRATION VERIFIED CLOSED-UNTIL-SAMPLE.')
          PY
