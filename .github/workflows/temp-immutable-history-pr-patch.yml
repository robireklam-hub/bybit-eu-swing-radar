name: Temporary immutable history PR integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'research/immutable-snapshot-history-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/immutable-snapshot-history-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt
      - name: Apply integrations
        run: python scripts/temp_integrate_snapshot_history.py
      - name: Install and test
        working-directory: bybit_eu_swing_radar/backend
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
          python -m pytest -q
          python -m compileall -q app research flow_context.py flow_worker.py
      - name: Commit clean integration
        run: |
          rm -f scripts/temp_integrate_snapshot_history.py
          rm -f .github/workflows/temp-immutable-history-integrate.yml
          rm -f .github/workflows/temp-immutable-history-pr-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Preserve immutable history for mutable research snapshots'
          git push origin HEAD:research/immutable-snapshot-history-v1
