name: NEVER MERGE check microstructure sample 4404ae10

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/check-microstructure-sample-4404ae10.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 4404ae1067b14ce3cc92e86488d9d7b5c219e073
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: 4404ae1067b14ce3cc92e86488d9d7b5c219e073

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check alignment sample gate
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_microstructure_alignment_status.py

      - name: Check preregistered effect gate
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_microstructure_effect_status.py
