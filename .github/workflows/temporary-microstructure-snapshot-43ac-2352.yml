name: NEVER MERGE microstructure snapshot 43ac 2352

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 43ac02a34b30b946841777ccda03092e846e6d76
      MICROSTRUCTURE_REQUIRE_EXACT_RECORDER_SHA: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify recorder and readiness in scheduled-monitor mode
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_smoke.py
      - name: Verify frozen v1 cohort
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status.py
      - name: Verify v2 cohort
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status_v2.py
      - name: Verify active v3 cohort
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status_v3.py
      - name: Verify successor gates remain closed until ready
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_successor_effect_gate_guard.py
