name: Apply positioning liquidation wiring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-positioning:
    runs-on: ubuntu-latest
    if: github.head_ref == 'research/wire-liquidation-positioning-v1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/wire-liquidation-positioning-v1
      - name: Patch dedicated liquidation source
        shell: python
        run: |
          from pathlib import Path

          api = Path('bybit_eu_swing_radar/backend/app/research_derivatives_positioning_api.py')
          text = api.read_text()
          start_marker = "    latest_scan_row = await connection.fetchrow("
          end_marker = "    return symbols, regime_snapshot, flow_map, liquidation_map"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('positioning liquidation cache markers not found')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          new = "\n".join([
              "    liquidation_map: dict[str, Any] = {}",
              "    try:",
              "        liquidation_row = await connection.fetchrow(",
              "            \"\"\"",
              "            SELECT captured_at,payload",
              "            FROM research_liquidation_context_snapshots",
              "            WHERE spec_version='liquidation-context-shadow-v1'",
              "              AND captured_at <= NOW()",
              "              AND captured_at >= NOW() - INTERVAL '2 hours'",
              "            ORDER BY captured_at DESC",
              "            LIMIT 1",
              "            \"\"\"",
              "        )",
              "    except asyncpg.UndefinedTableError:",
              "        liquidation_row = None",
              "",
              "    if liquidation_row is not None:",
              "        liquidation_snapshot = _decode(liquidation_row[\"payload\"])",
              "        raw_liquidations = liquidation_snapshot.get(\"symbols\")",
              "        wanted = set(symbols)",
              "        if isinstance(raw_liquidations, Mapping):",
              "            for symbol, item in raw_liquidations.items():",
              "                normalized = str(symbol).upper()",
              "                if (",
              "                    normalized in wanted",
              "                    and isinstance(item, Mapping)",
              "                    and item.get(\"coverage\") is True",
              "                ):",
              "                    row = dict(item)",
              "                    row.setdefault(\"symbol\", normalized)",
              "                    liquidation_map[normalized] = row",
              "        elif isinstance(raw_liquidations, list):",
              "            for item in raw_liquidations:",
              "                if not isinstance(item, Mapping):",
              "                    continue",
              "                normalized = str(item.get(\"symbol\") or \"\").upper()",
              "                if normalized in wanted and item.get(\"coverage\") is True:",
              "                    liquidation_map[normalized] = dict(item)",
              "",
              "    return symbols, regime_snapshot, flow_map, liquidation_map",
          ])
          text = text[:start] + new + text[end:]

          upstream_anchor = '        "liquidation_cache_symbols": sorted(liquidation_map.keys()),\n'
          upstream_new = upstream_anchor + '        "liquidation_source_spec_version": "liquidation-context-shadow-v1",\n'
          if upstream_anchor not in text:
              raise SystemExit('positioning upstream anchor not found')
          text = text.replace(upstream_anchor, upstream_new, 1)
          api.write_text(text)

          classifier = Path('bybit_eu_swing_radar/backend/research/derivatives_positioning_shadow.py')
          text = classifier.read_text()
          old = '            "liquidations": "existing cached Coinalyze context when available",\n'
          new = '            "liquidations": "liquidation-context-shadow-v1 forward snapshot; Coinalyze derivatives context only",\n'
          if old not in text:
              raise SystemExit('positioning spec liquidation input anchor not found')
          classifier.write_text(text.replace(old, new, 1))
      - name: Remove temporary workflow and push final patch
        run: |
          rm .github/workflows/apply-positioning-liquidation-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/app/research_derivatives_positioning_api.py bybit_eu_swing_radar/backend/research/derivatives_positioning_shadow.py .github/workflows/apply-positioning-liquidation-wiring.yml
          git commit -m "Research: wire dedicated liquidation context into positioning"
          git push origin HEAD:research/wire-liquidation-positioning-v1
