name: Temp current swing semantic verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: b9fc2a855c96c6dba6d8c18cf958c5d3ec9a1f1f

    steps:
      - name: Check out verifier branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify current swing Coinalyze candidate semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Verify current swing liquidity event semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Report current swing liquidity maturity readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py
