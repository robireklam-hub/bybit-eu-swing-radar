name: Patch market regime shadow v1 routes

on:
  push:
    branches: [research/market-regime-shadow-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  RADAR_API_KEY: test-radar-key
  COINALYZE_API_KEY: test-coinalyze-key

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/market-regime-shadow-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Wire market regime research routes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bybit_eu_swing_radar/backend/app/microstructure_research.py')
          text = path.read_text()
          import_line = 'from app.research_market_regime_api import attach_market_regime_research\n'
          anchor = 'from research.microstructure.readiness import get_readiness\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('readiness import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)
          call = '    attach_market_regime_research(app, require_api_key)\n'
          if call not in text:
              text = text.rstrip() + '\n\n' + call
          path.write_text(text)
          PY
      - name: Run targeted tests and route contract
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pytest -q test_market_regime_shadow.py test_microstructure_research_lifecycle.py
          python - <<'PY'
          from fastapi import FastAPI
          from app.microstructure_research import attach_microstructure_research
          app = FastAPI()
          def key():
              return None
          attach_microstructure_research(app, key)
          routes = {route.path for route in app.routes}
          required = {
              '/v1/research/market-regime/spec',
              '/v1/research/market-regime/capture',
              '/v1/research/market-regime/status',
          }
          missing = required - routes
          assert not missing, f'missing market regime research routes: {sorted(missing)}'
          PY
          python -m compileall -q app research scripts/production_market_regime_shadow_smoke.py
      - name: Self-clean and commit validated wiring
        run: |
          rm .github/workflows/_patch-market-regime-shadow-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bybit_eu_swing_radar/backend/app/microstructure_research.py .github/workflows/_patch-market-regime-shadow-v1.yml
          git commit -m "Research: wire market regime shadow routes"
          git push origin HEAD:research/market-regime-shadow-v1
