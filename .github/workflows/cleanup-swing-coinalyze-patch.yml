name: Cleanup swing Coinalyze patch artifacts

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/swing-coinalyze-market-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove generated Python bytecode and self
        run: |
          find bybit_eu_swing_radar/backend -type d -name '__pycache__' -prune -exec rm -rf {} +
          find bybit_eu_swing_radar/backend -type f -name '*.pyc' -delete
          rm .github/workflows/cleanup-swing-coinalyze-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove generated Python bytecode from fix branch'
          git push origin HEAD:${{ github.head_ref }}
