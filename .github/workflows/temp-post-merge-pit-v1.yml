name: Temporary post-merge PIT-v1 verification

on:
  push:
    branches:
      - diag/post-merge-pit-v1-e5eb95a

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXACT_MAIN_SHA: e5eb95a2dbe57fe51f53ba25880ccff2643c34a3
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      BYBIT_EU_PUBLIC_BASE_URL: https://api.bybit.eu
      SWING_LIQUIDITY_SHADOW_OUTPUT: swing-liquidity-shadow.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark diagnostic pending
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"diag/post-merge-pit-v1\",\"description\":\"Exact main + production PIT verification running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_MAIN_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify exact main code
        working-directory: bybit_eu_swing_radar/backend
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN_SHA"
          python -m pytest -q
          python -m compileall -q app flow_context.py flow_worker.py research

      - name: Wait for exact production API deploy
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          expected = os.environ['EXACT_MAIN_SHA']
          last = None
          for _ in range(72):
              try:
                  req = Request(base + '/version', headers={'Accept':'application/json','User-Agent':'pit-v1-post-merge-verifier/1'})
                  with urlopen(req, timeout=10) as response:
                      payload = json.load(response)
                  last = payload.get('commit_sha')
                  if last == expected:
                      print('EXACT_PRODUCTION_API_SHA=' + last)
                      break
              except Exception as exc:
                  last = type(exc).__name__
              time.sleep(5)
          else:
              raise SystemExit(f'exact production API SHA not observed; last={last!r}')
          PY

      - name: Capture and persist first post-merge PIT-v1 snapshot
        working-directory: bybit_eu_swing_radar/backend
        run: python research/swing_liquidity_shadow.py

      - name: Bind exact capture timestamp
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          payload = json.loads(Path('swing-liquidity-shadow.json').read_text())
          assert payload['point_in_time']['point_in_time_verified'] is True
          assert payload['point_in_time']['provenance_version'] == 'pit-v1'
          assert payload['trial_fingerprint']
          print('EXPECTED_SWING_LIQUIDITY_CAPTURE_AT=' + payload['captured_at'])
          print('EXPECTED_TRIAL_FINGERPRINT=' + payload['trial_fingerprint'])
          PY

      - name: Verify exact durable forward capture
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_forward_status.py

      - name: Verify production PIT and event semantics
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ['PRODUCTION_RADAR_API_KEY']
          def get(path):
              req = Request(base + path, headers={'Accept':'application/json','X-Radar-Key':key,'User-Agent':'pit-v1-post-merge-verifier/1'})
              with urlopen(req, timeout=30) as response:
                  return json.load(response)
          status = get('/v1/research/swing-liquidity/forward-status')
          events = get('/v1/research/swing-liquidity/forward-event-status')
          captures = int(status.get('capture_count') or 0)
          verified = int(status.get('point_in_time_verified_captures') or 0)
          legacy = int(status.get('legacy_or_unverified_captures') or 0)
          event_count = int(events.get('event_count') or 0)
          event_verified = int(events.get('point_in_time_verified_event_count') or 0)
          event_legacy = int(events.get('legacy_or_unverified_event_count') or 0)
          assert status.get('research_only') is True
          assert status.get('live_strategy_mutated') is False
          assert status.get('promotion_allowed') is False
          assert captures > 0 and verified >= 1 and verified + legacy == captures
          assert events.get('research_only') is True
          assert events.get('label_blind') is True
          assert events.get('outcome_visible') is False
          assert events.get('live_strategy_mutated') is False
          assert events.get('promotion_allowed') is False
          assert event_verified + event_legacy == event_count
          summary = {
              'capture_count': captures,
              'point_in_time_verified_captures': verified,
              'legacy_or_unverified_captures': legacy,
              'candidate_observations': status.get('candidate_observations'),
              'last_capture_at': status.get('last_capture_at'),
              'event_count': event_count,
              'matured_event_count': events.get('matured_event_count'),
              'point_in_time_verified_event_count': event_verified,
              'legacy_or_unverified_event_count': event_legacy,
              'builder_version': events.get('builder_version'),
              'event_identity': events.get('event_identity'),
              'kline_errors': events.get('kline_errors'),
          }
          print('PIT_PRODUCTION_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Mark diagnostic success
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"diag/post-merge-pit-v1\",\"description\":\"Exact main tests + production PIT-v1 verified\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Mark diagnostic failure
        if: failure()
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"diag/post-merge-pit-v1\",\"description\":\"Post-merge PIT-v1 verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
