name: Diagnose Railway scope for recorder provisioning b54fbd0

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/provision-microstructure-recorder-b54fbd0'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
    steps:
      - name: Verify account/workspace token presence
        run: |
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "FAIL RAILWAY_API_TOKEN is not configured"
            exit 1
          fi
          echo "RAILWAY_API_TOKEN present; value redacted."

      - name: Probe user identity without failing workspace-scoped tokens
        run: |
          if railway whoami --json >/tmp/whoami.json 2>/tmp/whoami.err; then
            echo "WHOAMI_OK"
            cat /tmp/whoami.json
          else
            echo "WHOAMI_UNAVAILABLE"
            sed -E 's/[A-Za-z0-9_-]{24,}/[redacted]/g' /tmp/whoami.err
          fi

      - name: Probe visible projects and workspace metadata independently
        run: |
          if railway list --json >/tmp/projects.json 2>/tmp/projects.err; then
            echo "PROJECT_LIST_OK"
            cat /tmp/projects.json
          else
            echo "PROJECT_LIST_UNAVAILABLE"
            sed -E 's/[A-Za-z0-9_-]{24,}/[redacted]/g' /tmp/projects.err
          fi

      - name: Probe direct project link independently
        run: |
          if railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --json >/tmp/link.json 2>/tmp/link.err; then
            echo "PROJECT_LINK_OK"
            cat /tmp/link.json
          else
            echo "PROJECT_LINK_UNAVAILABLE"
            sed -E 's/[A-Za-z0-9_-]{24,}/[redacted]/g' /tmp/link.err
          fi

      - name: Classify token usability
        run: |
          if grep -q 'PROJECT_LINK_OK' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            exit 0
          fi
          if [ -s /tmp/projects.json ] && grep -q "$PROJECT_ID" /tmp/projects.json; then
            echo "TOKEN_CAN_SEE_PROJECT_BUT_LINK_NEEDS_WORKSPACE_SCOPE"
            exit 0
          fi
          echo "TOKEN_CANNOT_ACCESS_TARGET_PROJECT"
          exit 1
