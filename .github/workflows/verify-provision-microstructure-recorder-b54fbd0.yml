name: Retry standalone microstructure recorder in EU West b54fbd0

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  retry-cutover:
    if: github.head_ref == 'ops/provision-microstructure-recorder-b54fbd0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
      API_SERVICE_ID: 6b92a19d-a178-4eab-9b8a-9fed1855319b
      STANDALONE_SERVICE_ID: 61664eb1-4a59-4947-bae9-18410a2221b8
      EXPECTED_SHA: b54fbd01e086d1f7d1b57d6324d32241e11e2d89
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b54fbd01e086d1f7d1b57d6324d32241e11e2d89

      - name: Install Railway CLI
        run: |
          bash <(curl -fsSL https://railway.com/install.sh) -y
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Link production project
        run: railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" >/dev/null

      - name: Move standalone recorder to EU West
        run: |
          railway scale europe-west4-drams3a=1 us-west=0 \
            --service "$STANDALONE_SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" --json

      - name: Enable standalone recorder on exact source SHA
        run: |
          railway variable set \
            MICROSTRUCTURE_RECORDER_ENABLED=true \
            "MICROSTRUCTURE_SOURCE_COMMIT_SHA=$EXPECTED_SHA" \
            --service "$STANDALONE_SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" >/dev/null
          echo "Standalone recorder enabled in EU West; API remains owner until cutover."

      - name: Wait for standalone deployment to settle
        run: |
          for i in $(seq 1 60); do
            status=$(railway service status --service "$STANDALONE_SERVICE_ID" --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --json 2>/dev/null || true)
            if printf '%s' "$status" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"SUCCESS"'; then
              echo "Standalone recorder deployment is SUCCESS."
              exit 0
            fi
            if printf '%s' "$status" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"(FAILED|CRASHED|REMOVED)"'; then
              echo "FAIL standalone recorder deployment terminal state"
              exit 1
            fi
            sleep 5
          done
          echo "FAIL standalone recorder deployment timeout"
          exit 1

      - name: Switch API recorder owner to external
        run: |
          railway variable set MICROSTRUCTURE_RECORDER_OWNER=external \
            --service "$API_SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" >/dev/null
          echo "API recorder owner switched to external."

      - name: Verify exact-SHA external recorder and readiness
        id: verify_external
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_external_smoke.py

      - name: Fail-safe rollback on verification failure
        if: failure()
        run: |
          railway variable set MICROSTRUCTURE_RECORDER_ENABLED=false \
            --service "$STANDALONE_SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" >/dev/null || true
          railway variable set MICROSTRUCTURE_RECORDER_OWNER=api \
            --service "$API_SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" >/dev/null || true
          echo "Fail-safe rollback requested after unsuccessful external verification."
