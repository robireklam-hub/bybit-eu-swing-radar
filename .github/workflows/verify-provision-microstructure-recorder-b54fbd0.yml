name: Diagnose standalone microstructure recorder deployment b54fbd0

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/provision-microstructure-recorder-b54fbd0'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
      RECORDER_SERVICE: microstructure-recorder
      DEPLOYMENT_ID: 59f20fd7-cb06-4e3c-a8f1-34cafd1461ff
    steps:
      - name: Link production project
        run: railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" >/dev/null

      - name: Show recorder status
        run: railway service status --service "$RECORDER_SERVICE" --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --json

      - name: Show failed build logs
        run: railway logs "$DEPLOYMENT_ID" --build --lines 200

      - name: Show failed deployment logs
        run: railway logs "$DEPLOYMENT_ID" --deployment --lines 200
