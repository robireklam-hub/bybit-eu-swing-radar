name: Temporary post-merge trial registry verification

on:
  push:
    branches:
      - diag/post-merge-trial-registry-31c030b

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXACT_MAIN_SHA: 31c030b84dfbbc2b805b0999f38c10cf8895b36f
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      BYBIT_EU_PUBLIC_BASE_URL: https://api.bybit.eu
      SWING_LIQUIDITY_SHADOW_OUTPUT: swing-liquidity-shadow.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark diagnostic pending
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"diag/post-merge-trial-registry\",\"description\":\"Exact main + durable trial registry verification running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_MAIN_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify exact merged main
        working-directory: bybit_eu_swing_radar/backend
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN_SHA"
          python -m pytest -q
          python -m compileall -q app research flow_context.py flow_worker.py

      - name: Wait for exact production API deploy
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          expected = os.environ['EXACT_MAIN_SHA']
          last = None
          for _ in range(72):
              try:
                  req = Request(base + '/version', headers={'Accept':'application/json','User-Agent':'trial-registry-post-merge/1'})
                  with urlopen(req, timeout=10) as response:
                      payload = json.load(response)
                  last = payload.get('commit_sha')
                  if last == expected:
                      print('EXACT_PRODUCTION_API_SHA=' + last)
                      break
              except Exception as exc:
                  last = type(exc).__name__
              time.sleep(5)
          else:
              raise SystemExit(f'exact production API SHA not observed; last={last!r}')
          PY

      - name: Capture and persist PIT-v1 snapshot
        working-directory: bybit_eu_swing_radar/backend
        run: python research/swing_liquidity_shadow.py

      - name: Bind expected durable identifiers
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          payload = json.loads(Path('swing-liquidity-shadow.json').read_text())
          assert payload['point_in_time']['version'] == 'pit-v1'
          assert payload['trial_id'] == 'swing-liquidity-validation-v1'
          assert payload['trial_manifest']['revision'] == 1
          assert payload['trial_fingerprint']
          print('EXPECTED_SWING_LIQUIDITY_CAPTURE_AT=' + payload['captured_at'])
          print('EXPECTED_TRIAL_FINGERPRINT=' + payload['trial_fingerprint'])
          PY

      - name: Verify exact durable capture
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_forward_status.py

      - name: Verify production durable trial registry
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ['PRODUCTION_RADAR_API_KEY']
          def get(path):
              req = Request(base + path, headers={'Accept':'application/json','X-Radar-Key':key,'User-Agent':'trial-registry-post-merge/1'})
              with urlopen(req, timeout=30) as response:
                  return json.load(response)
          status = get('/v1/research/swing-liquidity/forward-status')
          events = get('/v1/research/swing-liquidity/forward-event-status')
          registry = status.get('trial_registry') or {}
          assert status.get('research_only') is True
          assert status.get('live_strategy_mutated') is False
          assert status.get('promotion_allowed') is False
          assert registry.get('registered') is True
          assert registry.get('immutable') is True
          assert registry.get('trial_id') == 'swing-liquidity-validation-v1'
          assert int(registry.get('revision') or 0) == 1
          assert registry.get('research_family') == 'swing-liquidity'
          assert registry.get('manifest_fingerprint') == os.environ['EXPECTED_TRIAL_FINGERPRINT']
          assert registry.get('source_commit_sha') == os.environ['EXACT_MAIN_SHA']
          manifest = registry.get('manifest') or {}
          assert manifest.get('frozen') is True
          assert manifest.get('preregistered') is True
          assert int(manifest.get('development_target_matured_events') or 0) == 60
          assert int(manifest.get('validation_target_matured_events') or 0) == 40
          assert events.get('research_only') is True
          assert events.get('outcome_visible') is False
          assert events.get('promotion_allowed') is False
          summary = {
              'capture_count': status.get('capture_count'),
              'candidate_observations': status.get('candidate_observations'),
              'point_in_time_verified_captures': status.get('point_in_time_verified_captures'),
              'legacy_or_unverified_captures': status.get('legacy_or_unverified_captures'),
              'event_count': events.get('event_count'),
              'matured_event_count': events.get('matured_event_count'),
              'trial_id': registry.get('trial_id'),
              'revision': registry.get('revision'),
              'manifest_fingerprint': registry.get('manifest_fingerprint'),
              'source_commit_sha': registry.get('source_commit_sha'),
              'registered_at': registry.get('registered_at'),
              'immutable': registry.get('immutable'),
          }
          print('TRIAL_REGISTRY_PRODUCTION_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Mark diagnostic success
        if: success()
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"diag/post-merge-trial-registry\",\"description\":\"Exact main + durable trial registry verified\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Mark diagnostic failure
        if: failure()
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"diag/post-merge-trial-registry\",\"description\":\"Post-merge durable trial registry verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
