name: TEMP append day v0.7.6 spec

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-once:
    if: github.head_ref == 'feature/day-v076-setup-entry-state'
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Append backend spec annex
        run: python scripts/temp_append_day_v076_spec.py

      - name: Remove temporary append machinery
        run: |
          rm scripts/temp_append_day_v076_spec.py
          rm .github/workflows/temp-append-day-v076-spec.yml

      - name: Commit spec annex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/BACKEND_SPEC_HU.md \
            scripts/temp_append_day_v076_spec.py \
            .github/workflows/temp-append-day-v076-spec.yml
          git diff --cached --check
          git commit -m "Docs: add day v0.7.6 backend contract annex"
          git push origin HEAD:${{ github.head_ref }}
