name: Apply liquidation context route wiring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-route:
    runs-on: ubuntu-latest
    if: github.head_ref == 'research/liquidation-forward-context-v1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/liquidation-forward-context-v1
      - name: Wire research route and route contract test
        shell: python
        run: |
          from pathlib import Path

          api = Path('bybit_eu_swing_radar/backend/app/research_derivatives_positioning_api.py')
          text = api.read_text()
          marker = 'attach_liquidation_context_research(app, require_api_key)'
          if marker not in text:
              text = text.rstrip() + '''\n\n    # Research-only liquidation context collector. It is attached under the\n    # existing research router and never enters live strategy/scoring/execution.\n    from app.research_liquidation_context_api import attach_liquidation_context_research\n\n    attach_liquidation_context_research(app, require_api_key)\n'''
              api.write_text(text)

          test = Path('bybit_eu_swing_radar/backend/test_liquidation_context_routes.py')
          test.write_text('''from fastapi import FastAPI\n\nfrom app.research_derivatives_positioning_api import attach_derivatives_positioning_research\n\n\ndef test_liquidation_context_routes_are_registered_and_hidden() -> None:\n    app = FastAPI()\n\n    def require_key() -> None:\n        return None\n\n    attach_derivatives_positioning_research(app, require_key)\n    routes = {route.path: route for route in app.routes}\n    expected = {\n        "/v1/research/liquidation-context/spec",\n        "/v1/research/liquidation-context/capture",\n        "/v1/research/liquidation-context/status",\n    }\n    assert expected.issubset(routes)\n    for path in expected:\n        assert routes[path].include_in_schema is False\n''')
      - name: Remove temporary workflow and push final patch
        run: |
          rm .github/workflows/apply-liquidation-context-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/app/research_derivatives_positioning_api.py bybit_eu_swing_radar/backend/test_liquidation_context_routes.py .github/workflows/apply-liquidation-context-route.yml
          git commit -m "Research: wire liquidation context routes"
          git push origin HEAD:research/liquidation-forward-context-v1
