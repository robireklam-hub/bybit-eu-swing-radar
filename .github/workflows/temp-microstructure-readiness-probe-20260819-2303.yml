name: Temp microstructure readiness probe 20260819 2303

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 930894adf557249d99d902fa9ff9fecdd853ef13
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 930894adf557249d99d902fa9ff9fecdd853ef13
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Recorder and readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_smoke.py
      - name: Alignment sample status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status.py
      - name: Effect status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_effect_status.py
