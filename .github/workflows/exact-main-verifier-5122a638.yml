name: NEVER MERGE exact-main verifier 5122a638

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exact-main-verifier-5122a638.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 5122a63819ee39e96bcf9c08e1aa5317178fb244
    steps:
      - name: Check out exact production main
        uses: actions/checkout@v7
        with:
          ref: 5122a63819ee39e96bcf9c08e1aa5317178fb244

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify current microstructure recorder and readiness gate
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_smoke.py

      - name: Verify v0.7.5 microstructure alignment sample readiness
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_alignment_status_v3.py
