name: NEVER MERGE exact-main verifier 5122a638

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exact-main-verifier-5122a638.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 5122a63819ee39e96bcf9c08e1aa5317178fb244
    steps:
      - name: Check out exact production main
        uses: actions/checkout@v7
        with:
          ref: 5122a63819ee39e96bcf9c08e1aa5317178fb244

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify swing candidate Coinalyze semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Verify swing liquidity label-blind event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Verify swing liquidity maturity status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py

      - name: Verify controlled-pullback calibration readiness without backend DB dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_controlled_pullback_calibration_readiness.py
