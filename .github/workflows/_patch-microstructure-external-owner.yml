name: Patch microstructure external owner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ops/isolate-microstructure-recorder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/isolate-microstructure-recorder
      - name: Patch API owner mode
        shell: python
        run: |
          from pathlib import Path

          path = Path('bybit_eu_swing_radar/backend/app/microstructure_research.py')
          text = path.read_text()

          old = 'import asyncio\nimport logging\nfrom datetime import datetime\n'
          new = 'import asyncio\nimport logging\nimport os\nfrom datetime import datetime\n'
          if old not in text:
              raise SystemExit('import anchor missing')
          text = text.replace(old, new, 1)

          old = 'from research.microstructure.data_access import load_recent_bucket_payload\n'
          new = old + 'from research.microstructure.runtime_status import load_runtime_status\n'
          if old not in text:
              raise SystemExit('runtime import anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''def _ensure_task_started() -> bool:\n'''
          helper = '''def _recorder_owner() -> str:\n    owner = os.getenv("MICROSTRUCTURE_RECORDER_OWNER", "api").strip().lower()\n    if owner not in {"api", "external"}:\n        raise ValueError("MICROSTRUCTURE_RECORDER_OWNER must be api or external")\n    return owner\n\n\ndef _ensure_task_started() -> bool:\n'''
          if anchor not in text:
              raise SystemExit('task anchor missing')
          text = text.replace(anchor, helper, 1)

          old = '''    global _task\n    recorder = _ensure_recorder()\n'''
          new = '''    global _task\n    if _recorder_owner() != "api":\n        return False\n    recorder = _ensure_recorder()\n'''
          if old not in text:
              raise SystemExit('task body anchor missing')
          text = text.replace(old, new, 1)

          old = '''    async def status() -> dict[str, Any]:\n        try:\n            _ensure_task_started()\n            # Yield once so the newly scheduled collector can set its initial\n            # runtime state before we report status on first access.\n            await asyncio.sleep(0)\n        except Exception as exc:\n            logger.exception("microstructure recorder self-start failed")\n            payload = microstructure_status()\n            payload["start_error"] = str(exc)[:1000]\n            return payload\n        return microstructure_status()\n'''
          new = '''    async def status() -> dict[str, Any]:\n        try:\n            recorder = _ensure_recorder()\n            if _recorder_owner() == "external":\n                return await load_runtime_status(\n                    recorder.config.database_url,\n                    recorder.config.symbols,\n                )\n            _ensure_task_started()\n            # Yield once so the newly scheduled collector can set its initial\n            # runtime state before we report status on first access.\n            await asyncio.sleep(0)\n        except Exception as exc:\n            logger.exception("microstructure recorder status failed")\n            payload = microstructure_status()\n            payload["start_error"] = str(exc)[:1000]\n            return payload\n        payload = microstructure_status()\n        payload["process_role"] = "api"\n        return payload\n'''
          if old not in text:
              raise SystemExit('status route anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Remove temporary patch workflow and push
        run: |
          rm .github/workflows/_patch-microstructure-external-owner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/app/microstructure_research.py .github/workflows/_patch-microstructure-external-owner.yml
          git commit -m "Research: support external microstructure recorder owner"
          git push origin HEAD:ops/isolate-microstructure-recorder
