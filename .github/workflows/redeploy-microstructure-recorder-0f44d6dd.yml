name: NEVER MERGE redeploy microstructure recorder 0f44d6dd

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/redeploy-microstructure-recorder-0f44d6dd.yml"

permissions:
  contents: read

jobs:
  redeploy-recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 846f5088-4e8b-45fe-84d9-0728542b2c36
      ENVIRONMENT_ID: 2be04d3c-82b3-487d-930c-a4fbc7d483d8
      STANDALONE_SERVICE_ID: 61664eb1-4a59-4947-bae9-18410a2221b8
      EXPECTED_SHA: 0f44d6ddfb6b8585a76d16d8cee0b86791f87ac5
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: 0f44d6ddfb6b8585a76d16d8cee0b86791f87ac5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Railway CLI
        run: |
          bash <(curl -fsSL https://railway.com/install.sh) -y
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Link production project
        run: railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" >/dev/null

      - name: Set exact source metadata
        run: |
          railway variable set \
            MICROSTRUCTURE_RECORDER_ENABLED=true \
            "MICROSTRUCTURE_SOURCE_COMMIT_SHA=$EXPECTED_SHA" \
            --service "$STANDALONE_SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" >/dev/null

      - name: Upload exact current-main source to standalone recorder
        run: |
          railway up . \
            --project "$PROJECT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --service "$STANDALONE_SERVICE_ID" \
            --detach \
            --message "microstructure exact-main $EXPECTED_SHA"
          echo "Exact main source upload queued for standalone recorder."

      - name: Wait for standalone recorder deployment
        run: |
          sleep 12
          for i in $(seq 1 90); do
            status=$(railway service status --service "$STANDALONE_SERVICE_ID" --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --json 2>/dev/null || true)
            printf '%s' "$status" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("RECORDER_DEPLOY_STATUS="+str(d.get("status"))+" deployment="+str(d.get("deploymentId")))' || true
            if printf '%s' "$status" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"SUCCESS"'; then
              echo "Standalone recorder deployment is SUCCESS."
              exit 0
            fi
            if printf '%s' "$status" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"(FAILED|CRASHED|REMOVED)"'; then
              echo "FAIL standalone recorder deployment entered terminal failure state"
              exit 1
            fi
            sleep 5
          done
          echo "FAIL standalone recorder deployment did not reach SUCCESS"
          exit 1

      - name: Verify exact external recorder and prospective runtime
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_microstructure_smoke.py
