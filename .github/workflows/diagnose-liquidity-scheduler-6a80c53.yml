name: Diagnose swing liquidity scheduler exact main

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/diagnose-liquidity-scheduler-6a80c53'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect recent scheduled workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python -u - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/swing-liquidity-shadow.yml/runs?per_page=20'
          req = Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + token,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'liquidity-scheduler-diagnostic/1',
          })
          with urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode())
          runs = []
          for row in payload.get('workflow_runs') or []:
              runs.append({
                  'id': row.get('id'),
                  'run_number': row.get('run_number'),
                  'event': row.get('event'),
                  'status': row.get('status'),
                  'conclusion': row.get('conclusion'),
                  'created_at': row.get('created_at'),
                  'run_started_at': row.get('run_started_at'),
                  'updated_at': row.get('updated_at'),
                  'head_sha': row.get('head_sha'),
              })
          print('SWING_LIQUIDITY_RECENT_RUNS=' + json.dumps(runs, sort_keys=True), flush=True)
          if not runs:
              raise SystemExit('FAIL no workflow runs returned')
          PY
