name: Temporary patch Signal Freeze v2 routes

on:
  push:
    branches:
      - "research/signal-context-freeze-v2"
    paths:
      - ".github/workflows/patch-signal-freeze-v2-routes.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Attach hidden Signal Freeze v2 routes and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path("bybit_eu_swing_radar/backend/app/main.py")
          text = main.read_text()
          attach = "attach_signal_context_freeze_v2_research(app, require_api_key)"
          if attach not in text:
              text = text.rstrip() + "\n\n# Research-only prospective Signal-Time Context Freeze v2. V1 remains\n# immutable; V2 accepts only signals opened after the first Cross-Layer v2 snapshot.\nfrom app.research_signal_context_freeze_v2_api import attach_signal_context_freeze_v2_research\n\nattach_signal_context_freeze_v2_research(app, require_api_key)\n"
              main.write_text(text)
          Path(".github/workflows/patch-signal-freeze-v2-routes.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bybit_eu_swing_radar/backend/app/main.py .github/workflows/patch-signal-freeze-v2-routes.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research: attach Signal-Time Context Freeze v2 routes"
          git push origin HEAD:${GITHUB_REF_NAME}
