name: NEVER MERGE verify successor cohorts 8902cb95

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-successor-cohorts-8902cb95.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 8902cb95f5ecc7c00a95c4660846542cc3a78192
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8902cb95f5ecc7c00a95c4660846542cc3a78192
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: v0.7.3 alignment
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_microstructure_alignment_status.py
      - name: v0.7.4 alignment
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_microstructure_alignment_status_v2.py
      - name: v0.7.5 alignment
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_microstructure_alignment_status_v3.py
      - name: v0.7.3 effect gate
        working-directory: bybit_eu_swing_radar/backend
        run: python -u scripts/production_microstructure_effect_status.py
