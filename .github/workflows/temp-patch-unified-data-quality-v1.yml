name: Temporary patch unified data quality v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: temp-patch-unified-data-quality-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'research/unified-data-quality-contracts-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/unified-data-quality-contracts-v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q -r bybit_eu_swing_radar/backend/requirements.txt pytest pytest-asyncio
      - name: Patch Cross-Layer v2 and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('bybit_eu_swing_radar/backend/research/cross_layer_context_v2.py')
          text = path.read_text()

          old = 'from typing import Any, Mapping\n\nSPEC_VERSION = "cross-layer-context-shadow-v2"'
          new = '''from typing import Any, Mapping\n\nfrom research.research_data_quality import (\n    CONTRACT_VERSION as DATA_QUALITY_CONTRACT_VERSION,\n    aggregate_contract_results,\n    contract_manifest,\n    evaluate_source_record,\n    source_max_age_seconds,\n)\n\nSPEC_VERSION = "cross-layer-context-shadow-v2"'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''LAYER_MAX_AGE_SECONDS = {\n    "market_regime": 3 * 3600,\n    "derivatives_positioning": 3 * 3600,\n    "event_tokenomics": 8 * 3600,\n    "btc_macro_cycle_etf": 8 * 3600,\n    "relative_strength": 36 * 3600,\n    "sector_rotation": 36 * 3600,\n    "btc_onchain": 8 * 3600,\n    "eth_onchain": 8 * 3600,\n}'''
          new = '''LAYER_SOURCES = (\n    "market_regime",\n    "derivatives_positioning",\n    "event_tokenomics",\n    "btc_macro_cycle_etf",\n    "relative_strength",\n    "sector_rotation",\n    "btc_onchain",\n    "eth_onchain",\n)\nLAYER_MAX_AGE_SECONDS = {\n    name: source_max_age_seconds(name)\n    for name in LAYER_SOURCES\n}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '        "max_symbols": MAX_SYMBOLS,\n        "layer_max_age_seconds": dict(LAYER_MAX_AGE_SECONDS),'
          new = '''        "max_symbols": MAX_SYMBOLS,\n        "data_quality_contract_version": DATA_QUALITY_CONTRACT_VERSION,\n        "data_quality_contract": contract_manifest(),\n        "layer_max_age_seconds": dict(LAYER_MAX_AGE_SECONDS),'''
          assert old in text
          text = text.replace(old, new, 1)

          pattern = re.compile(r'''def _layer_meta\(\n.*?\n\n\ndef build_context_snapshot\(''', re.S)
          matches = list(pattern.finditer(text))
          assert len(matches) == 1, len(matches)
          replacement = '''def _layer_meta(\n    name: str,\n    record: Mapping[str, Any] | None,\n    captured_at: datetime,\n) -> dict[str, Any]:\n    # Preserve the existing temporal status keys while adding a common\n    # completeness/lineage/severity contract. Evaluation never mutates or\n    # filters source payloads and never grants production eligibility.\n    return evaluate_source_record(name, record, observed_at=captured_at)\n\n\ndef build_context_snapshot('''
          text = text[:matches[0].start()] + replacement + text[matches[0].end():]

          old = '''    layer_meta = {\n        name: _layer_meta(name, records.get(name), now)\n        for name in LAYER_MAX_AGE_SECONDS\n    }\n    payloads: dict[str, dict[str, Any]] = {}'''
          new = '''    layer_meta = {\n        name: _layer_meta(name, records.get(name), now)\n        for name in LAYER_MAX_AGE_SECONDS\n    }\n    data_quality_contract = aggregate_contract_results(layer_meta)\n    payloads: dict[str, dict[str, Any]] = {}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '        "data_quality": quality,\n        "layer_fresh_count": fresh_count,'
          new = '''        "data_quality": quality,\n        "data_quality_contract": data_quality_contract,\n        "layer_fresh_count": fresh_count,'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cd bybit_eu_swing_radar/backend
          python -m pytest -q test_research_data_quality.py test_cross_layer_data_quality_contract.py
          python -m pytest -q
          python -m compileall -q .
          git diff --check
      - name: Commit production integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bybit_eu_swing_radar/backend/research/cross_layer_context_v2.py
          git diff --cached --check
          git commit -m 'Research: integrate unified data quality contracts v1'
          git push origin HEAD:research/unified-data-quality-contracts-v1
