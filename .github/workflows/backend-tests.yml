name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply v0.7.5 breakout persistence patch once
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/day-v075-breakout-persistence'
        working-directory: .
        run: |
          git fetch origin fix/day-v075-breakout-persistence main
          git checkout -B fix/day-v075-breakout-persistence origin/fix/day-v075-breakout-persistence
          sed -i "s/replace_all(version_iso, '0.7.4', '0.7.5', minimum=4)/replace_all(version_iso, '0.7.4', '0.7.5', minimum=3)/" scripts/temp_apply_v075_breakout_persistence.py
          python scripts/temp_apply_v075_breakout_persistence.py
          git checkout origin/main -- .github/workflows/backend-tests.yml
          rm scripts/temp_apply_v075_breakout_persistence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/backend/day_worker.py \
            bybit_eu_swing_radar/backend/journal_core.py \
            bybit_eu_swing_radar/backend/backtest.py \
            bybit_eu_swing_radar/backend/app/repository.py \
            bybit_eu_swing_radar/backend/app/main.py \
            bybit_eu_swing_radar/backend/flow_context.py \
            bybit_eu_swing_radar/action/openapi.yaml \
            bybit_eu_swing_radar/agent/AGENT_INSTRUCTIONS_HU.md \
            bybit_eu_swing_radar/BACKEND_SPEC_HU.md \
            bybit_eu_swing_radar/backend/test_day_impulse_breakout_trigger.py \
            bybit_eu_swing_radar/backend/test_day_breakout_journal_dedupe_v075.py \
            bybit_eu_swing_radar/backend/test_v073_contract_alignment.py \
            bybit_eu_swing_radar/backend/test_v073_version_isolation.py \
            bybit_eu_swing_radar/backend/test_v073_railway_backtest_dispatch.py \
            .github/workflows/backend-tests.yml \
            scripts/temp_apply_v075_breakout_persistence.py
          git commit -m "Fix day v0.7.5 breakout persistence"
          git push origin HEAD:fix/day-v075-breakout-persistence

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify runtime imports and required routes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python - <<'PY'
          import asyncpg
          import fastapi
          import httpx
          import pydantic
          import pydantic_settings

          import app.main
          import app.repository
          import flow_worker

          routes = {route.path for route in app.main.app.routes}
          assert "/version" in routes, "required /version route is missing"
          PY

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile production modules
        run: python -m compileall -q app flow_context.py flow_worker.py
