name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply agent market-context reporting patch once
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/agent-market-context-reporting-v1'
        working-directory: .
        run: |
          git fetch origin fix/agent-market-context-reporting-v1 main
          git checkout -B fix/agent-market-context-reporting-v1 origin/fix/agent-market-context-reporting-v1
          python scripts/temp_apply_agent_market_context_reporting.py
          git checkout origin/main -- .github/workflows/backend-tests.yml
          rm scripts/temp_apply_agent_market_context_reporting.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bybit_eu_swing_radar/agent/AGENT_INSTRUCTIONS_HU.md \
            bybit_eu_swing_radar/action/openapi.yaml \
            bybit_eu_swing_radar/backend/test_agent_market_context_reporting_contract.py \
            .github/workflows/backend-tests.yml \
            scripts/temp_apply_agent_market_context_reporting.py
          git diff --cached --check
          git commit -m "Require explicit market-context reporting"
          git push origin HEAD:fix/agent-market-context-reporting-v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify runtime imports and required routes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python - <<'PY'
          import asyncpg
          import fastapi
          import httpx
          import pydantic
          import pydantic_settings

          import app.main
          import app.repository
          import flow_worker

          routes = {route.path for route in app.main.app.routes}
          assert "/version" in routes, "required /version route is missing"
          PY

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile production modules
        run: python -m compileall -q app flow_context.py flow_worker.py
