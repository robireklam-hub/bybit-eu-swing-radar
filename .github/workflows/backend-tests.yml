name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Apply v0.7.7 patch and clean temporary harness
        if: github.event_name == 'pull_request'
        run: |
          python scripts/temp_apply_day_v077.py
          cd ../..
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/backend-tests.yml
          rm -f bybit_eu_swing_radar/backend/scripts/temp_apply_day_v077.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/backend-tests.yml \
            bybit_eu_swing_radar/backend/day_worker.py \
            bybit_eu_swing_radar/backend/journal_core.py \
            bybit_eu_swing_radar/backend/app/repository.py \
            bybit_eu_swing_radar/backend/app/main.py \
            bybit_eu_swing_radar/backend/test_day_v077_persistent_recommendation.py
          git rm --cached --ignore-unmatch bybit_eu_swing_radar/backend/scripts/temp_apply_day_v077.py || true
          git add -u -- bybit_eu_swing_radar/backend/scripts/temp_apply_day_v077.py
          git commit -m "Fix day v0.7.7 persistent breakout recommendation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify runtime imports and required routes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python - <<'PY'
          import asyncpg
          import fastapi
          import httpx
          import pydantic
          import pydantic_settings

          import app.main
          import app.repository
          import flow_worker

          routes = {route.path for route in app.main.app.routes}
          assert "/version" in routes, "required /version route is missing"
          PY

      - name: Run focused v0.7.7 regression
        run: python -m pytest -q test_day_v077_persistent_recommendation.py test_day_v076_live_worker_regression.py test_day_v076_state_machine.py

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile production modules
        run: python -m compileall -q app flow_context.py flow_worker.py
