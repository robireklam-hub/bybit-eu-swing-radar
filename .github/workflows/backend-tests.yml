name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify runtime imports and required routes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python - <<'PY'
          import asyncpg
          import fastapi
          import httpx
          import pydantic
          import pydantic_settings

          import app.main
          import app.repository
          import flow_worker

          routes = {route.path for route in app.main.app.routes}
          assert "/version" in routes, "required /version route is missing"
          PY

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile production modules
        run: python -m compileall -q app flow_context.py flow_worker.py

  temporary-production-semantics:
    if: github.head_ref == 'diag/current-main-swing-liquidity-099d3e0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 099d3e011950f3a023d040b290fbe7b19d0b2c1b
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - name: Check out exact main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify swing Coinalyze candidate semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py
      - name: Verify swing liquidity label-blind event semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py
