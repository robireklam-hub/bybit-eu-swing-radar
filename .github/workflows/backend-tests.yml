name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Finalize v0.7.7 live contracts and clean harness
        if: github.event_name == 'pull_request'
        run: |
          python scripts/temp_finalize_day_v077_contracts.py
          cd ../..
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/backend-tests.yml
          git rm -f bybit_eu_swing_radar/backend/scripts/temp_finalize_day_v077_contracts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/backend-tests.yml \
            bybit_eu_swing_radar/backend/flow_context.py \
            bybit_eu_swing_radar/action/openapi.yaml \
            bybit_eu_swing_radar/backend/test_day_sweep_v073.py \
            bybit_eu_swing_radar/backend/test_day_v076_version_isolation.py \
            bybit_eu_swing_radar/backend/test_journal_schema_hotpath.py \
            bybit_eu_swing_radar/backend/test_v073_contract_alignment.py \
            bybit_eu_swing_radar/backend/test_v073_version_isolation.py \
            bybit_eu_swing_radar/backend/test_day_v076_live_worker_regression.py
          git commit -m "Align day v0.7.7 live contracts and version-isolated tests"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify runtime imports and required routes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python - <<'PY'
          import asyncpg
          import fastapi
          import httpx
          import pydantic
          import pydantic_settings

          import app.main
          import app.repository
          import flow_worker

          routes = {route.path for route in app.main.app.routes}
          assert "/version" in routes, "required /version route is missing"
          PY

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile production modules
        run: python -m compileall -q app flow_context.py flow_worker.py
