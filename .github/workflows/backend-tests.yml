name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_eu_swing_radar/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply impulse breakout fix on isolated PR only
        if: github.head_ref == 'fix/btc-impulse-breakout-coverage'
        run: python temp_apply_impulse_from_emitter.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bybit_eu_swing_radar/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Verify runtime imports and required routes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RADAR_API_KEY: test-radar-key
          COINALYZE_API_KEY: test-coinalyze-key
        run: |
          python - <<'PY'
          import asyncpg
          import fastapi
          import httpx
          import pydantic
          import pydantic_settings

          import app.main
          import app.repository
          import flow_worker

          routes = {route.path for route in app.main.app.routes}
          assert "/version" in routes, "required /version route is missing"
          PY

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile production modules
        run: python -m compileall -q app flow_context.py flow_worker.py
