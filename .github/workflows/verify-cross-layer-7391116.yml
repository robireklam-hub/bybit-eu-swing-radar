name: Verify production cross layer 7391116

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-cross-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 7391116e128c24215f281b34d9720243e78d8abd
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v7
        with:
          ref: 7391116e128c24215f281b34d9720243e78d8abd
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify production cross-layer context
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_cross_layer_context_smoke.py
