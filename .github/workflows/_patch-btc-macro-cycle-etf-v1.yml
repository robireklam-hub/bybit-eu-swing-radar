name: Patch BTC macro cycle ETF v1 routes and BLS fallback

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  RADAR_API_KEY: test-radar-key
  COINALYZE_API_KEY: test-coinalyze-key

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/btc-macro-cycle-etf-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Wire BLS fallback, closed daily candle, and research routes
        run: |
          python - <<'PY'
          from pathlib import Path

          event_path = Path('bybit_eu_swing_radar/backend/app/research_event_tokenomics_api.py')
          text = event_path.read_text()
          import_line = 'from research.bls_schedule_fallback import embedded_bls_2026_events\n'
          marker = 'from research.event_tokenomics_shadow import ('
          if import_line not in text:
              text = text.replace(marker, import_line + '\n' + marker)
          old = '''async def _fetch_bls(client: httpx.AsyncClient) -> tuple[list[dict[str, Any]], dict[str, Any]]:\n    response = await client.get(BLS_ICS_URL)\n    response.raise_for_status()\n    events = parse_bls_ics(response.text)\n    return events, _source_status("LIVE", events=len(events), official=True, url=BLS_ICS_URL)\n'''
          new = '''async def _fetch_bls(client: httpx.AsyncClient) -> tuple[list[dict[str, Any]], dict[str, Any]]:\n    try:\n        response = await client.get(BLS_ICS_URL)\n        response.raise_for_status()\n        events = parse_bls_ics(response.text)\n        return events, _source_status("LIVE", events=len(events), official=True, url=BLS_ICS_URL)\n    except Exception as exc:\n        events = embedded_bls_2026_events()\n        return events, _source_status(\n            "PARTIAL",\n            events=len(events),\n            official=True,\n            url=BLS_ICS_URL,\n            fallback_mode="EMBEDDED_OFFICIAL_2026",\n            reason=f"{type(exc).__name__}: {str(exc)[:120]}",\n        )\n'''
          if old not in text and 'fallback_mode="EMBEDDED_OFFICIAL_2026"' not in text:
              raise SystemExit('BLS fetch block not found')
          text = text.replace(old, new)
          event_path.write_text(text)

          btc_path = Path('bybit_eu_swing_radar/backend/app/research_btc_macro_cycle_etf_api.py')
          text = btc_path.read_text()
          old = '''    payload = response.json()\n    if int(payload.get("retCode", -1)) != 0:\n        raise RuntimeError(f"Bybit kline error {payload.get('retCode')}")\n    return summarize_btc_price(payload), _source_status("LIVE", provider="Bybit EU", symbol="BTCUSDC", url=url)\n'''
          new = '''    payload = response.json()\n    if int(payload.get("retCode", -1)) != 0:\n        raise RuntimeError(f"Bybit kline error {payload.get('retCode')}")\n    day_start_ms = int(datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0).timestamp() * 1000)\n    result = dict(payload.get("result") or {})\n    rows = result.get("list") or []\n    result["list"] = [row for row in rows if isinstance(row, (list, tuple)) and row and int(row[0]) < day_start_ms]\n    closed_payload = {**payload, "result": result}\n    return summarize_btc_price(closed_payload), _source_status("LIVE", provider="Bybit EU", symbol="BTCUSDC", closed_daily_only=True, url=url)\n'''
          if old not in text and 'closed_daily_only=True' not in text:
              raise SystemExit('BTC daily block not found')
          text = text.replace(old, new)
          btc_path.write_text(text)

          main_path = Path('bybit_eu_swing_radar/backend/app/main.py')
          text = main_path.read_text()
          block = '''\n\n# Research-only BTC macro/cycle/ETF shadow. It records descriptive context\n# and has no strategy/scoring/eligibility/execution mutation path.\nfrom app.research_btc_macro_cycle_etf_api import attach_btc_macro_cycle_etf_research\n\nattach_btc_macro_cycle_etf_research(app, require_api_key)\n'''
          if 'attach_btc_macro_cycle_etf_research(app, require_api_key)' not in text:
              main_path.write_text(text.rstrip() + block)
          PY
      - name: Run targeted tests and route contract
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pytest -q test_bls_schedule_fallback.py test_event_tokenomics_shadow.py test_research_event_tokenomics_api.py test_btc_macro_cycle_etf_shadow.py test_research_btc_macro_cycle_etf_api.py test_production_btc_macro_cycle_etf_shadow_smoke.py
          python - <<'PY'
          from app.main import app
          routes = {route.path for route in app.routes}
          required = {
              '/v1/research/btc-macro-cycle-etf/spec',
              '/v1/research/btc-macro-cycle-etf/capture',
              '/v1/research/btc-macro-cycle-etf/status',
          }
          missing = required - routes
          assert not missing, f'missing BTC macro/cycle/ETF routes: {sorted(missing)}'
          PY
          python -m compileall -q app research scripts/production_btc_macro_cycle_etf_shadow_smoke.py
      - name: Commit validated wiring and fallback
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bybit_eu_swing_radar/backend/app/main.py bybit_eu_swing_radar/backend/app/research_event_tokenomics_api.py bybit_eu_swing_radar/backend/app/research_btc_macro_cycle_etf_api.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research: wire BTC macro cycle ETF shadow"
          git pull --rebase origin research/btc-macro-cycle-etf-v1
          git push origin HEAD:research/btc-macro-cycle-etf-v1
