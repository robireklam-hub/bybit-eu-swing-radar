name: Swing API consistency smoke

on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: swing-api-consistency-smoke-production
  cancel-in-progress: true

jobs:
  consistency-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify compact agent scan, fresh symbol reads and research isolation
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_api_consistency_smoke.py
