name: Patch policy status SQL once

on:
  push:
    branches: [fix/policy-catalyst-status-sql]
    paths: [".github/workflows/patch-policy-status-sql.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/policy-catalyst-status-sql
      - name: Fix timestamptz lookback query
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bybit_eu_swing_radar/backend/app/research_policy_catalyst_api.py')
          text = p.read_text()
          old = '''            WHERE spec_version=$1 AND first_seen_at >= $2 - INTERVAL '24 hours'\n            ORDER BY first_seen_at DESC\n            LIMIT 25\n            \"\"\",\n            SPEC_VERSION,\n            now,\n'''
          new = '''            WHERE spec_version=$1 AND first_seen_at >= NOW() - INTERVAL '24 hours'\n            ORDER BY first_seen_at DESC\n            LIMIT 25\n            \"\"\",\n            SPEC_VERSION,\n'''
          assert old in text
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/patch-policy-status-sql.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bybit_eu_swing_radar/backend/app/research_policy_catalyst_api.py .github/workflows/patch-policy-status-sql.yml
          git commit -m "Fix policy catalyst status lookback SQL"
          git push origin HEAD:fix/policy-catalyst-status-sql
