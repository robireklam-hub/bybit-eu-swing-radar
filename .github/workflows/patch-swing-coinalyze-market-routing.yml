name: Patch swing Coinalyze market routing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/swing-coinalyze-market-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply deterministic source and regression-test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          worker = 'bybit_eu_swing_radar/backend/worker.py'
          tests = 'bybit_eu_swing_radar/backend/test_swing_coinalyze_context.py'
          smoke = 'bybit_eu_swing_radar/backend/scripts/production_swing_coinalyze_smoke.py'
          smoke_tests = 'bybit_eu_swing_radar/backend/test_production_swing_coinalyze_smoke.py'

          replace_once(
              worker,
              '''    async def future_markets(self) -> list[dict[str, Any]]:\n        return await self.get("/future-markets")\n\n    async def batch_current(self, endpoint: str, symbols: list[str], convert_to_usd: bool = False) -> Any:\n''',
              '''    async def future_markets(self) -> list[dict[str, Any]]:\n        return await self.get("/future-markets")\n\n    async def exchanges(self) -> list[dict[str, Any]]:\n        return await self.get("/exchanges")\n\n    async def batch_current(self, endpoint: str, symbols: list[str], convert_to_usd: bool = False) -> Any:\n''',
          )

          old_selector = '''def select_coinalyze_markets(\n    markets: list[dict[str, Any]], bases: list[str]\n) -> dict[str, dict[str, Any]]:\n    selected: dict[str, dict[str, Any]] = {}\n    priorities = {"bybit": 0, "binance": 1, "okx": 2, "deribit": 3}\n    for base in bases:\n        candidates: list[tuple[int, int, dict[str, Any]]] = []\n        for market in markets:\n            if str(market.get("base_asset", "")).upper() != base:\n                continue\n            if not bool(market.get("is_perpetual", False)):\n                continue\n            quote = str(market.get("quote_asset", "")).upper()\n            if quote not in {"USDT", "USDC", "USD"}:\n                continue\n            exchange = str(market.get("exchange", "")).lower()\n            priority = next((value for key, value in priorities.items() if key in exchange), 9)\n            quote_priority = 0 if quote == "USDC" else 1 if quote == "USDT" else 2\n            candidates.append((priority, quote_priority, market))\n        if candidates:\n            candidates.sort(key=lambda item: (item[0], item[1]))\n            selected[base] = candidates[0][2]\n    return selected\n\n\n'''
          new_selector = '''COINALYZE_REQUIRED_FIELDS = ("current_oi", "funding", "oi_history", "liquidations")\n\n\ndef coinalyze_payload_complete(payload: dict[str, Any]) -> bool:\n    if not payload or payload.get("endpoint_errors"):\n        return False\n    availability = payload.get("availability")\n    return bool(\n        isinstance(availability, dict)\n        and all(bool(availability.get(field)) for field in COINALYZE_REQUIRED_FIELDS)\n    )\n\n\ndef select_coinalyze_markets(\n    markets: list[dict[str, Any]],\n    bases: list[str],\n    *,\n    exchange_names: dict[str, str] | None = None,\n    quote_order: tuple[str, ...] = ("USDC", "USDT", "USD"),\n) -> dict[str, dict[str, Any]]:\n    selected: dict[str, dict[str, Any]] = {}\n    priorities = {"bybit": 0, "binance": 1, "okx": 2, "deribit": 3}\n    exchange_names = {\n        str(code).upper(): str(name)\n        for code, name in (exchange_names or {}).items()\n        if str(code) and str(name)\n    }\n    quote_priorities = {quote.upper(): index for index, quote in enumerate(quote_order)}\n    for base in bases:\n        candidates: list[tuple[int, int, dict[str, Any]]] = []\n        for market in markets:\n            if str(market.get("base_asset", "")).upper() != base:\n                continue\n            if not bool(market.get("is_perpetual", False)):\n                continue\n            quote = str(market.get("quote_asset", "")).upper()\n            if quote not in quote_priorities:\n                continue\n            raw_exchange = str(market.get("exchange", "")).strip()\n            exchange_name = exchange_names.get(raw_exchange.upper(), raw_exchange)\n            exchange_for_rank = exchange_name.lower()\n            priority = next(\n                (value for key, value in priorities.items() if key in exchange_for_rank),\n                9,\n            )\n            resolved_market = dict(market)\n            resolved_market["exchange_code"] = raw_exchange\n            resolved_market["exchange_name"] = exchange_name\n            candidates.append((priority, quote_priorities[quote], resolved_market))\n        if candidates:\n            candidates.sort(key=lambda item: (item[0], item[1]))\n            selected[base] = candidates[0][2]\n    return selected\n\n\n'''
          replace_once(worker, old_selector, new_selector)

          replace_once(
              worker,
              '''    market_map = select_coinalyze_markets(\n        markets,\n        [item.instrument.base for item in selected_analyses],\n    )\n''',
              '''    exchange_names: dict[str, str] = {}\n    exchange_metadata_error: str | None = None\n    quote_order = ("USDC", "USDT", "USD")\n    if partial_safe:\n        # Swing derivatives are context-only. Resolve Coinalyze exchange codes\n        # before venue ranking and prefer the liquid USDT context contract over\n        # venue-equivalent USDC/USD contracts. The legacy day path remains\n        # unchanged and keeps its historical USDC-first selection semantics.\n        quote_order = ("USDT", "USDC", "USD")\n        try:\n            exchange_rows = await api.exchanges()\n            exchange_names = {\n                str(row.get("code", "")).upper(): str(row.get("name", ""))\n                for row in exchange_rows\n                if isinstance(row, dict) and row.get("code") and row.get("name")\n            }\n        except Exception as exc:\n            exchange_metadata_error = f"exchanges: {type(exc).__name__}: {exc}"\n\n    market_map = select_coinalyze_markets(\n        markets,\n        [item.instrument.base for item in selected_analyses],\n        exchange_names=exchange_names,\n        quote_order=quote_order,\n    )\n''',
          )

          replace_once(
              worker,
              '''    endpoint_errors: list[str] = []\n\n    if partial_safe:\n''',
              '''    endpoint_errors: list[str] = (\n        [exchange_metadata_error] if exchange_metadata_error else []\n    )\n\n    if partial_safe:\n''',
          )

          replace_once(
              worker,
              '''    enriched_count = 0\n    for analysis in analyses:\n''',
              '''    enriched_count = 0\n    complete_enriched_count = 0\n    missing_by_field: dict[str, list[str]] = {\n        field: [] for field in COINALYZE_REQUIRED_FIELDS\n    }\n    for analysis in analyses:\n''',
          )

          replace_once(
              worker,
              '''        has_current_oi = symbol in oi_map\n        has_funding = symbol in funding_map\n        has_oi_history = symbol in oi_hist_map\n        has_liquidations = symbol in liq_map\n        if not (\n            has_current_oi\n            or has_funding\n            or has_oi_history\n            or has_liquidations\n        ):\n''',
              '''        has_current_oi = symbol in oi_map\n        has_funding = symbol in funding_map\n        has_oi_history = symbol in oi_hist_map\n        has_liquidations = symbol in liq_map\n        availability = {\n            "current_oi": has_current_oi,\n            "funding": has_funding,\n            "oi_history": has_oi_history,\n            "liquidations": has_liquidations,\n        }\n        if analysis.instrument.symbol in selected_symbols:\n            for field, available in availability.items():\n                if not available:\n                    missing_by_field[field].append(analysis.instrument.symbol)\n        if not any(availability.values()):\n''',
          )

          replace_once(
              worker,
              '''            "exchange": market.get("exchange"),\n            "quote_asset": market.get("quote_asset"),\n''',
              '''            "exchange": market.get("exchange_name") or market.get("exchange"),\n            "exchange_code": market.get("exchange_code") or market.get("exchange"),\n            "quote_asset": market.get("quote_asset"),\n''',
          )

          replace_once(
              worker,
              '''            "is_bybit_specific": "bybit"\n            in str(market.get("exchange", "")).lower(),\n            "availability": {\n                "current_oi": has_current_oi,\n                "funding": has_funding,\n                "oi_history": has_oi_history,\n                "liquidations": has_liquidations,\n            },\n''',
              '''            "is_bybit_specific": "bybit"\n            in str(market.get("exchange_name") or market.get("exchange", "")).lower(),\n            "availability": availability,\n''',
          )

          replace_once(
              worker,
              '''        enriched_count += 1\n\n        if endpoint_errors:\n            analysis.missing_data.append(\n                "Coinalyze derivatives context partial"\n            )\n\n        if mutate_scores:\n''',
              '''        enriched_count += 1\n        if coinalyze_payload_complete(analysis.derivatives):\n            complete_enriched_count += 1\n        else:\n            analysis.missing_data.append(\n                "Coinalyze derivatives context partial"\n            )\n\n        if mutate_scores:\n''',
          )

          replace_once(
              worker,
              '''    if enriched_count < targeted_count:\n        error_parts.append(\n            f"enrichment coverage {enriched_count}/{targeted_count}"\n        )\n\n    complete = enriched_count == targeted_count and not error_parts\n    return complete, "; ".join(error_parts) if error_parts else None\n''',
              '''    if enriched_count < targeted_count:\n        error_parts.append(\n            f"any-field enrichment coverage {enriched_count}/{targeted_count}"\n        )\n    for field, missing_symbols in missing_by_field.items():\n        if missing_symbols:\n            error_parts.append(\n                f"{field} missing for {','.join(sorted(set(missing_symbols)))}"\n            )\n    if complete_enriched_count < targeted_count:\n        error_parts.append(\n            f"complete payload coverage {complete_enriched_count}/{targeted_count}"\n        )\n\n    complete = complete_enriched_count == targeted_count and not error_parts\n    return complete, "; ".join(error_parts) if error_parts else None\n''',
          )

          replace_once(
              worker,
              '''        enriched_count = sum(1 for item in analyses if item.derivatives)\n        coinalyze_target_count = len(coinalyze_targets)\n''',
              '''        enriched_count = sum(1 for item in analyses if item.derivatives)\n        coinalyze_complete_symbols = [\n            item.instrument.symbol\n            for item in coinalyze_targets\n            if coinalyze_payload_complete(item.derivatives)\n        ]\n        coinalyze_complete_count = len(coinalyze_complete_symbols)\n        coinalyze_target_count = len(coinalyze_targets)\n''',
          )

          replace_once(
              worker,
              '''        coinalyze_priority_missing_symbols = [\n            symbol for symbol in coinalyze_priority_symbols\n            if symbol not in set(coinalyze_priority_enriched_symbols)\n        ]\n        regime = build_market_regime(analyses, now, coinalyze_ok, borrow_ok)\n''',
              '''        coinalyze_priority_missing_symbols = [\n            symbol for symbol in coinalyze_priority_symbols\n            if symbol not in set(coinalyze_priority_enriched_symbols)\n        ]\n        coinalyze_priority_complete_symbols = [\n            symbol for symbol in coinalyze_priority_symbols\n            if symbol in set(coinalyze_complete_symbols)\n        ]\n        coinalyze_priority_partial_symbols = [\n            symbol for symbol in coinalyze_priority_enriched_symbols\n            if symbol not in set(coinalyze_priority_complete_symbols)\n        ]\n        regime = build_market_regime(analyses, now, coinalyze_ok, borrow_ok)\n''',
          )

          replace_once(
              worker,
              '''            "coinalyze_enriched_symbols": enriched_count,\n            "coinalyze_target_symbols": coinalyze_target_count,\n''',
              '''            "coinalyze_enriched_symbols": enriched_count,\n            "coinalyze_complete_symbols": coinalyze_complete_count,\n            "coinalyze_complete_symbol_list": coinalyze_complete_symbols,\n            "coinalyze_target_symbols": coinalyze_target_count,\n''',
          )

          replace_once(
              worker,
              '''            "coinalyze_priority_enriched_symbols": coinalyze_priority_enriched_symbols,\n            "coinalyze_priority_missing_symbols": coinalyze_priority_missing_symbols,\n            "coinalyze_priority_full_target_coverage": (\n''',
              '''            "coinalyze_priority_enriched_symbols": coinalyze_priority_enriched_symbols,\n            "coinalyze_priority_complete_symbols": coinalyze_priority_complete_symbols,\n            "coinalyze_priority_partial_symbols": coinalyze_priority_partial_symbols,\n            "coinalyze_priority_missing_symbols": coinalyze_priority_missing_symbols,\n            "coinalyze_priority_full_target_coverage": (\n''',
          )

          replace_once(
              worker,
              '''                        f"rate-budget targets enriched {enriched_count}/{coinalyze_target_count}; "\n                        f"compact priority targeted {len(coinalyze_priority_targeted_symbols)}/"\n                        f"{len(coinalyze_priority_symbols)}, enriched "\n                        f"{len(coinalyze_priority_enriched_symbols)}/"\n                        f"{len(coinalyze_priority_symbols)}; "\n''',
              '''                        f"rate-budget targets any-field enriched {enriched_count}/{coinalyze_target_count}, "\n                        f"complete {coinalyze_complete_count}/{coinalyze_target_count}; "\n                        f"compact priority targeted {len(coinalyze_priority_targeted_symbols)}/"\n                        f"{len(coinalyze_priority_symbols)}, any-field enriched "\n                        f"{len(coinalyze_priority_enriched_symbols)}/"\n                        f"{len(coinalyze_priority_symbols)}, complete "\n                        f"{len(coinalyze_priority_complete_symbols)}/"\n                        f"{len(coinalyze_priority_symbols)}; "\n''',
          )

          replace_once(
              worker,
              '''                    "priority_enriched_symbols": coinalyze_priority_enriched_symbols,\n                    "priority_missing_symbols": coinalyze_priority_missing_symbols,\n                    "missing_fields": [] if coinalyze_ok else [coinalyze_error or "enrichment unavailable"],\n''',
              '''                    "priority_enriched_symbols": coinalyze_priority_enriched_symbols,\n                    "priority_complete_symbols": coinalyze_priority_complete_symbols,\n                    "priority_partial_symbols": coinalyze_priority_partial_symbols,\n                    "priority_missing_symbols": coinalyze_priority_missing_symbols,\n                    "missing_fields": [] if coinalyze_ok else [coinalyze_error or "enrichment unavailable"],\n''',
          )

          replace_once(
              tests,
              '''                "exchange": "Binance",\n''',
              '''                "exchange": "A",\n''',
          )
          replace_once(
              tests,
              '''    async def batch_current(self, endpoint, symbols, convert_to_usd=False):\n''',
              '''    async def exchanges(self):\n        return [{"name": "Binance", "code": "A"}]\n\n    async def batch_current(self, endpoint, symbols, convert_to_usd=False):\n''',
          )
          replace_once(
              tests,
              '''    assert analysis.derivatives["strict_score_mutation_applied"] is False\n    adjustments = analysis.derivatives["context_score_adjustments"]\n''',
              '''    assert analysis.derivatives["strict_score_mutation_applied"] is False\n    assert analysis.derivatives["exchange"] == "Binance"\n    assert analysis.derivatives["exchange_code"] == "A"\n    adjustments = analysis.derivatives["context_score_adjustments"]\n''',
          )

          append_tests = '''\n\ndef test_market_selector_resolves_exchange_codes_and_prefers_swing_usdt_context():\n    markets = [\n        {\n            "symbol": "LIT-PERP.C",\n            "exchange": "C",\n            "base_asset": "LIT",\n            "quote_asset": "USDC",\n            "is_perpetual": True,\n        },\n        {\n            "symbol": "LITUSDT_PERP.A",\n            "exchange": "A",\n            "base_asset": "LIT",\n            "quote_asset": "USDT",\n            "is_perpetual": True,\n        },\n    ]\n\n    selected = worker.select_coinalyze_markets(\n        markets,\n        ["LIT"],\n        exchange_names={"A": "Binance", "C": "Coinbase"},\n        quote_order=("USDT", "USDC", "USD"),\n    )\n\n    assert selected["LIT"]["symbol"] == "LITUSDT_PERP.A"\n    assert selected["LIT"]["exchange_name"] == "Binance"\n    assert selected["LIT"]["exchange_code"] == "A"\n\n\nclass FundingOnlyCoinalyze(FakeCoinalyze):\n    async def batch_current(self, endpoint, symbols, convert_to_usd=False):\n        self.calls.append(endpoint)\n        if endpoint == "/open-interest":\n            return []\n        if endpoint == "/funding-rate":\n            return [{"symbol": symbols[0], "value": 0.0015}]\n        raise AssertionError(endpoint)\n\n    async def batch_history(\n        self, endpoint, symbols, from_ts, to_ts, convert_to_usd=False, interval="4hour"\n    ):\n        self.calls.append(endpoint)\n        if endpoint in {"/open-interest-history", "/liquidation-history"}:\n            return []\n        raise AssertionError(endpoint)\n\n\n@pytest.mark.asyncio\nasync def test_successful_http_with_missing_rows_is_partial_not_ok(monkeypatch):\n    monkeypatch.setattr(worker, "COINALYZE_API_KEY", "test-key")\n    analysis = make_analysis()\n    before = (analysis.expansion_score, analysis.direction_score, analysis.quality_score)\n\n    ok, error = await enrich_coinalyze(\n        [analysis],\n        FundingOnlyCoinalyze(),\n        mutate_scores=False,\n        partial_safe=True,\n    )\n\n    assert ok is False\n    assert error is not None\n    assert "current_oi missing for BTCUSDC" in error\n    assert "oi_history missing for BTCUSDC" in error\n    assert "liquidations missing for BTCUSDC" in error\n    assert "complete payload coverage 0/1" in error\n    assert analysis.derivatives["funding_rate"] == 0.0015\n    assert analysis.derivatives["availability"] == {\n        "current_oi": False,\n        "funding": True,\n        "oi_history": False,\n        "liquidations": False,\n    }\n    assert "Coinalyze derivatives context partial" in analysis.missing_data\n    assert (analysis.expansion_score, analysis.direction_score, analysis.quality_score) == before\n'''
          Path(tests).write_text(Path(tests).read_text() + append_tests)

          replace_once(
              smoke,
              '''    enriched = worker.get("coinalyze_priority_enriched_symbols")\n    missing = worker.get("coinalyze_priority_missing_symbols")\n    if not all(isinstance(value, list) for value in (priority, targeted, enriched, missing)):\n        failures.append("explicit Coinalyze priority coverage lists missing")\n        return failures\n''',
              '''    enriched = worker.get("coinalyze_priority_enriched_symbols")\n    complete = worker.get("coinalyze_priority_complete_symbols")\n    partial = worker.get("coinalyze_priority_partial_symbols")\n    missing = worker.get("coinalyze_priority_missing_symbols")\n    if not all(\n        isinstance(value, list)\n        for value in (priority, targeted, enriched, complete, partial, missing)\n    ):\n        failures.append("explicit Coinalyze priority coverage lists missing")\n        return failures\n''',
          )
          replace_once(
              smoke,
              '''    if set(enriched) & set(missing):\n        failures.append("priority symbol appears in both enriched and missing lists")\n\n    for section in CANDIDATE_SECTIONS:\n''',
              '''    if set(enriched) & set(missing):\n        failures.append("priority symbol appears in both enriched and missing lists")\n    if set(complete) | set(partial) != set(enriched):\n        failures.append("priority complete/partial partition does not equal enriched set")\n    if set(complete) & set(partial):\n        failures.append("priority symbol appears in both complete and partial lists")\n\n    candidate_statuses: dict[str, str] = {}\n    for section in CANDIDATE_SECTIONS:\n        for row in top.get(section, []):\n            if isinstance(row, dict) and isinstance(row.get("symbol"), str):\n                candidate_statuses[row["symbol"]] = str(row.get("derivatives_status"))\n    if {symbol for symbol, value in candidate_statuses.items() if value == "GOOD"} != set(complete):\n        failures.append("GOOD candidate set does not equal complete Coinalyze priority set")\n    if {symbol for symbol, value in candidate_statuses.items() if value == "PARTIAL"} != set(partial):\n        failures.append("PARTIAL candidate set does not equal partial Coinalyze priority set")\n    if {symbol for symbol, value in candidate_statuses.items() if value == "UNAVAILABLE"} != set(missing):\n        failures.append("UNAVAILABLE candidate set does not equal missing Coinalyze priority set")\n\n    sources = status.get("sources")\n    source = next(\n        (row for row in sources if isinstance(row, dict) and row.get("source") == "Coinalyze"),\n        None,\n    ) if isinstance(sources, list) else None\n    if not isinstance(source, dict):\n        failures.append("Coinalyze source health row missing")\n    elif source.get("status") == "ok" and (partial or missing):\n        failures.append("Coinalyze source health is ok while compact candidates are incomplete")\n\n    for section in CANDIDATE_SECTIONS:\n''',
          )
          replace_once(
              smoke,
              '''                "priority_enriched_symbols": worker.get("coinalyze_priority_enriched_symbols"),\n                "priority_missing_symbols": worker.get("coinalyze_priority_missing_symbols"),\n''',
              '''                "priority_enriched_symbols": worker.get("coinalyze_priority_enriched_symbols"),\n                "priority_complete_symbols": worker.get("coinalyze_priority_complete_symbols"),\n                "priority_partial_symbols": worker.get("coinalyze_priority_partial_symbols"),\n                "priority_missing_symbols": worker.get("coinalyze_priority_missing_symbols"),\n''',
          )

          replace_once(
              smoke_tests,
              '''            "coinalyze_priority_enriched_symbols": ["AAAUSDC"],\n            "coinalyze_priority_missing_symbols": [],\n            "coinalyze_priority_full_target_coverage": True,\n        }\n    }\n''',
              '''            "coinalyze_priority_enriched_symbols": ["AAAUSDC"],\n            "coinalyze_priority_complete_symbols": [],\n            "coinalyze_priority_partial_symbols": ["AAAUSDC"],\n            "coinalyze_priority_missing_symbols": [],\n            "coinalyze_priority_full_target_coverage": True,\n        },\n        "sources": [{"source": "Coinalyze", "status": "partial"}],\n    }\n''',
          )
          Path(smoke_tests).write_text(
              Path(smoke_tests).read_text()
              + '''\n\ndef test_evaluate_rejects_ok_source_health_for_partial_candidate():\n    status = status_payload()\n    status["sources"][0]["status"] = "ok"\n    failures = evaluate(top_payload(), status, "abc")\n    assert any("source health is ok" in value for value in failures)\n'''
          )
          PY

      - name: Install backend test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run focused Coinalyze regression tests
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pytest -q \
            test_swing_coinalyze_context.py \
            test_swing_coinalyze_priority.py \
            test_swing_top_candidate_derivatives.py \
            test_production_swing_coinalyze_smoke.py
          python -m compileall -q worker.py app/swing_candidate_context.py scripts/production_swing_coinalyze_smoke.py

      - name: Commit tested patch and remove patch workflow
        run: |
          rm .github/workflows/patch-swing-coinalyze-market-routing.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct swing Coinalyze market routing and health semantics'
          git push origin HEAD:${{ github.head_ref }}
