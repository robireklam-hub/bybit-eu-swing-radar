name: Patch policy point-in-time semantics once

on:
  push:
    branches: [feature/policy-catalyst-feed-v1]
    paths: [".github/workflows/patch-policy-point-in-time.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/policy-catalyst-feed-v1
      - name: Harden bootstrap and coverage semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('bybit_eu_swing_radar/backend/research/policy_catalyst_feed_v1.py')
          text = p.read_text()
          old = '        "market structure",\n'
          assert old in text
          text = text.replace(old, '', 1)
          old = '''    failed = [row for row in source_rows if row.get("status") != "OK"]\n    data_quality = "COMPLETE" if source_rows and not failed else "PARTIAL" if ordered else "DEGRADED"\n'''
          new = '''    failed = [row for row in source_rows if row.get("status") != "OK"]\n    ok_count = sum(1 for row in source_rows if row.get("status") == "OK")\n    data_quality = (\n        "COMPLETE" if source_rows and not failed\n        else "PARTIAL" if ok_count > 0\n        else "DEGRADED"\n    )\n'''
          assert old in text
          p.write_text(text.replace(old, new, 1))

          p = Path('bybit_eu_swing_radar/backend/app/market_context_alerts.py')
          text = p.read_text()
          old = '''        first_seen = _as_utc(row.get("first_seen_at"))\n        if first_seen is None or first_seen < active_after or first_seen > current_time + timedelta(minutes=5):\n            continue\n        visible_events.append(\n'''
          new = '''        first_seen = _as_utc(row.get("first_seen_at"))\n        published_at = _as_utc(row.get("published_at"))\n        if first_seen is None or first_seen < active_after or first_seen > current_time + timedelta(minutes=5):\n            continue\n        # Bootstrap guard: old provider content discovered by the first capture must\n        # not become an ACTIVE catalyst merely because first_seen_at is new.\n        if published_at is not None and published_at < active_after:\n            continue\n        visible_events.append(\n'''
          assert old in text
          p.write_text(text.replace(old, new, 1))

          Path('.github/workflows/patch-policy-point-in-time.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bybit_eu_swing_radar/backend/research/policy_catalyst_feed_v1.py bybit_eu_swing_radar/backend/app/market_context_alerts.py .github/workflows/patch-policy-point-in-time.yml
          git commit -m "Context: harden policy catalyst point-in-time semantics"
          git push origin HEAD:feature/policy-catalyst-feed-v1
