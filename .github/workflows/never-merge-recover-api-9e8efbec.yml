name: NEVER MERGE verify production c69db4e6

on:
  push:
    branches:
      - "ops/recover-api-9e8efbec"
  pull_request:
    paths:
      - ".github/workflows/never-merge-recover-api-9e8efbec.yml"

permissions:
  contents: read

concurrency:
  group: never-merge-verify-production-c69db4e6
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: c69db4e6fce5ad9930bbb9bc3bc7464cba0ace8c
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}

    steps:
      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: c69db4e6fce5ad9930bbb9bc3bc7464cba0ace8c

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact production API SHA
        run: |
          python -u - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ['PRODUCTION_RADAR_API_KEY']
          expected = os.environ['EXPECTED_SHA']
          for attempt in range(60):
              req = Request(base + '/version', headers={'Accept':'application/json','X-Radar-Key':key})
              with urlopen(req, timeout=15) as response:
                  actual = str((json.load(response) or {}).get('commit_sha') or '')
              print(f'API_SHA attempt={attempt+1} actual={actual}', flush=True)
              if actual == expected:
                  print('EXACT API SHA DEPLOYED.', flush=True)
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('exact API SHA not served')
          PY

      - name: Verify swing compact candidate Coinalyze semantics
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_coinalyze_smoke.py

      - name: Verify label-blind swing liquidity event construction
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_event_smoke.py

      - name: Verify label-blind swing liquidity maturity status
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_swing_liquidity_maturity_status.py
