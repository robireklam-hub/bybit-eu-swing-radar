name: Patch swing liquidity proxy wiring

on:
  push:
    branches:
      - research/swing-liquidity-shadow-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/swing-liquidity-shadow-v1
          fetch-depth: 0
      - name: Wire protected production proxy and collector
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('bybit_eu_swing_radar/backend/app/main.py')
          text = main.read_text()
          marker = 'attach_v073_diagnostic_perf_routes(app, require_api_key)\n'
          block = '''attach_v073_diagnostic_perf_routes(app, require_api_key)\n\n# Research-only Bybit EU order-book proxy used by the prospective swing liquidity\n# shadow collector. It has no strategy/scoring/execution mutation path.\nfrom app.research_swing_liquidity_api import attach_research_swing_liquidity_routes\n\nattach_research_swing_liquidity_routes(app, require_api_key)\n'''
          if 'attach_research_swing_liquidity_routes(app, require_api_key)' not in text:
              if marker not in text:
                  raise SystemExit('main.py attach marker not found')
              text = text.replace(marker, block, 1)
              main.write_text(text)

          collector = Path('bybit_eu_swing_radar/backend/research/swing_liquidity_shadow.py')
          c = collector.read_text()
          old_loop = '''    for symbol in sorted({item["symbol"] for item in candidates}):\n        query = urlencode({"category": "spot", "symbol": symbol, "limit": 50})\n        try:\n            payload = _get_json(f"{bybit_base_url.rstrip('/')}/v5/market/orderbook?{query}")\n            if payload.get("retCode") != 0 or not isinstance(payload.get("result"), dict):\n                raise RuntimeError(f"retCode={payload.get('retCode')} retMsg={payload.get('retMsg')}")\n            result = payload["result"]\n            books[symbol] = {\n                "ts": payload.get("time"),\n                "update_id": result.get("u"),\n                "seq": result.get("seq"),\n                "bids": result.get("b") or [],\n                "asks": result.get("a") or [],\n                "costs": [book_cost_metrics(result, notional) for notional in NOTIONALS_USDC],\n            }\n        except Exception as exc:  # fail-open research coverage; never alter live state\n            book_errors[symbol] = f"{type(exc).__name__}: {exc}"\n'''
          new_loop = '''    protected_headers = {\n        "Accept": "application/json",\n        "X-Radar-Key": api_key,\n        "User-Agent": "swing-liquidity-shadow/2",\n    }\n    for symbol in sorted({item["symbol"] for item in candidates}):\n        try:\n            payload = _get_json(\n                f"{base_url.rstrip('/')}/v1/research/swing-liquidity/orderbook/{symbol}",\n                headers=protected_headers,\n            )\n            if payload.get("research_only") is not True or payload.get("live_strategy_mutated") is not False:\n                raise RuntimeError("research orderbook proxy invariant failed")\n            result = {"b": payload.get("bids") or [], "a": payload.get("asks") or []}\n            books[symbol] = {\n                "ts": payload.get("upstream_time_ms"),\n                "data_as_of": payload.get("data_as_of"),\n                "update_id": payload.get("update_id"),\n                "seq": payload.get("seq"),\n                "bids": result["b"],\n                "asks": result["a"],\n                "costs": [book_cost_metrics(result, notional) for notional in NOTIONALS_USDC],\n            }\n        except Exception as exc:  # fail-open research coverage; never alter live state\n            book_errors[symbol] = f"{type(exc).__name__}: {exc}"\n'''
          if old_loop in c:
              c = c.replace(old_loop, new_loop, 1)
              collector.write_text(c)
          elif '/v1/research/swing-liquidity/orderbook/' not in c:
              raise SystemExit('collector direct orderbook block not found')
          PY
      - name: Commit wiring if needed
        run: |
          if git diff --quiet -- bybit_eu_swing_radar/backend/app/main.py bybit_eu_swing_radar/backend/research/swing_liquidity_shadow.py; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bybit_eu_swing_radar/backend/app/main.py bybit_eu_swing_radar/backend/research/swing_liquidity_shadow.py
          git commit -m "research: route liquidity shadow books through Railway"
          git push origin HEAD:research/swing-liquidity-shadow-v1
