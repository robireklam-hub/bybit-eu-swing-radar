name: Verify derivatives liquidation integration 11382b7

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 11382b7c25612fcdfe9e1ce6e89ddc041f438843
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v7
        with:
          ref: 11382b7c25612fcdfe9e1ce6e89ddc041f438843

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact-SHA derivatives liquidation integration
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_derivatives_liquidation_integration_smoke.py
