name: Patch event tokenomics shadow v1 routes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  RADAR_API_KEY: test-radar-key
  COINALYZE_API_KEY: test-coinalyze-key

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/event-tokenomics-shadow-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Wire event tokenomics research routes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bybit_eu_swing_radar/backend/app/main.py')
          text = path.read_text()
          block = '''\n\n# Research-only event/tokenomics shadow. It records catalyst context and\n# has no strategy/scoring/eligibility/execution mutation path.\nfrom app.research_event_tokenomics_api import attach_event_tokenomics_research\n\nattach_event_tokenomics_research(app, require_api_key)\n'''
          marker = 'attach_event_tokenomics_research(app, require_api_key)'
          if marker not in text:
              path.write_text(text.rstrip() + block)
          PY
      - name: Run targeted tests and route contract
        working-directory: bybit_eu_swing_radar/backend
        run: |
          python -m pytest -q test_event_tokenomics_shadow.py test_research_event_tokenomics_api.py test_production_event_tokenomics_shadow_smoke.py
          python - <<'PY'
          from app.main import app
          routes = {route.path for route in app.routes}
          required = {
              '/v1/research/event-tokenomics/spec',
              '/v1/research/event-tokenomics/capture',
              '/v1/research/event-tokenomics/status',
          }
          missing = required - routes
          assert not missing, f'missing event-tokenomics routes: {sorted(missing)}'
          PY
          python -m compileall -q app research scripts/production_event_tokenomics_shadow_smoke.py
      - name: Commit validated route wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bybit_eu_swing_radar/backend/app/main.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Research: wire event tokenomics shadow routes"
          git pull --rebase origin research/event-tokenomics-shadow-v1
          git push origin HEAD:research/event-tokenomics-shadow-v1
