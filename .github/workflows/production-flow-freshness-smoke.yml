name: Production Flow freshness smoke

on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-flow-freshness-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deployed API and worker, then run final smoke
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_flow_freshness_smoke.py
