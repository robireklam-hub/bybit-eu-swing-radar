name: Production Flow freshness smoke

# Pull requests are covered by Backend tests. This workflow never calls Railway's
# API; it runs only after a successful Backend tests run for a push to main.
on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-flow-freshness-smoke-production
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run read-only production Flow freshness smoke
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_flow_freshness_smoke.py
