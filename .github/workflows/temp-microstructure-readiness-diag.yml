name: Temporary microstructure readiness exact-SHA diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diag/microstructure-readiness-31e4c2b'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXACT_MAIN_SHA: 31e4c2be5383d20904b5ef5110e9f424315cbfdf
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
    steps:
      - name: Check out exact production main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_MAIN_SHA }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inspect current production microstructure state
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN_SHA"
          python - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          base = os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          key = os.environ['PRODUCTION_RADAR_API_KEY']
          exact = os.environ['EXACT_MAIN_SHA']

          def get(path):
              req = Request(base + path, headers={
                  'Accept': 'application/json',
                  'X-Radar-Key': key,
                  'User-Agent': 'microstructure-readiness-diag/1',
              })
              with urlopen(req, timeout=40) as response:
                  return json.load(response)

          version = get('/version')
          assert version.get('commit_sha') == exact, (version.get('commit_sha'), exact)
          status = get('/v1/research/microstructure/status')
          readiness = get('/v1/research/microstructure/readiness')
          alignment = get('/v1/research/microstructure/alignment-status')
          effect = get('/v1/research/microstructure/effect-status')

          symbols = [str(x.get('symbol')) for x in (readiness.get('symbols') or []) if x.get('symbol')]
          buckets = {}
          for symbol in symbols:
              qs = urlencode({'symbol': symbol, 'lookback_minutes': 60, 'limit': 1000})
              payload = get('/v1/research/microstructure/buckets?' + qs)
              rows = payload.get('buckets') or payload.get('rows') or payload.get('items') or []
              buckets[symbol] = {
                  'top_level': {k: payload.get(k) for k in ('symbol','bucket_seconds','count','row_count','generated_at','data_as_of') if k in payload},
                  'row_count_observed': len(rows) if isinstance(rows, list) else None,
                  'first_row': rows[0] if isinstance(rows, list) and rows else None,
                  'last_row': rows[-1] if isinstance(rows, list) and rows else None,
              }

          summary = {
              'exact_sha': exact,
              'status': status,
              'readiness': readiness,
              'alignment': alignment,
              'effect': effect,
              'recent_60m_buckets': buckets,
          }
          print('MICROSTRUCTURE_DIAG=' + json.dumps(summary, sort_keys=True, default=str))

          assert readiness.get('research_only') is True
          assert readiness.get('live_strategy_mutated') is False
          assert readiness.get('promotion_allowed') is False
          thresholds = readiness.get('thresholds') or {}
          assert thresholds.get('min_continuity_ratio') == 0.9
          assert thresholds.get('min_book_ready_ratio') == 0.95
          assert thresholds.get('min_book_message_ratio') == 0.95
          assert thresholds.get('max_freshness_seconds') == 30.0
          assert alignment.get('promotion_allowed') is False
          assert effect.get('promotion_allowed') is False
          print('MICROSTRUCTURE READINESS EXACT-SHA DIAGNOSTIC COMPLETE.')
          PY
