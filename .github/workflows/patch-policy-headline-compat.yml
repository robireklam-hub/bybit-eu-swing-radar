name: Patch policy headline compatibility once

on:
  push:
    branches: [feature/policy-catalyst-feed-v1]
    paths: [".github/workflows/patch-policy-headline-compat.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/policy-catalyst-feed-v1
      - name: Preserve existing explicit incomplete-attribution contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bybit_eu_swing_radar/backend/app/market_context_alerts.py')
          text = p.read_text()
          old = 'Piaci volumenimpulzus látható, de a valós idejű policy/liquidity attribúció nem ellenőrizhető friss forráscapture nélkül.'
          new = 'Piaci volumenimpulzus látható, de a valós idejű policy/liquidity attribúció nem teljes és friss forráscapture nélkül nem ellenőrizhető.'
          assert old in text
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/patch-policy-headline-compat.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bybit_eu_swing_radar/backend/app/market_context_alerts.py .github/workflows/patch-policy-headline-compat.yml
          git commit -m "Context: preserve explicit incomplete-attribution wording"
          git push origin HEAD:feature/policy-catalyst-feed-v1
