name: Apply swing coverage wording patch

on:
  push:
    branches:
      - ops/swing-coinalyze-semantic-smoke

permissions:
  contents: write

concurrency:
  group: apply-swing-coverage-wording-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ hashFiles('scripts/apply_swing_coverage_wording_patch.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/swing-coinalyze-semantic-smoke
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact wording patch
        run: python scripts/apply_swing_coverage_wording_patch.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_swing_coverage_wording_patch.py
          rm .github/workflows/apply-swing-coverage-wording-patch.yml
      - name: Commit patched worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: disambiguate swing Coinalyze coverage"
          git push origin HEAD:ops/swing-coinalyze-semantic-smoke
