name: Signal Context Freeze v2

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bybit_eu_swing_radar/backend/research/signal_context_freeze_v2.py"
      - "bybit_eu_swing_radar/backend/app/research_signal_context_freeze_v2_api.py"
      - "bybit_eu_swing_radar/backend/scripts/production_signal_context_freeze_v2_smoke.py"
      - "bybit_eu_swing_radar/backend/app/main.py"
      - ".github/workflows/signal-context-freeze-v2.yml"

permissions:
  contents: read

concurrency:
  group: signal-context-freeze-v2
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Capture and verify prospective Signal-Time Context Freeze v2
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_signal_context_freeze_v2_smoke.py
