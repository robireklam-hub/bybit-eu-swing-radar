name: Signal Context Freeze v2 (retired automatic)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-context-freeze-v2
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Capture and verify retired Signal-Time Context Freeze v2 manually
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_signal_context_freeze_v2_smoke.py
