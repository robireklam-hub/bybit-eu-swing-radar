name: Temporary cleanup immutable-history artifacts

on:
  push:
    branches:
      - research/immutable-snapshot-history-v1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/immutable-snapshot-history-v1
          fetch-depth: 0
      - name: Remove generated bytecode and temporary workflow
        run: |
          find bybit_eu_swing_radar/backend -type f -name '*.pyc' -delete
          find bybit_eu_swing_radar/backend -type d -name '__pycache__' -empty -delete
          rm .github/workflows/temp-clean-immutable-history-pyc.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clean generated bytecode from research PR'
          git push origin HEAD:research/immutable-snapshot-history-v1
