name: Verify production relative strength 51969be

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-relative-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      EXPECTED_SHA: 51969befb2050f85ca0f602a4adab64fe4b0e55e
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v7
        with:
          ref: 51969befb2050f85ca0f602a4adab64fe4b0e55e
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify relative strength production layer
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/production_relative_strength_shadow_smoke.py
