name: Verify swing watchdog and recorder independence dad2c65

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/swing-watchdog-dad2c65'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_API_SHA: dad2c657ec2acdd154203a2fe3e3ba57054ee54b
      EXPECTED_RECORDER_SHA: b54fbd01e086d1f7d1b57d6324d32241e11e2d89
      EXPECTED_RECORDER_STARTED_AT: 2026-08-18T10:00:35.175672+00:00
      PRODUCTION_RADAR_API_BASE_URL: ${{ vars.PRODUCTION_RADAR_API_BASE_URL }}
      PRODUCTION_RADAR_API_KEY: ${{ secrets.PRODUCTION_RADAR_API_KEY }}
      SWING_LIQUIDITY_MIN_AGE_SECONDS: '2700'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dad2c657ec2acdd154203a2fe3e3ba57054ee54b

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Wait for exact production API SHA
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          expected=os.environ['EXPECTED_API_SHA']
          for i in range(40):
              try:
                  with urllib.request.urlopen(base+'/version',timeout=15) as r: p=json.load(r)
                  if p.get('commit_sha')==expected:
                      print('EXACT_API_SHA_VERIFIED='+expected)
                      break
              except Exception:
                  pass
              if i==39: raise SystemExit('FAIL exact production API SHA not serving')
              time.sleep(4)
          PY

      - name: Verify fresh durable capture is skipped by primary guard
        id: due
        working-directory: bybit_eu_swing_radar/backend
        run: python scripts/swing_liquidity_capture_due.py

      - name: Assert primary guard skip
        shell: bash
        run: |
          test "${{ steps.due.outputs.capture_due }}" = "false" || { echo "FAIL fresh durable capture should be skipped"; exit 1; }
          echo "SWING LIQUIDITY PRIMARY DUE GUARD VERIFIED."

      - name: Verify standalone microstructure recorder survived real main deploy
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base=os.environ['PRODUCTION_RADAR_API_BASE_URL'].rstrip('/')
          req=urllib.request.Request(base+'/v1/research/microstructure/status',headers={
              'X-Radar-Key':os.environ['PRODUCTION_RADAR_API_KEY'],
              'Accept':'application/json',
              'User-Agent':'swing-watchdog-recorder-independence/1'})
          with urllib.request.urlopen(req,timeout=15) as r: p=json.load(r)
          safe={k:p.get(k) for k in ['process_role','external_service_healthy','source_commit_sha','started_at','heartbeat_age_seconds','running','singleton_acquired','connected','messages','rows_written','last_error']}
          print('MICROSTRUCTURE_STATUS='+json.dumps(safe,sort_keys=True))
          if p.get('process_role')!='standalone': raise SystemExit('FAIL recorder is not standalone')
          if p.get('external_service_healthy') is not True: raise SystemExit('FAIL external recorder unhealthy')
          if p.get('source_commit_sha')!=os.environ['EXPECTED_RECORDER_SHA']: raise SystemExit('FAIL recorder source SHA changed unexpectedly')
          if p.get('started_at')!=os.environ['EXPECTED_RECORDER_STARTED_AT']: raise SystemExit('FAIL recorder restarted during real main deploy')
          if p.get('connected') is not True or p.get('singleton_acquired') is not True: raise SystemExit('FAIL recorder disconnected or lost singleton')
          if int(p.get('rows_written') or 0)<=9: raise SystemExit('FAIL recorder rows did not continue increasing')
          print('MICROSTRUCTURE REAL MAIN DEPLOYMENT INDEPENDENCE VERIFIED.')
          PY
